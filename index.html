  (function(){
    try {
      var c = document.createElement('canvas');
      c.width = c.height = 180;
      var ctx = c.getContext('2d');
      // Rounded rect background
      var r = 36;
      ctx.beginPath();
      ctx.moveTo(r,0); ctx.lineTo(180-r,0);
      ctx.quadraticCurveTo(180,0,180,r);
      ctx.lineTo(180,180-r);
      ctx.quadraticCurveTo(180,180,180-r,180);

      ctx.lineTo(0,r); ctx.quadraticCurveTo(0,0,r,0);
      ctx.closePath();
      ctx.fillStyle='#C01C2C'; ctx.fill();
      // Gold divider
      ctx.fillStyle='#B8960C';
      ctx.fillRect(20,86,140,8);

      ctx.fillStyle='#B8960C';

      ctx.fillText('T',90,46);
      // M — bottom half
      ctx.fillStyle='#FFFFFF';
      ctx.font='bold 72px Georgia,serif';
      ctx.fillText('M',90,134);
      // Set as icon
      var url = c.toDataURL('image/png');
      var l1 = document.createElement('link');
      l1.rel='apple-touch-icon'; l1.href=url;
      document.head.appendChild(l1);
      var l2 = document.createElement('link');
      l2.rel='icon'; l2.type='image/png'; l2.href=url;
      document.head.appendChild(l2);
    } catch(e){}
  })();

// ── PHASE CONFIG — 4-WEEK ROTATION ───────────────────────────────
// Week 1=Volume, 2=Strength, 3=Hypertrophy, 4=Deload, repeats
function getPhaseType(w) {
  const cycle = ((w - 1) % 4) + 1;
  if (cycle === 1) return "volume";
  if (cycle === 2) return "strength";
  if (cycle === 3) return "hypertrophy";
  return "deload";
}

function getPhase(w) {
  const t = getPhaseType(w);
  const cycleNum = Math.ceil(w / 4);
  if (t === "volume")     return { name:"VOLUME",      type:"volume",     sets:6, rir:"3–4 RIR", restNote:"60–75 sec", color:C.gold,    colorBg:C.goldLight,   colorBorder:C.goldBorder,  note:"High set count. Moderate load. Build work capacity.", cycleNum };
  if (t === "strength")   return { name:"STRENGTH",    type:"strength",   sets:5, rir:"1–2 RIR", restNote:"120–180 sec (compounds)", color:C.scarlet, colorBg:C.scarletLight, colorBorder:C.scarletBorder, note:"Heavy compounds, 5x5. Full 10-min conditioning block. No pump finisher.", cycleNum };
  if (t === "hypertrophy")return { name:"HYPERTROPHY", type:"hypertrophy",sets:4, rir:"2–3 RIR", restNote:"45–60 sec", color:C.blue,    colorBg:C.blueLight,   colorBorder:C.blueBorder,  note:"Higher reps, shorter rest. Time under tension. CBum finishers active.", cycleNum };
  return { name:"DELOAD", type:"deload", sets:2, rir:"3–4 RIR", restNote:"As needed", color:C.green, colorBg:C.greenLight, colorBorder:C.greenBorder, note:"60% load. 2 sets. Full recovery. No finishers. No conditioning.", cycleNum };
}

// ── READINESS ─────────────────────────────────────────────────────
function scoreReadiness(i) {
  const bodyBatteryScore  = parseFloat((i.bodyBattery / 10).toFixed(1));
  const sleepScore        = parseFloat((i.sleepScore / 10).toFixed(1));
  const trainingReadiness = parseFloat((i.trainingReadiness / 10).toFixed(1));
  const hrvScore  = ({favorable:10, balanced:7, unbalanced:4, poor:1})[i.hrv] || 5;
  const hrScore   = ({at:10, "1-3":7, "4-6":4, "7+":1})[i.restingHR] || 5;
  const sorenessScore  = parseFloat((10 - i.soreness).toFixed(1));
  const motivationScore = parseFloat(i.motivation.toFixed(1));
  const total = bodyBatteryScore + sleepScore + trainingReadiness + hrvScore + hrScore + sorenessScore + motivationScore;
  return parseFloat(total.toFixed(1));
}

function getTier(score) {
  if (score >= 56) return { tier:"GREEN",  label:"PUSH",         color:C.green,   bg:C.greenLight,   note:"Train exactly as programmed. Don't waste a green day." };
  if (score >= 42) return { tier:"YELLOW", label:"TRAIN NORMAL", color:C.gold,    bg:C.goldLight,    note:"Add 1 RIR to all sets. No intensity techniques. Skip conditioning finisher." };
  if (score >= 28) return { tier:"ORANGE", label:"REDUCE",       color:"#E08030", bg:"rgba(224,128,48,0.15)", note:"Cut one set. Add 1–2 RIR. Skip conditioning. Three Orange in 7 days = immediate deload." };
  return { tier:"RED",    label:"REST",         color:C.scarlet, bg:C.scarletLight, note:"Do not train. Zone 2 only." };
}

// ── PROGRESSION ───────────────────────────────────────────────────
function parseRange(r) {
  const m = r ? r.match(/(\d+)[–\-](\d+)/) : null;
  return m ? { min:parseInt(m[1]), max:parseInt(m[2]) } : { min:0, max:0 };
}
function checkProgression(log, repRange) {
  const completed = (log||[]).filter(s => s && s.reps && s.weight);
  if (!completed.length) return false;
  const { max } = parseRange(repRange);
  return completed.every(s => parseInt(s.reps) >= max) && parseInt(completed[completed.length-1].rir||0) >= 1;
}

// ── WARM-UP CALC ──────────────────────────────────────────────────
function feederCount(feeders) {
  if (!feeders) return 0;
  if (feeders.includes("3 Set") || feeders.includes("3 Warm")) return 3;
  if (feeders.includes("2 Set") || feeders.includes("2 Warm")) return 2;
  if (feeders.includes("1 Set") || feeders.includes("1 Warm")) return 1;
  return 0;
}
function calcWarmup(w, count) {
  const wt = parseFloat(w);
  if (!wt || isNaN(wt) || wt <= 0) return null;
  const schemes = {
    3: [{pct:45,reps:"6–10"},{pct:65,reps:"4–6"},{pct:85,reps:"3–4"}],
    2: [{pct:50,reps:"6–10"},{pct:70,reps:"4–6"}],
    1: [{pct:60,reps:"6–10"}],
  };
  return (schemes[count]||[]).map(s => ({...s, weight: Math.round(wt * s.pct/100 / 5)*5}));
}

// ── REST TIMER PARSING ────────────────────────────────────────────
function parseRestSeconds(rest) {
  if (!rest) return 90;
  if (rest.includes("180") || rest.includes("3 min")) return 180;
  if (rest.includes("120–180") || rest.includes("2–3")) return 150;
  if (rest.includes("120") || rest.includes("2 min")) return 120;
  if (rest.includes("90"))  return 90;
  if (rest.includes("75"))  return 75;
  if (rest.includes("60–75")||rest.includes("60-75")) return 67;
  if (rest.includes("60"))  return 60;
  if (rest.includes("45"))  return 45;
  if (rest.includes("30"))  return 30;
  return 90;
}

  maintenance: { id:"maintenance", label:"MAINTENANCE DAY", emoji:"🔒", color:C.navyMid, colorBg:C.blueLight, description:"Show up. Keep the habit.", setsMultiplier:0.34, rirAdd:3, rpeCapNote:"RPE 4–5 cap. One working set per exercise.", skipFinisher:true, skipConditioning:true, bannerNote:"Maintenance Day — one working set, RPE 4–5, in and out in 35 min. Habit preserved." },

function getModifiedSets(originalSets, mode) {
  if (typeof originalSets !== "number") return originalSets;
  if (mode.id === "full") return originalSets;
  return Math.max(1, Math.round(originalSets * mode.setsMultiplier));
}

// ── PHASE-BASED SETS ──────────────────────────────────────────────
// Volume=6, Strength=5, Hypertrophy=4 (arm accessories=3), Deload=2
function getPhaseSets(baseSets, phaseType, isArmAccessory) {
  if (phaseType === "deload")      return 2;
  if (phaseType === "volume")      return 6;
  if (phaseType === "strength")    return 5;
  if (phaseType === "hypertrophy") return isArmAccessory ? 3 : 4;
  return baseSets;
}


// ── PHASE-BASED REP RANGES ────────────────────────────────────────
// Primary compounds get 5 reps on strength week
// Accessories keep their programmed range
function getPhaseRepRange(ex, phaseType) {
  const isPrimaryCompound = ex.tier && (
    ex.tier.includes("PRIMARY COMPOUND") ||
    ex.tier.includes("PRIMARY BICEP") ||
    ex.tier.includes("PRIMARY TRICEP") ||
    ex.tier.includes("PRIMARY POSTERIOR")
  );
  if (phaseType === "strength" && isPrimaryCompound) return "5";
  if (phaseType === "deload") return ex.repRange || ex.repRangeA || "8-12";
  return null; // null = use exercise default
}
// ── BOMB DROP SOUND ───────────────────────────────────────────────
function scheduleBombDrop(restSecs) {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    if (ctx.state === "suspended") ctx.resume();
    const t = ctx.currentTime;
    const whistleStart = Math.max(0.1, restSecs - 5);
    const explodeAt = restSecs;
    // Whistle descend
    const w = ctx.createOscillator(); const wg = ctx.createGain();
    w.connect(wg); wg.connect(ctx.destination); w.type = "sine";
    w.frequency.setValueAtTime(1400, t + whistleStart);
    w.frequency.exponentialRampToValueAtTime(60, t + explodeAt - 0.05);
    wg.gain.setValueAtTime(0.0, t + whistleStart);
    wg.gain.linearRampToValueAtTime(0.45, t + whistleStart + 2.0);
    wg.gain.linearRampToValueAtTime(0.0, t + explodeAt);
    w.start(t + whistleStart); w.stop(t + explodeAt + 0.1);
    // Explosion
    const e = ctx.createOscillator(); const eg = ctx.createGain(); const ef = ctx.createBiquadFilter();
    e.connect(ef); ef.connect(eg); eg.connect(ctx.destination);
    e.type = "sawtooth"; ef.type = "lowpass";
    ef.frequency.setValueAtTime(500, t + explodeAt); ef.frequency.exponentialRampToValueAtTime(30, t + explodeAt + 0.7);
    e.frequency.setValueAtTime(80, t + explodeAt); e.frequency.exponentialRampToValueAtTime(15, t + explodeAt + 0.8);
    eg.gain.setValueAtTime(0.0, t + explodeAt - 0.01); eg.gain.linearRampToValueAtTime(1.0, t + explodeAt + 0.04); eg.gain.exponentialRampToValueAtTime(0.001, t + explodeAt + 0.9);
    e.start(t + explodeAt - 0.01); e.stop(t + explodeAt + 1.0);
    // GO tone
    const g = ctx.createOscillator(); const gg = ctx.createGain();
    g.connect(gg); gg.connect(ctx.destination); g.type = "sine";
    g.frequency.setValueAtTime(280, t + explodeAt + 0.7); g.frequency.exponentialRampToValueAtTime(1000, t + explodeAt + 1.2);
    gg.gain.setValueAtTime(0.0, t + explodeAt + 0.65); gg.gain.linearRampToValueAtTime(0.6, t + explodeAt + 0.75); gg.gain.exponentialRampToValueAtTime(0.001, t + explodeAt + 1.4);
    g.start(t + explodeAt + 0.65); g.stop(t + explodeAt + 1.5);
    setTimeout(() => { try { ctx.close(); } catch(e) {} }, (restSecs + 3) * 1000);
  } catch(err) { console.log("Audio:", err); }
}

// ── REST TIMER ────────────────────────────────────────────────────
let globalFlashFn = null;

function RestTimer({ seconds, onDone }) {
  const [remaining, setRemaining] = useState(seconds);
  const [done, setDone] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    ref.current = setInterval(() => {
      setRemaining(r => {
        if (r <= 1) { clearInterval(ref.current); setDone(true); if (navigator.vibrate) navigator.vibrate([400,200,400,200,600]); if (globalFlashFn) globalFlashFn(); return 0; }
        return r - 1;
      });
    }, 1000);
    return () => clearInterval(ref.current);
  }, []);
  const pct = ((seconds - remaining) / seconds) * 100;
  const mins = Math.floor(remaining / 60);
  const secs = remaining % 60;
  const inCountdown = remaining <= 5 && remaining > 0 && !done;
  return (
    <div style={{ background: done ? C.greenLight : inCountdown ? C.goldLight : C.blueLight, border:`1px solid ${done?C.greenBorder:inCountdown?C.goldBorder:C.blueBorder}`, borderLeft:`3px solid ${done?C.green:inCountdown?C.gold:C.blue}`, borderRadius:"6px", padding:"12px 14px", marginTop:"10px", transition:"all 0.3s" }}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}}>
        <div style={{fontSize:"10px",letterSpacing:"2px",color:done?C.green:inCountdown?C.gold:C.blue,textTransform:"uppercase",fontWeight:"bold"}}>
          {done ? "✓ REST COMPLETE — GO!" : inCountdown ? "💣 INCOMING..." : "REST TIMER"}
        </div>
        <div style={{fontSize:inCountdown?"32px":"22px",fontWeight:"bold",color:done?C.green:inCountdown?C.scarlet:C.white,fontVariantNumeric:"tabular-nums",transition:"font-size 0.2s"}}>
          {done ? "💥 GO!" : inCountdown ? remaining : `${mins}:${secs.toString().padStart(2,"0")}`}
        </div>
      </div>
      <div style={{background:"rgba(255,255,255,0.1)",borderRadius:"2px",height:"4px",overflow:"hidden"}}>
        <div style={{background:done?C.green:inCountdown?C.scarlet:C.blue,height:"100%",width:`${pct}%`,transition:"width 1s linear",borderRadius:"2px"}}/>
      </div>
      {done && <div style={{fontSize:"13px",color:C.green,marginTop:"8px",fontWeight:"bold",textAlign:"center",letterSpacing:"2px"}}>LOAD THE BAR</div>}
    </div>
  );
}

// ── MODE WEIGHT MULTIPLIERS ───────────────────────────────────────
const MODE_WEIGHT_MULTIPLIERS = {
  full: { pct: 100 }, functional: { pct: 87 }, maintenance: { pct: 78 },
};

// ── WARM-UP CALC ──────────────────────────────────────────────────
function WarmupCalc({ feeders, color, mode }) {
  const [w, setW] = useState("");
  const count = feederCount(feeders);
  if (!count) return null;
  const activeMode = mode || MODES.full;
  const modeMultiplier = MODE_WEIGHT_MULTIPLIERS[activeMode.id] || MODE_WEIGHT_MULTIPLIERS.full;
  const baseWeight = parseFloat(w);
  const modifiedWeight = (baseWeight && !isNaN(baseWeight) && activeMode.id !== "full")
    ? Math.round(baseWeight * modeMultiplier.pct / 100 / 5) * 5 : null;
  const effectiveWeight = modifiedWeight || baseWeight;
  const sets = calcWarmup(effectiveWeight, count);
  return (
    <div style={{background:C.navy,border:`1px solid ${color}44`,borderLeft:`3px solid ${color}`,borderRadius:"6px",padding:"14px",marginBottom:"14px"}}>
      <div style={{fontSize:"10px",letterSpacing:"2px",color,textTransform:"uppercase",fontWeight:"bold",marginBottom:"10px"}}>Nippard Warm-Up Sets</div>
      <input type="number" placeholder="Enter working weight (lbs)" value={w} onChange={e=>setW(e.target.value)} style={{width:"100%",marginBottom:"10px",textAlign:"left",padding:"10px 12px",background:"#0D1626",border:`1px solid ${C.border}`,borderRadius:"6px",fontSize:"15px",color:C.white}}/>
      {baseWeight > 0 && !isNaN(baseWeight) && activeMode.id !== "full" && modifiedWeight && (
        <div style={{background:activeMode.colorBg,border:`1px solid ${activeMode.color}55`,borderLeft:`3px solid ${activeMode.color}`,borderRadius:"6px",padding:"12px",marginBottom:"12px"}}>
          <div style={{fontSize:"10px",letterSpacing:"1px",color:activeMode.color,textTransform:"uppercase",fontWeight:"bold",marginBottom:"6px"}}>{activeMode.emoji} {activeMode.label} Weight</div>
          <div style={{fontSize:"28px",fontWeight:"bold",color:C.white,lineHeight:1}}>{modifiedWeight}<span style={{fontSize:"14px",fontWeight:"normal",color:C.textMuted}}> lbs</span></div>
          <div style={{fontSize:"12px",color:C.textMuted,marginTop:"4px"}}>{modeMultiplier.pct}% of {baseWeight} lbs · +{activeMode.rirAdd} RIR buffer</div>
        </div>
      )}
      {sets ? sets.map((s,i) => (
        <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:i<sets.length-1?`1px solid ${C.border}`:"none"}}>
          <div style={{fontSize:"12px",color:C.textMuted,letterSpacing:"1px",textTransform:"uppercase"}}>Set {i+1} — {s.pct}%</div>
          <div style={{display:"flex",gap:"16px",alignItems:"center"}}>
            <div style={{fontSize:"20px",fontWeight:"bold",color:C.white}}>{s.weight}<span style={{fontSize:"12px",fontWeight:"normal",color:C.textMuted}}> lbs</span></div>
            <div style={{fontSize:"13px",color:C.textMuted}}>{s.reps} reps</div>
          </div>
        </div>
      )) : <div style={{fontSize:"13px",color:C.textFaint,fontStyle:"italic"}}>Enter working weight to calculate.</div>}
      {sets && <div style={{fontSize:"11px",color:C.textFaint,marginTop:"8px",fontStyle:"italic"}}>Rounded to nearest 5 lbs.</div>}
    </div>
  );
}

// ── SET LOG ROW ───────────────────────────────────────────────────
const activeTimers = {};

function SetLogRow({ si, label, repRange, data, onLog, restSecs, color, exId }) {
  const timerKey = `${exId}_set${si}`;
  const [timerVersion, setTimerVersion] = useState(activeTimers[timerKey]||0);
  const { max } = parseRange(repRange);
  function startTimer() {
    scheduleBombDrop(restSecs);
    const v = (activeTimers[timerKey]||0) + 1;
    activeTimers[timerKey] = v;
    setTimerVersion(v);
  }
  const atMax = data.reps && parseInt(data.reps) >= max && max > 0;
  return (
    <div style={{marginBottom:"10px"}}>
      <div style={{display:"flex",gap:"6px",alignItems:"center"}}>
        <div style={{fontSize:"11px",color:C.textMuted,width:"52px",fontWeight:"bold"}}>{label}</div>
        <input type="number" placeholder={max > 0 ? String(max) : "lbs"} value={data.weight||""} onChange={e=>onLog(si,"weight",e.target.value)} style={{flex:1}}/>
        <input type="number" placeholder={max > 0 ? repRange : "reps"} value={data.reps||""} onChange={e=>onLog(si,"reps",e.target.value)} style={{flex:1,color:atMax?C.green:C.white,borderColor:atMax?C.green:undefined}}/>
        <input type="number" placeholder="RIR" value={data.rir||""} onChange={e=>onLog(si,"rir",e.target.value)} style={{flex:0.7,color:data.rir!==undefined&&parseInt(data.rir)<=1?C.gold:C.white}}/>
        {data.weight && data.reps && (
          <button onClick={startTimer} style={{background:timerVersion>0?"transparent":color,border:`1px solid ${color}`,borderRadius:"6px",padding:"8px 10px",color:timerVersion>0?color:C.white,fontSize:"10px",fontWeight:"bold",letterSpacing:"1px",whiteSpace:"nowrap"}}>▶ REST</button>
        )}
      </div>
      {timerVersion > 0 && <RestTimer key={timerVersion} seconds={restSecs} onDone={()=>{}}/>}
    </div>
  );
}

// ── EXERCISE ROW ──────────────────────────────────────────────────
function ExerciseRow({ ex, session, week, phaseType, logA, logB, onLogA, onLogB, mode }) {
  const [expanded, setExpanded] = useState(false);
  const [logging, setLogging] = useState(false);
  const [usingAlt, setUsingAlt] = useState(false);
  const tierColor = TIER_COLORS[ex.tier] || C.textMuted;
  const activeMode = mode || MODES.full;
  const isOddWeek = week % 2 !== 0;
  const displayName = ex.weekAware ? (isOddWeek ? ex.oddName : ex.evenName) : ex.name;
  const weekLabel = ex.weekAware ? (isOddWeek ? "ODD WEEK" : "EVEN WEEK") : null;

  // Phase-based set count
  const originalSets = typeof ex.sets === "number" ? ex.sets : 4;
  const phaseSets = getPhaseSets(originalSets, phaseType, ex.armAccessory);
  const numSets = activeMode.id === "full" ? phaseSets : getModifiedSets(phaseSets, activeMode);
  const restSecs = parseRestSeconds(ex.rest);
  const completedA = (logA||[]).filter(s=>s&&s.weight&&s.reps);
  const phaseRepRange = getPhaseRepRange(ex, phaseType);
  const progressionA = checkProgression(logA, phaseRepRange || ex.repRange||ex.repRangeA||"");
  const hasFeeders = feederCount(ex.feeders) > 0;

  return (
    <div style={{borderBottom:`1px solid ${C.border}`}}>
      <div onClick={()=>{setExpanded(!expanded);setLogging(false);}} style={{padding:"16px 0",cursor:"pointer",display:"flex",gap:"12px",alignItems:"flex-start"}}>
        <div style={{fontSize:"11px",color:C.textFaint,fontWeight:"bold",minWidth:"26px",paddingTop:"2px"}}>{ex.number}</div>
        <div style={{flex:1}}>
          <div style={{fontSize:"10px",letterSpacing:"2px",color:tierColor,textTransform:"uppercase",fontWeight:"bold",marginBottom:"5px"}}>{ex.tier}</div>
          <div style={{display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap",marginBottom:"6px"}}>
            <div style={{fontSize:"16px",fontWeight:"bold",color:C.white,lineHeight:1.2}}>
              {displayName}{ex.isSuperset && ex.subName ? <span style={{color:C.textMuted,fontWeight:"normal",fontSize:"14px"}}> / {ex.subName}</span> : ""}
            </div>
            {weekLabel && <span style={{fontSize:"9px",letterSpacing:"1px",color:C.white,background:isOddWeek?C.navyMid:C.gold,padding:"2px 7px",borderRadius:"3px",fontWeight:"bold",textTransform:"uppercase"}}>{weekLabel}</span>}
            {progressionA && <span style={{fontSize:"9px",letterSpacing:"1px",color:C.white,background:C.green,padding:"2px 7px",borderRadius:"3px",fontWeight:"bold",textTransform:"uppercase"}}>↑ ADD WEIGHT</span>}
          </div>
          <div style={{fontSize:"13px",color:C.textMuted}}>
            {phaseRepRange ? <span style={{color:C.scarlet,fontWeight:"bold"}}>{phaseRepRange} reps <span style={{fontSize:"11px",fontWeight:"normal",color:C.textMuted}}>(5x5)</span></span> : (ex.isSuperset ? `${ex.repRangeA||ex.repRange} / ${ex.repRangeB||""}` : ex.repRange)} · {numSets}
            {activeMode.id !== "full" && numSets !== phaseSets ? <span style={{color:activeMode.color}}> of {phaseSets}</span> : ""}
            {" "}sets · {phaseType === "strength" && ex.tier && ex.tier.includes("PRIMARY") ? "120–180 sec" : ex.rest}
          </div>
          {activeMode.rpeCapNote && !ex.noLog && typeof ex.sets === "number" && (
            <div style={{fontSize:"11px",color:activeMode.color,marginTop:"3px",fontWeight:"bold"}}>{activeMode.rpeCapNote}</div>
          )}
          {completedA.length > 0 && (
            <div style={{marginTop:"7px",display:"flex",gap:"5px",flexWrap:"wrap"}}>
              {completedA.map((s,si)=>(
                <span key={si} style={{fontSize:"10px",color:C.green,background:C.greenLight,border:`1px solid ${C.greenBorder}`,borderRadius:"3px",padding:"2px 7px"}}>
                  {s.weight}lb×{s.reps}
                </span>
              ))}
            </div>
          )}
        </div>
        <div style={{fontSize:"18px",color:C.textFaint,transition:"transform 0.15s",transform:expanded?"rotate(45deg)":"none",paddingTop:"2px"}}>+</div>
      </div>

// ── BODY COMP TRACKER ─────────────────────────────────────────────
function BodyCompView({ phase }) {
  const [log, setLog] = useState(() => LS.get("tm_bodycomp") || []);
  const [wt, setWt] = useState(""); const [bf, setBf] = useState(""); const [note, setNote] = useState("");
  const [neck, setNeck] = useState(""); const [waist, setWaist] = useState(""); const [height, setHeight] = useState(""); const [navyBF, setNavyBF] = useState("");

  function calcNavyBF() {
    const n = parseFloat(neck), w = parseFloat(waist), h = parseFloat(height);
    if (!n||!w||!h||w<=n) return;
    const result = (86.010 * Math.log10(w - n) - 70.041 * Math.log10(h) + 36.76).toFixed(1);
    setNavyBF(result); setBf(result);
  }
  function addEntry() {
    if (!wt) return;
    const entry = { date: new Date().toLocaleDateString(), weight: parseFloat(wt), bf: bf ? parseFloat(bf) : null, note };
    const newLog = [...log, entry]; setLog(newLog); LS.set("tm_bodycomp", newLog);
    setWt(""); setBf(""); setNote("");
  }

  const recent = [...log].slice(-10);
  const minW = recent.length ? Math.min(...recent.map(e=>e.weight)) - 5 : 180;
  const maxW = recent.length ? Math.max(...recent.map(e=>e.weight)) + 5 : 230;

  return (
    <div style={{padding:"20px 18px"}}>
      <div style={{fontSize:"10px",letterSpacing:"3px",color:C.textFaint,textTransform:"uppercase",marginBottom:"20px",fontWeight:"bold"}}>Body Composition</div>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"18px",marginBottom:"14px"}}>
        <div style={{fontSize:"10px",letterSpacing:"2px",color:phase.color,textTransform:"uppercase",fontWeight:"bold",marginBottom:"4px"}}>Navy BF% Calculator</div>
        <div style={{fontSize:"11px",color:C.textFaint,marginBottom:"14px"}}>Neck · Waist · Height in inches → auto-populates BF%</div>
        <div style={{display:"flex",gap:"8px",marginBottom:"12px"}}>
          {[["Neck (in)",neck,setNeck,"15.5"],["Waist (in)",waist,setWaist,"34.0"],["Height (in)",height,setHeight,"71"]].map(([lbl,val,set,ph])=>(
            <div key={lbl} style={{flex:1}}>
              <div style={{fontSize:"10px",color:C.textFaint,letterSpacing:"1px",textTransform:"uppercase",marginBottom:"5px"}}>{lbl}</div>
              <input type="number" placeholder={ph} value={val} onChange={e=>set(e.target.value)} style={{width:"100%"}}/>
            </div>
          ))}
        </div>
        <button onClick={calcNavyBF} style={{width:"100%",padding:"12px",background:phase.color,border:"none",borderRadius:"6px",color:C.white,fontSize:"11px",fontWeight:"bold",letterSpacing:"2px",textTransform:"uppercase",marginBottom:navyBF?"12px":"0"}}>CALCULATE</button>
        {navyBF && (
          <div style={{background:C.blueLight,border:`1px solid ${C.blueBorder}`,borderLeft:`3px solid ${C.blue}`,borderRadius:"6px",padding:"12px 14px"}}>
            <div style={{fontSize:"10px",letterSpacing:"2px",color:C.blue,textTransform:"uppercase",marginBottom:"3px",fontWeight:"bold"}}>Navy Method Result</div>
            <div style={{fontSize:"26px",fontWeight:"bold",color:C.white}}>{navyBF}% <span style={{fontSize:"13px",color:C.textMuted,fontWeight:"normal"}}>body fat — auto-populated below</span></div>
          </div>
        )}
      </div>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"18px",marginBottom:"24px"}}>
        <div style={{fontSize:"10px",letterSpacing:"2px",color:phase.color,textTransform:"uppercase",fontWeight:"bold",marginBottom:"14px"}}>Log Today</div>
        <div style={{display:"flex",gap:"8px",marginBottom:"12px"}}>
          <div style={{flex:1}}><div style={{fontSize:"10px",color:C.textFaint,letterSpacing:"1px",textTransform:"uppercase",marginBottom:"5px"}}>Weight (lbs)</div><input type="number" placeholder="217" value={wt} onChange={e=>setWt(e.target.value)} style={{width:"100%"}}/></div>
          <div style={{flex:1}}><div style={{fontSize:"10px",color:C.textFaint,letterSpacing:"1px",textTransform:"uppercase",marginBottom:"5px"}}>Body Fat %</div><input type="number" placeholder="23.5" value={bf} onChange={e=>setBf(e.target.value)} style={{width:"100%",borderColor:navyBF&&bf===navyBF?C.blue:undefined}}/></div>
        </div>
        <button onClick={addEntry} style={{width:"100%",padding:"14px",background:phase.color,border:"none",borderRadius:"6px",color:C.white,fontSize:"11px",fontWeight:"bold",letterSpacing:"2px",textTransform:"uppercase"}}>LOG ENTRY</button>
      </div>

      {recent.length >= 2 && (() => {
        const W = 320; const H = 120; const PAD = 20;
        const chartW = W - PAD*2; const chartH = H - PAD*2;
        return (
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"18px",marginBottom:"20px",overflowX:"auto"}}>
            <div style={{fontSize:"10px",letterSpacing:"2px",color:C.textFaint,textTransform:"uppercase",fontWeight:"bold",marginBottom:"14px"}}>Weight Trend</div>
            <svg width={W} height={H}>
              {recent.map((e,i)=>{
                const x = PAD + (i/(recent.length-1))*chartW;
                const y = PAD + chartH - ((e.weight-minW)/(maxW-minW))*chartH;
                return <circle key={i} cx={x} cy={y} r={4} fill={phase.color}/>;
              })}
              {recent.slice(1).map((e,i)=>{
                const x1 = PAD + (i/(recent.length-1))*chartW;
                const y1 = PAD + chartH - ((recent[i].weight-minW)/(maxW-minW))*chartH;
                const x2 = PAD + ((i+1)/(recent.length-1))*chartW;
                const y2 = PAD + chartH - ((e.weight-minW)/(maxW-minW))*chartH;
                return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={phase.color} strokeWidth={2} opacity={0.6}/>;
              })}
            </svg>
          </div>
        );
      })()}

      {log.length > 0 && (
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"18px"}}>
          <div style={{fontSize:"10px",letterSpacing:"2px",color:C.textFaint,textTransform:"uppercase",fontWeight:"bold",marginBottom:"14px"}}>Log History</div>
          {[...log].reverse().slice(0,10).map((e,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:`1px solid ${C.border}`}}>
              <div style={{fontSize:"12px",color:C.textMuted}}>{e.date}</div>
              <div style={{display:"flex",gap:"16px"}}>
                <div style={{fontSize:"14px",fontWeight:"bold",color:C.white}}>{e.weight}<span style={{fontSize:"11px",color:C.textFaint}}> lbs</span></div>
                {e.bf && <div style={{fontSize:"14px",fontWeight:"bold",color:phase.color}}>{e.bf}<span style={{fontSize:"11px",color:C.textFaint}}>%</span></div>}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── CSV EXPORT ────────────────────────────────────────────────────
function exportCSV(sessionLog, readinessLog, bodyCompLog, week) {
  const rows = [["RAYMOND — TACTICAL MONSTER PROTOCOL"],["Exported:",new Date().toLocaleDateString()],["Week:",week],[]];
  rows.push(["SESSION LOG"]);
  rows.push(["Exercise ID","Week","Set","Weight (lbs)","Reps","RIR"]);
  DAY_ORDER.forEach(day => {
    const s = SESSIONS[day];
    if (!s) return;
    (s.exercises||[]).forEach(ex => {
      if (ex.noLog || typeof ex.sets !== "number") return;
      const exId = ex.id;
      ["a","b"].forEach(side => {
        const key = `${exId}_w${week}_${side}`;
        const log = sessionLog[key] || [];
        log.forEach((s, i) => {
          if (s && s.weight) rows.push([exId + side, "Week " + week, "Set " + (i+1), s.weight, s.reps||"", s.rir||""]);
        });
      });
    });
  });
  rows.push([]);
  rows.push(["READINESS LOG"]); rows.push(["Date","Score","Tier"]);
  Object.entries(readinessLog).forEach(([date, entry]) => { rows.push([date, entry.score, entry.tier]); });
  rows.push([]);
  rows.push(["BODY COMPOSITION LOG"]); rows.push(["Date","Weight (lbs)","Body Fat %"]);
  (bodyCompLog||[]).forEach(entry => { rows.push([entry.date, entry.weight, entry.bf||""]); });
  const csv = rows.map(r => r.map(cell => `"${String(cell||"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `raymond_tm_week${week}_${new Date().toISOString().split("T")[0]}.csv`; a.click();
  URL.revokeObjectURL(url);
}

          {/* Sauna note */}
          {session.saunaNote && (
            <div style={{padding:"12px 18px",background:C.goldLight,borderBottom:`1px solid ${C.goldBorder}`}}>
              <div style={{fontSize:"12px",color:C.gold,fontWeight:"bold"}}>{session.saunaNote}</div>
            </div>
          )}

          {/* Warm-up */}
          <div style={{padding:"16px 18px",borderBottom:`1px solid ${C.border}`,background:C.card}}>
            <div style={{fontSize:"10px",letterSpacing:"3px",color:C.textFaint,textTransform:"uppercase",fontWeight:"bold",marginBottom:"10px"}}>Warm-Up</div>
            {session.warmup.map((item,i)=>(
              <div key={i} style={{fontSize:"13px",color:C.textMid,padding:"5px 0",borderBottom:i<session.warmup.length-1?`1px solid ${C.border}`:"none",lineHeight:1.5}}>{item}</div>
            ))}
          </div>

          {/* Exercises */}
          <div style={{padding:"0 18px",background:C.card}}>
            {session.exercises.map(ex=>(
              <ExerciseRow key={ex.id} ex={ex} session={session} week={week} phaseType={phaseType}
                logA={getLogA(ex.id)} logB={getLogB(ex.id)}
                onLogA={(si,field,val)=>handleLog(ex.id,"a",si,field,val)}
                onLogB={(si,field,val)=>handleLog(ex.id,"b",si,field,val)}
                mode={activeMode}/>
            ))}
          </div>

          {/* Finisher + Conditioning + Cooldown */}
          <div style={{padding:"16px 18px 0",background:C.card}}>
            {session.saunaNote && session.saunaNote.includes("NO SAUNA") && (
              <div style={{background:"rgba(255,255,255,0.03)",border:`1px solid ${C.border}`,borderRadius:"6px",padding:"12px 14px",marginBottom:"12px"}}>
                <div style={{fontSize:"11px",color:C.textMuted,lineHeight:1.5}}>🌙 {session.saunaNote}</div>
              </div>
            )}

            {session.finisher && !activeMode.skipFinisher && (
              <ExpandCard label="PUMP FINISHER" sublabel={session.finisher.name} influence={session.finisher.influence} color={session.color} colorBg={session.colorBg}>
                <div style={{fontSize:"10px",letterSpacing:"2px",color:session.color,textTransform:"uppercase",fontWeight:"bold",marginBottom:"4px"}}>{session.finisher.duration}</div>
                <div style={{fontSize:"14px",color:C.white,marginBottom:"10px",lineHeight:1.5}}>{session.finisher.protocol}</div>
                <div style={{fontSize:"13px",color:C.textMuted,lineHeight:1.5}}>{session.finisher.notes}</div>
              </ExpandCard>
            )}

            {session.conditioning && !activeMode.skipConditioning && (
              <ExpandCard label="CONDITIONING" sublabel={phaseType === "strength" ? "10 MIN — Full Block" : "5 MIN"} color={C.scarlet} colorBg={C.scarletLight}>
                {phaseType === "strength" && (
                  <div style={{background:C.scarletLight,border:`1px solid ${C.scarletBorder}`,borderLeft:`3px solid ${C.scarlet}`,borderRadius:"6px",padding:"10px 12px",marginBottom:"12px"}}>
                    <div style={{fontSize:"11px",color:C.scarlet,fontWeight:"bold"}}>Strength Week — Full 10 min conditioning block. No pump finisher.</div>
                  </div>
                )}
                {session.conditioning.options.map((opt,i)=>(
                  <div key={i} style={{marginBottom:i<session.conditioning.options.length-1?"12px":"0"}}>
                    <div style={{fontSize:"11px",letterSpacing:"1px",color:C.scarlet,textTransform:"uppercase",fontWeight:"bold",marginBottom:"4px"}}>Option {i===0?"A":"B"} — {opt.name}</div>
                    <div style={{fontSize:"13px",color:C.textMid,lineHeight:1.5}}>{opt.protocol}</div>
                  </div>
                ))}
              </ExpandCard>
            )}

            {/* Mark Complete */}
            <button onClick={markComplete} disabled={isComplete} style={{width:"100%",padding:"16px",background:isComplete?C.greenLight:session.color,border:`1px solid ${isComplete?C.green:session.color}`,borderRadius:"8px",color:isComplete?C.green:C.white,fontSize:"12px",fontWeight:"bold",letterSpacing:"2px",textTransform:"uppercase",marginTop:"6px",marginBottom:"10px"}}>
              {isComplete ? `✓ SESSION COMPLETE` : "MARK SESSION COMPLETE"}
            </button>

            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"6px",padding:"12px 14px",marginBottom:"16px"}}>
              <div style={{fontSize:"10px",letterSpacing:"2px",color:C.textFaint,textTransform:"uppercase",fontWeight:"bold",marginBottom:"6px"}}>Cool-Down</div>
              <div style={{fontSize:"13px",color:C.textMuted,lineHeight:1.5}}>{session.cooldown}</div>
            </div>
          </div>
        </div>
      )}

      {/* ══ READINESS VIEW ══ */}
      {view === "readiness" && (
        <div style={{padding:"20px 18px"}}>
          <div style={{fontSize:"10px",letterSpacing:"3px",color:C.textFaint,textTransform:"uppercase",marginBottom:"20px",fontWeight:"bold"}}>Daily Readiness — 70 Point System</div>

          {todayScore !== null && (() => {
            const t = getTier(todayScore);
            return (
              <div style={{background:t.bg,border:`1px solid ${t.color}55`,borderLeft:`3px solid ${t.color}`,borderRadius:"8px",padding:"16px",marginBottom:"20px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div><div style={{fontSize:"11px",letterSpacing:"2px",color:t.color,textTransform:"uppercase",fontWeight:"bold",marginBottom:"4px"}}>{t.tier} — {t.label}</div><div style={{fontSize:"13px",color:C.textMid,lineHeight:1.4}}>{t.note}</div></div>
                  <div style={{fontSize:"40px",fontWeight:"bold",color:t.color}}>{todayScore}<span style={{fontSize:"14px",color:C.textFaint}}>/70</span></div>
                </div>
              </div>
            );
          })()}

          {/* Garmin inputs */}
          {[
            {label:"Body Battery",key:"bodyBattery",type:"number",placeholder:"0–100",min:0,max:100},
            {label:"Sleep Score",key:"sleepScore",type:"number",placeholder:"0–100",min:0,max:100},
            {label:"Training Readiness",key:"trainingReadiness",type:"number",placeholder:"0–100",min:0,max:100},
          ].map(f=>(
            <div key={f.key} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"14px 16px",marginBottom:"10px"}}>
              <div style={{fontSize:"11px",color:C.textFaint,letterSpacing:"1px",textTransform:"uppercase",marginBottom:"8px"}}>{f.label} <span style={{color:C.textFaint,fontSize:"10px"}}>(Garmin)</span></div>
              <input type="number" placeholder={f.placeholder} value={ri[f.key]||""} onChange={e=>setRi({...ri,[f.key]:parseFloat(e.target.value)||0})} style={{width:"100%",textAlign:"left"}}/>
            </div>
          ))}

          {[
            {label:"HRV Status",key:"hrv",options:[["favorable","Favorable"],["balanced","Balanced"],["unbalanced","Unbalanced"],["poor","Poor"]]},
            {label:"Resting HR vs 30-Day Avg",key:"restingHR",options:[["at","At or Below"],["1-3","1–3 bpm Above"],["4-6","4–6 bpm Above"],["7+","7+ bpm Above"]]},
          ].map(f=>(
            <div key={f.key} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"14px 16px",marginBottom:"10px"}}>
              <div style={{fontSize:"11px",color:C.textFaint,letterSpacing:"1px",textTransform:"uppercase",marginBottom:"10px"}}>{f.label}</div>
              <div style={{display:"flex",gap:"6px",flexWrap:"wrap"}}>
                {f.options.map(([val,lbl])=>(
                  <button key={val} onClick={()=>setRi({...ri,[f.key]:val})} style={{flex:1,minWidth:"80px",padding:"8px 6px",background:ri[f.key]===val?phase.color+"33":"transparent",border:`1px solid ${ri[f.key]===val?phase.color:C.border}`,borderRadius:"6px",color:ri[f.key]===val?phase.color:C.textMuted,fontSize:"10px",fontWeight:ri[f.key]===val?"bold":"normal"}}>{lbl}</button>
                ))}
              </div>
            </div>
          ))}

          {[
            {label:"Soreness / Pain",key:"soreness",hint:"0 = none, 10 = severe"},
            {label:"Motivation",key:"motivation",hint:"0 = none, 10 = fired up"},
          ].map(f=>(
            <div key={f.key} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"14px 16px",marginBottom:"10px"}}>
              <div style={{fontSize:"11px",color:C.textFaint,letterSpacing:"1px",textTransform:"uppercase",marginBottom:"4px"}}>{f.label}</div>
              <div style={{fontSize:"10px",color:C.textFaint,marginBottom:"10px"}}>{f.hint}</div>
              <input type="number" placeholder="0–10" min={0} max={10} value={ri[f.key]||""} onChange={e=>setRi({...ri,[f.key]:parseFloat(e.target.value)||0})} style={{width:"100%",textAlign:"left"}}/>
            </div>
          ))}

          <button onClick={handleReadiness} style={{width:"100%",padding:"16px",background:phase.color,border:"none",borderRadius:"8px",color:C.white,fontSize:"13px",fontWeight:"bold",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"24px"}}>CALCULATE READINESS</button>

          {todayScore !== null && (() => {
            const bodyBattery = parseFloat((ri.bodyBattery/10).toFixed(1));
            const sleepS = parseFloat((ri.sleepScore/10).toFixed(1));
            const trainR = parseFloat((ri.trainingReadiness/10).toFixed(1));
            const hrv = ({favorable:10,balanced:7,unbalanced:4,poor:1})[ri.hrv]||5;
            const hr = ({at:10,"1-3":7,"4-6":4,"7+":1})[ri.restingHR]||5;
            const soreness = parseFloat((10-ri.soreness).toFixed(1));
            const motivation = parseFloat(ri.motivation.toFixed(1));
            const inputs = [["Body Battery",bodyBattery],["Sleep Score",sleepS],["Training Readiness",trainR],["HRV Status",hrv],["Resting HR",hr],["Soreness",soreness],["Motivation",motivation]];
            return (
              <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"16px",marginBottom:"24px"}}>
                <div style={{fontSize:"10px",letterSpacing:"2px",color:C.textFaint,textTransform:"uppercase",fontWeight:"bold",marginBottom:"12px"}}>Score Breakdown</div>
                {inputs.map(([label,score])=>(
                  <div key={label} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${C.border}`}}>
                    <div style={{fontSize:"13px",color:C.textMid}}>{label}</div>
                    <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
                      <div style={{width:"80px",height:"5px",background:"rgba(255,255,255,0.1)",borderRadius:"2px",overflow:"hidden"}}>
                        <div style={{width:`${(score/10)*100}%`,height:"100%",background:score>=7?C.green:score>=4?C.gold:C.scarlet,borderRadius:"2px"}}/>
                      </div>
                      <div style={{fontSize:"15px",fontWeight:"bold",color:score>=7?C.green:score>=4?C.gold:C.scarlet,minWidth:"30px",textAlign:"right"}}>{score}</div>
                    </div>
                  </div>
                ))}
              </div>
            );
          })()}

          {Object.keys(readinessLog).length > 0 && (
            <div>
              <div style={{fontSize:"10px",letterSpacing:"3px",color:C.textFaint,textTransform:"uppercase",marginBottom:"14px",fontWeight:"bold"}}>Recent History</div>
              {Object.entries(readinessLog).slice(-5).reverse().map(([date,entry])=>{
                const t = getTier(entry.score);
                return (
                  <div key={date} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0",borderBottom:`1px solid ${C.border}`}}>
                    <div style={{fontSize:"13px",color:C.textMuted}}>{date}</div>
                    <div style={{display:"flex",gap:"14px",alignItems:"center"}}>
                      <div style={{fontSize:"10px",color:t.color,letterSpacing:"1px",fontWeight:"bold"}}>{entry.tier}</div>
                      <div style={{fontSize:"16px",color:t.color,fontWeight:"bold"}}>{entry.score}<span style={{fontSize:"11px",color:C.textFaint}}>/70</span></div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* ══ TRACKER VIEW ══ */}
      {view === "tracker" && (
        <div style={{padding:"20px 18px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"20px"}}>
            <div style={{fontSize:"10px",letterSpacing:"3px",color:C.textFaint,textTransform:"uppercase",fontWeight:"bold"}}>Progressive Overload — Week {week}</div>
            <button onClick={()=>exportCSV(sessionLog,readinessLog,LS.get("tm_bodycomp")||[],week)} style={{background:C.navyMid,border:`1px solid ${C.border}`,borderRadius:"6px",padding:"9px 16px",color:C.white,fontSize:"10px",letterSpacing:"1px",textTransform:"uppercase",fontWeight:"bold"}}>⬇ EXPORT CSV</button>
          </div>

          {/* Completion grid */}
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"16px",marginBottom:"22px"}}>
            <div style={{fontSize:"10px",letterSpacing:"2px",color:C.textFaint,textTransform:"uppercase",fontWeight:"bold",marginBottom:"12px"}}>Session Completion — Week {week}</div>
            <div style={{display:"flex",gap:"6px"}}>
              {DAY_ORDER.map(d=>{
                const done = !!completedSessions[`${d}_w${week}`];
                return (
                  <div key={d} style={{flex:1,textAlign:"center"}}>
                    <div style={{padding:"10px 4px",borderRadius:"6px",background:done?C.green:C.card,border:`1px solid ${done?C.green:C.border}`,fontSize:"10px",fontWeight:"bold",color:done?C.white:C.textFaint}}>{done?"✓":d}</div>
                  </div>
                );
              })}
            </div>
          </div>

          {DAY_ORDER.filter(d=>d!=="SUN").map(d=>{
            const s = SESSIONS[d];
            return (
              <div key={d} style={{marginBottom:"24px"}}>
                <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"10px",paddingBottom:"8px",borderBottom:`2px solid ${s.color}44`}}>
                  <div style={{fontSize:"9px",letterSpacing:"3px",color:s.color,textTransform:"uppercase",fontWeight:"bold"}}>{s.fullDay}</div>
                  <div style={{fontSize:"12px",color:C.textFaint}}>{s.focus}</div>
                </div>
                {s.exercises.filter(ex=>typeof ex.sets==="number"&&!ex.noLog).map(ex=>{
                  const logA = getLogA(ex.id);
                  const completedA = (logA||[]).filter(s=>s&&s.weight&&s.reps);
                  const progression = checkProgression(logA, ex.repRange||ex.repRangeA||"");
                  const phaseSets = getPhaseSets(ex.sets, phaseType, ex.armAccessory);
                  const { max } = parseRange(ex.repRange||ex.repRangeA||"");
                  return (
                    <div key={ex.id} style={{marginBottom:"10px",background:C.card,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"13px 15px"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"6px"}}>
                        <div style={{fontSize:"14px",fontWeight:"bold",color:C.white,maxWidth:"220px",lineHeight:1.3}}>
                          {ex.name}{ex.isSuperset&&ex.subName?<span style={{fontSize:"12px",color:C.textFaint,fontWeight:"normal"}}> / {ex.subName}</span>:""}
                        </div>
                        {progression && <span style={{fontSize:"8px",letterSpacing:"1px",background:C.green,color:C.white,padding:"3px 7px",borderRadius:"3px",fontWeight:"bold",whiteSpace:"nowrap"}}>↑ ADD WEIGHT</span>}
                      </div>
                      <div style={{fontSize:"12px",color:C.textMuted,marginBottom:"8px"}}>{phaseSets} × {ex.repRange||ex.repRangeA} · {phase.name}</div>
                      {completedA.length > 0 ? (
                        <div style={{display:"flex",gap:"5px",flexWrap:"wrap"}}>
                          {completedA.map((set,si)=>(
                            <div key={si} style={{background:parseInt(set.reps)>=max?C.greenLight:C.card,border:`1px solid ${parseInt(set.reps)>=max?C.greenBorder:C.border}`,borderRadius:"4px",padding:"4px 9px",fontSize:"12px",color:parseInt(set.reps)>=max?C.green:C.textMid}}>
                              {set.weight}lb×{set.reps} <span style={{color:C.textFaint}}>@{set.rir}RIR</span>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <div style={{fontSize:"12px",color:C.textFaint,fontStyle:"italic"}}>Not logged this week</div>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      )}

      {/* ══ BODY COMP VIEW ══ */}
      {view === "bodycomp" && <BodyCompView phase={phase}/>}

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
