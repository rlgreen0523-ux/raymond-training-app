// ── PHASE ────────────────────────────────────────────────────────
function getPhase(w) {
  if (w <= 2) return { name:"CALIBRATION", rir:"3–4 RIR", color:"#7B9E87", weeks:"1–2", note:"Movement quality over load. No intensity techniques. Find baseline weights." };
  if (w <= 4) return { name:"LOADING", rir:"2–3 RIR", color:"#C8A96E", weeks:"3–4", note:"True working weights established. Still no intensity techniques." };
  if (w <= 7) return { name:"PROGRESSIVE OVERLOAD", rir:"1–2 RIR", color:"#7A8BAD", weeks:"5–7", note:"Double progression in full effect. Add weight when earned." };
  if (w <= 9) return { name:"INTENSIFICATION", rir:"0–1 RIR isolation / 1 RIR compounds", color:"#BF7F7F", weeks:"8–9", note:"Intensity techniques on isolation and machine work ONLY." };
  return { name:"DELOAD", rir:"3–4 RIR", color:"#666", weeks:"10", note:"Volume cut 40–50%. Load at 60–70% of working weight. Recover fully." };
}

// ── READINESS ────────────────────────────────────────────────────
function scoreReadiness(i) {
  let s = 0;
  s += i.bodyBattery >= 70 ? 4 : i.bodyBattery >= 50 ? 3 : i.bodyBattery >= 30 ? 2 : 1;
  s += i.sleepScore >= 76 ? 4 : i.sleepScore >= 60 ? 3 : i.sleepScore >= 45 ? 2 : 1;
  s += ({favorable:4,balanced:3,unbalanced:2,poor:1})[i.hrv] || 2;
  s += i.restingHR === "at" ? 4 : i.restingHR === "1-3" ? 3 : i.restingHR === "4-6" ? 2 : 1;
  s += i.soreness <= 2 ? 4 : i.soreness <= 4 ? 3 : i.soreness <= 6 ? 2 : 1;
  s += i.motivation >= 8 ? 4 : i.motivation >= 6 ? 3 : i.motivation >= 4 ? 2 : 1;
  return s;
}
function getTier(score) {
  if (score >= 20) return { tier:"GREEN", label:"PUSH", color:"#7B9E87", note:"Train exactly as programmed. Don't waste a green day." };
  if (score >= 15) return { tier:"YELLOW", label:"TRAIN NORMAL", color:"#C8A96E", note:"Add 1 RIR to all sets. No intensity techniques. Skip Friday conditioning finisher." };
  if (score >= 10) return { tier:"ORANGE", label:"REDUCE", color:"#E09B50", note:"Cut one set per exercise. Add 1–2 RIR. Skip conditioning finisher. Three Orange days in 7 = immediate deload." };
  return { tier:"RED", label:"REST", color:"#C85050", note:"Do not train. Zone 2 only — 20–30 min easy walk or bike. No session is worth having at this score." };
}

// ── PROGRESSION ──────────────────────────────────────────────────
function parseRange(r) {
  const m = r.match(/(\d+)[–\-](\d+)/);
  return m ? { min:parseInt(m[1]), max:parseInt(m[2]) } : { min:0, max:0 };
}
function checkProgression(log, repRange) {
  const completed = (log||[]).filter(s => s && s.reps && s.weight);
  if (!completed.length) return false;
  const { max } = parseRange(repRange);
  return completed.every(s => parseInt(s.reps) >= max) && parseInt(completed[completed.length-1].rir||0) >= 1;
}

  "ZONE 2 SESSION":"#777","OPTIONAL":"#555",
};

// ── COMPONENTS ───────────────────────────────────────────────────

function WeekDots({ week, phase, onChange }) {
  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:"5px"}}>
      <div style={{fontSize:"9px",color:"#333",letterSpacing:"2px",textTransform:"uppercase"}}>WEEK</div>
      <div style={{display:"flex",gap:"3px"}}>
        {[...Array(10)].map((_,i) => (
          <div key={i} onClick={() => onChange(i+1)} style={{
            width:"17px",height:"17px",borderRadius:"2px",display:"flex",alignItems:"center",justifyContent:"center",
            background: week===i+1 ? phase.color : "#111",
            border:`1px solid ${week===i+1 ? phase.color : "#1E1E1E"}`,
            color: week===i+1 ? "#0A0A0A" : "#2A2A2A",
            fontSize:"9px",fontWeight:"bold",cursor:"pointer",
          }}>{i+1}</div>
        ))}
      </div>
    </div>
  );
}

function PhaseBadge({ phase }) {
  return (
    <div style={{background:"#0C0C0C",border:`1px solid ${phase.color}33`,borderLeft:`3px solid ${phase.color}`,borderRadius:"3px",padding:"7px 12px",marginBottom:"12px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div>
          <div style={{fontSize:"8px",letterSpacing:"2px",color:phase.color,textTransform:"uppercase"}}>{phase.name} — WKS {phase.weeks}</div>
          <div style={{fontSize:"11px",color:"#666",marginTop:"2px"}}>{phase.rir}</div>
        </div>
        <div style={{fontSize:"10px",color:"#444",maxWidth:"160px",textAlign:"right",lineHeight:1.4}}>{phase.note}</div>
      </div>
    </div>
  );
}

function ExerciseRow({ ex, session, week, log, onLog }) {
  const [expanded, setExpanded] = useState(false);
  const [logging, setLogging] = useState(false);
  const tierColor = TIER_COLORS[ex.tier] || "#555";
  const numSets = typeof ex.sets === "number" ? ex.sets : 3;
  const completed = (log||[]).filter(s => s && s.weight && s.reps);
  const progression = checkProgression(log, ex.repRange);

  return (
    <div style={{borderBottom:"1px solid #111"}}>
      <div onClick={() => {setExpanded(!expanded);setLogging(false);}} style={{padding:"15px 0",cursor:"pointer",display:"flex",gap:"12px",alignItems:"flex-start"}}>
        <div style={{fontSize:"10px",color:"#222",fontWeight:"bold",minWidth:"20px",paddingTop:"2px"}}>{ex.number}</div>
        <div style={{flex:1}}>
          <div style={{fontSize:"8px",letterSpacing:"2px",color:tierColor,textTransform:"uppercase",marginBottom:"4px"}}>{ex.tier}</div>
          <div style={{display:"flex",alignItems:"center",gap:"6px",flexWrap:"wrap",marginBottom:"5px"}}>
            <div style={{fontSize:"14px",fontWeight:"bold",color:"#E8E4DC",lineHeight:1.2}}>{ex.name}</div>
            {ex.preferred && <span style={{fontSize:"7px",letterSpacing:"1px",color:"#0A0A0A",background:session.color,padding:"2px 5px",borderRadius:"2px",fontWeight:"bold",textTransform:"uppercase"}}>PREFERRED</span>}
            {progression && <span style={{fontSize:"7px",letterSpacing:"1px",color:"#0A0A0A",background:"#7B9E87",padding:"2px 5px",borderRadius:"2px",fontWeight:"bold",textTransform:"uppercase"}}>↑ ADD WEIGHT</span>}
          </div>
          <div style={{fontSize:"11px",color:"#555"}}>{ex.sets} sets · {ex.repRange} · Rest: {ex.rest}</div>
          {ex.alt && <div style={{fontSize:"10px",color:"#333",marginTop:"3px",fontStyle:"italic"}}>Alt: {ex.alt}</div>}
          {completed.length > 0 && (
            <div style={{marginTop:"5px",display:"flex",gap:"4px",flexWrap:"wrap"}}>
              {completed.map((s,si) => (
                <span key={si} style={{fontSize:"9px",color:"#7B9E87",background:"#0D150F",border:"1px solid #1A2E1F",borderRadius:"2px",padding:"2px 5px"}}>
                  {s.weight}lb×{s.reps}
                </span>
              ))}
            </div>
          )}
        </div>
        <div style={{fontSize:"14px",color:"#252525",transition:"transform 0.15s",transform:expanded?"rotate(45deg)":"none"}}>+</div>
      </div>

      {expanded && (
        <div style={{paddingBottom:"16px",paddingLeft:"32px"}} onClick={e => e.stopPropagation()}>
          {ex.feeders && (
            <div style={{background:"#0C0C0C",border:"1px solid #181818",borderRadius:"3px",padding:"9px 12px",marginBottom:"10px"}}>
              <div style={{fontSize:"8px",letterSpacing:"2px",color:"#333",textTransform:"uppercase",marginBottom:"4px"}}>Nippard Feeder Sets</div>
              <div style={{fontSize:"11px",color:"#666",lineHeight:1.5}}>{ex.feeders}</div>
            </div>
          )}
          <div style={{fontSize:"12px",color:"#777",lineHeight:1.7,marginBottom:"10px"}}>{ex.notes}</div>
          {ex.spineFlag && (
            <div style={{background:"#120808",border:"1px solid #321212",borderLeft:"3px solid #A04040",borderRadius:"3px",padding:"8px 12px",marginBottom:"10px"}}>
              <div style={{fontSize:"8px",letterSpacing:"2px",color:"#A04040",textTransform:"uppercase",marginBottom:"3px"}}>Spine Flag</div>
              <div style={{fontSize:"11px",color:"#804040",lineHeight:1.5}}>{ex.spineFlag}</div>
            </div>
          )}
          {typeof ex.sets === "number" && ex.tier !== "SUPERSET — CORE" && (
            <>
              <button onClick={() => setLogging(!logging)} style={{
                background:logging?session.color:"transparent",
                border:`1px solid ${logging?session.color:"#2A2A2A"}`,
                borderRadius:"3px",padding:"7px 14px",
                color:logging?"#0A0A0A":"#555",
                fontSize:"9px",letterSpacing:"2px",textTransform:"uppercase",
                marginBottom:logging?"12px":"0",
              }}>
                {logging ? "CLOSE LOG" : "LOG SETS"}
              </button>
              {logging && (
                <div>
                  <div style={{display:"flex",gap:"6px",marginBottom:"8px"}}>
                    <div style={{fontSize:"9px",color:"#333",width:"42px"}}></div>
                    <div style={{fontSize:"9px",color:"#333",flex:1,textAlign:"center",letterSpacing:"1px",textTransform:"uppercase"}}>LBS</div>
                    <div style={{fontSize:"9px",color:"#333",flex:1,textAlign:"center",letterSpacing:"1px",textTransform:"uppercase"}}>REPS</div>
                    <div style={{fontSize:"9px",color:"#333",flex:1,textAlign:"center",letterSpacing:"1px",textTransform:"uppercase"}}>RIR</div>
                  </div>
                  {[...Array(numSets)].map((_,si) => {
                    const setData = (log||[])[si] || {};
                    return (
                      <div key={si} style={{display:"flex",gap:"6px",alignItems:"center",marginBottom:"7px"}}>
                        <div style={{fontSize:"10px",color:"#333",width:"42px"}}>Set {si+1}</div>
                        <input type="number" placeholder="0" value={setData.weight||""} onChange={e => onLog(si,"weight",e.target.value)} style={{flex:1}}/>
                        <input type="number" placeholder="0" value={setData.reps||""} onChange={e => onLog(si,"reps",e.target.value)} style={{flex:1}}/>
                        <input type="number" placeholder="0" value={setData.rir||""} onChange={e => onLog(si,"rir",e.target.value)} style={{flex:1, color: setData.rir!==undefined && parseInt(setData.rir)<=1 ? "#C8A96E" : "#E8E4DC"}}/>
                      </div>
                    );
                  })}
                  {progression && (
                    <div style={{background:"#0D150F",border:"1px solid #1E3A25",borderLeft:"3px solid #7B9E87",borderRadius:"3px",padding:"8px 12px",marginTop:"8px"}}>
                      <div style={{fontSize:"8px",letterSpacing:"2px",color:"#7B9E87",textTransform:"uppercase",marginBottom:"3px"}}>Double Progression</div>
                      <div style={{fontSize:"11px",color:"#5A8A6A",lineHeight:1.4}}>All sets at top of range with RIR ≥ 1. Add weight next session.</div>
                    </div>
                  )}
                </div>
              )}
            </>
          )}
        </div>
      )}
    </div>
  );
}

function ExpandCard({ label, sublabel, influence, color, children }) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{marginBottom:"10px"}}>
      <div onClick={() => setOpen(!open)} style={{
        background:open?"#0D0D0D":"transparent",
        border:`1px solid ${open?color:"#1E1E1E"}`,
        borderRadius:"3px",padding:"13px 14px",cursor:"pointer",
        display:"flex",justifyContent:"space-between",alignItems:"center",
      }}>
        <div>
          <div style={{fontSize:"8px",letterSpacing:"3px",color:open?color:"#333",textTransform:"uppercase",marginBottom:"3px"}}>{label}</div>
          <div style={{fontSize:"13px",fontWeight:"bold",color:open?"#E8E4DC":"#444"}}>{sublabel}</div>
          {influence && <div style={{fontSize:"9px",color:"#333",marginTop:"2px",fontStyle:"italic"}}>{influence}</div>}
        </div>
        <div style={{fontSize:"14px",color:open?color:"#2A2A2A",transition:"transform 0.15s",transform:open?"rotate(45deg)":"none"}}>+</div>
      </div>
      {open && (
        <div style={{background:"#0C0C0C",border:"1px solid #181818",borderTop:"none",borderRadius:"0 0 3px 3px",padding:"14px"}}>
          {children}
        </div>
      )}
    </div>
  );
}

// ── MAIN APP ─────────────────────────────────────────────────────
function App() {
  const [view, setView] = useState("session");
  const [activeDay, setActiveDay] = useState("MON");
  const [week, setWeek] = useState(() => LS.get("block1_week") || 1);
  const [sessionLog, setSessionLog] = useState(() => LS.get("block1_log") || {});
  const [readinessLog, setReadinessLog] = useState(() => LS.get("block1_readiness") || {});
  const [ri, setRi] = useState({bodyBattery:70,sleepScore:75,hrv:"favorable",restingHR:"at",soreness:2,motivation:8});
  const [todayScore, setTodayScore] = useState(null);

  const phase = getPhase(week);
  const session = SESSIONS[activeDay];
  const today = new Date().toDateString();

  function handleWeekChange(w) { setWeek(w); LS.set("block1_week", w); }

  function getLog(exId) { return sessionLog[`${exId}_w${week}`] || []; }

  function handleLog(exId, setIndex, field, value) {
    const key = `${exId}_w${week}`;
    const curr = sessionLog[key] || [];
    const updated = [...curr];
    if (!updated[setIndex]) updated[setIndex] = {};
    updated[setIndex][field] = value;
    const newLog = {...sessionLog, [key]: updated};
    setSessionLog(newLog);
    LS.set("block1_log", newLog);
  }

  function handleReadiness() {
    const score = scoreReadiness(ri);
    const entry = { score, tier: getTier(score).tier, date: today };
    const newLog = {...readinessLog, [today]: entry};
    setReadinessLog(newLog);
    setTodayScore(score);
    LS.set("block1_readiness", newLog);
  }

  return (
    <div style={{minHeight:"100vh",background:"#0A0A0A",color:"#E8E4DC",fontFamily:"Georgia,'Times New Roman',serif",paddingBottom:"80px"}}>

      {/* TOP NAV */}
      <div style={{background:"#080808",borderBottom:"1px solid #1A1A1A",padding:"18px 18px 0",position:"sticky",top:0,zIndex:20}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"12px"}}>
          <div>
            <div style={{fontSize:"8px",letterSpacing:"4px",color:"#2A2A2A",textTransform:"uppercase",marginBottom:"3px"}}>AmFam Swift Creek</div>
            <div style={{fontSize:"14px",fontWeight:"bold",letterSpacing:"2px",color:"#E8E4DC",textTransform:"uppercase"}}>Block 1 — Hypertrophy</div>
          </div>
          <WeekDots week={week} phase={phase} onChange={handleWeekChange}/>
        </div>
        <PhaseBadge phase={phase}/>
        <div style={{display:"flex",borderBottom:"1px solid #1A1A1A"}}>
          {[["session","SESSION"],["readiness","READINESS"],["tracker","TRACKER"]].map(([v,l]) => (
            <button key={v} onClick={() => setView(v)} style={{
              flex:1,padding:"10px 4px",background:"transparent",border:"none",
              borderBottom:`2px solid ${view===v?phase.color:"transparent"}`,
              color:view===v?phase.color:"#444",
              fontSize:"9px",letterSpacing:"2px",textTransform:"uppercase",
            }}>{l}</button>
          ))}
        </div>
      </div>

      {/* SESSION VIEW */}
      {view === "session" && (
        <div>
          <div style={{padding:"12px 18px",borderBottom:"1px solid #111",display:"flex",gap:"5px"}}>
            {DAY_ORDER.map(d => (
              <button key={d} onClick={() => setActiveDay(d)} style={{
                flex:1,padding:"8px 2px",
                background:activeDay===d?SESSIONS[d].color:"transparent",
                border:`1px solid ${activeDay===d?SESSIONS[d].color:"#1E1E1E"}`,
                borderRadius:"3px",
                color:activeDay===d?"#0A0A0A":"#444",
                fontSize:"9px",fontWeight:activeDay===d?"bold":"normal",
                letterSpacing:"1px",textTransform:"uppercase",
              }}>{d}</button>
            ))}
          </div>

          <div style={{padding:"18px 18px 12px",borderBottom:"1px solid #111"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <div style={{fontSize:"21px",fontWeight:"bold",color:session.color,lineHeight:1.1}}>{session.focus}</div>
                <div style={{fontSize:"11px",color:"#555",marginTop:"3px",fontStyle:"italic"}}>{session.subtitle}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:"9px",color:"#333",letterSpacing:"2px",textTransform:"uppercase"}}>{session.recoveryDemand}</div>
                {session.sauna && <div style={{fontSize:"8px",color:"#E09B50",marginTop:"3px",letterSpacing:"1px",textTransform:"uppercase"}}>SAUNA ✓</div>}
              </div>
            </div>
          </div>

          <div style={{padding:"12px 18px",borderBottom:"1px solid #0F0F0F"}}>
            <div style={{fontSize:"8px",letterSpacing:"3px",color:"#2A2A2A",textTransform:"uppercase",marginBottom:"8px"}}>Warm-Up</div>
            {session.warmup.map((item,i) => (
              <div key={i} style={{fontSize:"12px",color:"#555",padding:"4px 0",borderBottom:i<session.warmup.length-1?"1px solid #0E0E0E":"none",lineHeight:1.4}}>{item}</div>
            ))}
          </div>

          <div style={{padding:"0 18px"}}>
            {session.exercises.map((ex,i) => (
              <ExerciseRow key={ex.id} ex={ex} session={session} week={week}
                log={getLog(ex.id)}
                onLog={(si,field,val) => handleLog(ex.id,si,field,val)}
              />
            ))}
          </div>

          <div style={{padding:"0 18px",marginTop:"14px"}}>
            <div style={{background:"#0C0C0C",border:"1px solid #181818",borderRadius:"3px",padding:"12px 14px",marginBottom:"10px"}}>
              <div style={{fontSize:"8px",letterSpacing:"3px",color:"#2A2A2A",textTransform:"uppercase",marginBottom:"6px"}}>Cooldown</div>
              <div style={{fontSize:"12px",color:"#555",lineHeight:1.6}}>{session.cooldown}</div>
            </div>

            {session.finisher && (
              <ExpandCard label={`Optional Finisher — ${session.finisher.duration}`} sublabel={session.finisher.name} influence={session.finisher.influence} color={session.color}>
                <div style={{background:"#0F0F0F",border:`1px solid ${session.color}22`,borderLeft:`3px solid ${session.color}`,borderRadius:"3px",padding:"9px 12px",marginBottom:"11px"}}>
                  <div style={{fontSize:"8px",letterSpacing:"2px",color:session.color,textTransform:"uppercase",marginBottom:"4px"}}>Protocol</div>
                  <div style={{fontSize:"11px",color:"#777",lineHeight:1.5}}>{session.finisher.protocol}</div>
                </div>
                <div style={{fontSize:"12px",color:"#666",lineHeight:1.7}}>{session.finisher.notes}</div>
              </ExpandCard>
            )}

            {session.sauna ? (
              <ExpandCard label="Dry Sauna — Post-Session" sublabel="15–20 Min" influence={session.sauna.influence} color="#E09B50">
                <div style={{background:"#0F0F0F",border:"1px solid #2A1E0A",borderLeft:"3px solid #E09B50",borderRadius:"3px",padding:"9px 12px",marginBottom:"11px"}}>
                  <div style={{fontSize:"8px",letterSpacing:"2px",color:"#E09B50",textTransform:"uppercase",marginBottom:"4px"}}>Protocol</div>
                  <div style={{fontSize:"11px",color:"#777",lineHeight:1.5}}>{session.sauna.protocol}</div>
                </div>
                <div style={{fontSize:"12px",color:"#666",lineHeight:1.7}}>{session.sauna.rationale}</div>
              </ExpandCard>
            ) : (
              <div style={{background:"#080808",border:"1px solid #141414",borderLeft:"3px solid #1E1E1E",borderRadius:"3px",padding:"12px 14px"}}>
                <div style={{fontSize:"8px",letterSpacing:"3px",color:"#252525",textTransform:"uppercase",marginBottom:"5px"}}>Sauna — Not Today</div>
                <div style={{fontSize:"11px",color:"#333",lineHeight:1.6}}>{session.saunaNote}</div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* READINESS VIEW */}
      {view === "readiness" && (
        <div style={{padding:"20px 18px"}}>
          <div style={{fontSize:"9px",letterSpacing:"3px",color:"#444",textTransform:"uppercase",marginBottom:"18px"}}>Daily Readiness Check</div>

          {todayScore !== null && (() => {
            const t = getTier(todayScore);
            return (
              <div style={{background:`${t.color}15`,border:`1px solid ${t.color}44`,borderLeft:`4px solid ${t.color}`,borderRadius:"4px",padding:"16px",marginBottom:"22px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div>
                    <div style={{fontSize:"20px",fontWeight:"bold",color:t.color}}>{t.tier}</div>
                    <div style={{fontSize:"12px",color:"#888",marginTop:"2px"}}>{t.label}</div>
                  </div>
                  <div style={{fontSize:"26px",fontWeight:"bold",color:t.color}}>{todayScore}<span style={{fontSize:"12px",color:"#555"}}>/24</span></div>
                </div>
                <div style={{fontSize:"12px",color:"#777",marginTop:"10px",lineHeight:1.6}}>{t.note}</div>
              </div>
            );
          })()}

          {[
            {key:"bodyBattery",label:"Body Battery",type:"slider",min:0,max:100},
            {key:"sleepScore",label:"Sleep Score",type:"slider",min:0,max:100},
            {key:"hrv",label:"HRV Status",type:"select",options:[["favorable","Favorable"],["balanced","Balanced"],["unbalanced","Unbalanced"],["poor","Poor"]]},
            {key:"restingHR",label:"Resting HR vs 30-Day Avg",type:"select",options:[["at","At or below"],["1-3","1–3 bpm above"],["4-6","4–6 bpm above"],["7+","7+ bpm above"]]},
            {key:"soreness",label:"Soreness / Pain (0–10)",type:"slider",min:0,max:10},
            {key:"motivation",label:"Motivation (0–10)",type:"slider",min:0,max:10},
          ].map(f => (
            <div key={f.key} style={{marginBottom:"18px"}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:"8px"}}>
                <div style={{fontSize:"11px",letterSpacing:"1px",color:"#666",textTransform:"uppercase"}}>{f.label}</div>
                {f.type==="slider" && <div style={{fontSize:"13px",color:phase.color,fontWeight:"bold"}}>{ri[f.key]}</div>}
              </div>
              {f.type==="slider" ? (
                <input type="range" min={f.min} max={f.max} value={ri[f.key]} onChange={e => setRi(p => ({...p,[f.key]:parseInt(e.target.value)}))}/>
              ) : (
                <div style={{display:"flex",gap:"5px",flexWrap:"wrap"}}>
                  {f.options.map(([val,lbl]) => (
                    <button key={val} onClick={() => setRi(p => ({...p,[f.key]:val}))} style={{
                      flex:1,padding:"9px 4px",
                      background:ri[f.key]===val?phase.color:"transparent",
                      border:`1px solid ${ri[f.key]===val?phase.color:"#222"}`,
                      borderRadius:"3px",
                      color:ri[f.key]===val?"#0A0A0A":"#444",
                      fontSize:"10px",
                    }}>{lbl}</button>
                  ))}
                </div>
              )}
            </div>
          ))}

          <button onClick={handleReadiness} style={{
            width:"100%",padding:"14px",background:phase.color,border:"none",borderRadius:"3px",
            color:"#0A0A0A",fontSize:"11px",fontWeight:"bold",letterSpacing:"2px",textTransform:"uppercase",
            marginBottom:"24px",
          }}>CALCULATE READINESS</button>

          {Object.keys(readinessLog).length > 0 && (
            <div>
              <div style={{fontSize:"9px",letterSpacing:"3px",color:"#333",textTransform:"uppercase",marginBottom:"12px"}}>Recent History</div>
              {Object.entries(readinessLog).slice(-5).reverse().map(([date,entry]) => {
                const t = getTier(entry.score);
                return (
                  <div key={date} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:"1px solid #111"}}>
                    <div style={{fontSize:"11px",color:"#444"}}>{date}</div>
                    <div style={{display:"flex",gap:"10px",alignItems:"center"}}>
                      <div style={{fontSize:"9px",color:t.color,letterSpacing:"1px"}}>{entry.tier}</div>
                      <div style={{fontSize:"13px",color:t.color,fontWeight:"bold"}}>{entry.score}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* TRACKER VIEW */}
      {view === "tracker" && (
        <div style={{padding:"20px 18px"}}>
          <div style={{fontSize:"9px",letterSpacing:"3px",color:"#444",textTransform:"uppercase",marginBottom:"18px"}}>Progressive Overload — Week {week}</div>
          {DAY_ORDER.filter(d => d !== "SUN").map(d => {
            const s = SESSIONS[d];
            return (
              <div key={d} style={{marginBottom:"22px"}}>
                <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"8px",paddingBottom:"6px",borderBottom:`1px solid ${s.color}33`}}>
                  <div style={{fontSize:"8px",letterSpacing:"3px",color:s.color,textTransform:"uppercase",fontWeight:"bold"}}>{s.fullDay}</div>
                  <div style={{fontSize:"10px",color:"#2A2A2A"}}>{s.focus}</div>
                </div>
                {s.exercises.filter(ex => typeof ex.sets === "number" && ex.tier !== "SUPERSET — CORE").map(ex => {
                  const log = getLog(ex.id);
                  const completed = (log||[]).filter(s => s && s.weight && s.reps);
                  const progression = checkProgression(log, ex.repRange);
                  const { max } = parseRange(ex.repRange);
                  return (
                    <div key={ex.id} style={{marginBottom:"10px",background:"#0C0C0C",border:"1px solid #181818",borderRadius:"3px",padding:"10px 12px"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"5px"}}>
                        <div style={{fontSize:"12px",fontWeight:"bold",color:"#C0BDB5",maxWidth:"210px",lineHeight:1.3}}>{ex.name}</div>
                        {progression && <span style={{fontSize:"7px",letterSpacing:"1px",background:"#7B9E87",color:"#0A0A0A",padding:"2px 5px",borderRadius:"2px",fontWeight:"bold",whiteSpace:"nowrap"}}>↑ ADD WEIGHT</span>}
                      </div>
                      <div style={{fontSize:"10px",color:"#444",marginBottom:"7px"}}>{ex.sets} × {ex.repRange}</div>
                      {completed.length > 0 ? (
                        <div style={{display:"flex",gap:"4px",flexWrap:"wrap"}}>
                          {completed.map((set,si) => (
                            <div key={si} style={{
                              background:parseInt(set.reps)>=max?"#0D150F":"#0F0F0F",
                              border:`1px solid ${parseInt(set.reps)>=max?"#1E3A25":"#1A1A1A"}`,
                              borderRadius:"2px",padding:"3px 7px",
                              fontSize:"10px",color:parseInt(set.reps)>=max?"#7B9E87":"#444",
                            }}>
                              {set.weight}lb×{set.reps} <span style={{color:"#2A2A2A"}}>@{set.rir}RIR</span>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <div style={{fontSize:"10px",color:"#252525",fontStyle:"italic"}}>Not logged this week</div>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
