<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const LS = {
  get:(k)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
  has:(k)=>{try{return localStorage.getItem(k)!==null;}catch{return false;}},
};

// ── DATA PERSISTENCE GUARD ────────────────────────────────────────
// Runs once on load. Never overwrites existing user data.
// Only initializes keys that don't exist yet (new installs or new features).
(function persistenceGuard(){
  const APP_VERSION = "v18";
  const KEYS = {
    "tm_log":{},       // session workout logs
    "tm_completed":{}, // session completion timestamps
    "tm_readiness":{}, // readiness score history
    "tm_cond":{},      // conditioning selections
    "tm_bands":{},     // band usage log
    "tm_cardio":[],    // cardio session log
    "tm_variants":{},  // equipment variant selections
    "tm_bodycomp":[],  // body composition entries
    "tm_week":1,       // current week
  };
  // Only set defaults for keys that don't exist — never touch existing data
  Object.entries(KEYS).forEach(([k,defaultVal])=>{
    if(!LS.has(k)) LS.set(k, defaultVal);
  });
  // Log version for debugging
  LS.set("tm_app_version", APP_VERSION);
})();

// ── BLUE ANGELS COLOR PALETTE ─────────────────────────────────────
const C = {
  bg:         "#00205B",   // BA deep navy — body background
  surface:    "#002878",   // slightly lighter navy — cards
  surfaceMid: "#003087",   // BA official navy — headers
  surfaceHi:  "#003FA0",   // mid navy — borders, inputs
  gold:       "#FFC72C",   // BA gold
  goldLight:  "rgba(255,199,44,0.15)",
  goldBorder: "rgba(255,199,44,0.4)",
  white:      "#FFFFFF",
  offWhite:   "#E8EEF8",
  textPrimary:"#FFFFFF",
  textMid:    "#C8D8F0",
  textMuted:  "#8AAAD0",
  textFaint:  "#4A6A9A",
  border:     "rgba(255,255,255,0.12)",
  borderMid:  "rgba(255,255,255,0.22)",
  green:      "#2ECC71",
  greenLight: "rgba(46,204,113,0.15)",
  greenBorder:"rgba(46,204,113,0.4)",
  accent:     "#4A9EFF",   // highlight blue for active states
};

// ── PHASE CONFIG — 4-PHASE 2-WEEK ROTATION ──────────────────────
const PHASES = [
  {label:"Phase 1",weeks:"Weeks 1–2",focus:"Volume",     rpe:"6–7",sets:4,reps:"12–15",rir:"3–4 RIR",restNote:"60–75 sec", note:"High volume. Moderate load. Build work capacity.",   type:"volume"},
  {label:"Phase 2",weeks:"Weeks 3–4",focus:"Strength",   rpe:"7–8",sets:5,reps:"5–8",  rir:"1–2 RIR",restNote:"120–180 sec",note:"Heavy compounds. Chase the number.",                type:"strength"},
  {label:"Phase 3",weeks:"Weeks 5–6",focus:"Hypertrophy",rpe:"7–8",sets:4,reps:"8–12", rir:"2–3 RIR",restNote:"60–90 sec", note:"Time under tension. CBum finishers active.",          type:"hypertrophy"},
  {label:"Phase 4",weeks:"Weeks 7–8",focus:"Deload",     rpe:"5–6",sets:3,reps:"10–12",rir:"3–4 RIR",restNote:"As needed", note:"60% load. Full recovery. Mandatory.",                 type:"deload"},
];
const VARIANT_LABELS = {
  cable:          {label:"Cable",          color:"#2ECC71"},
  freeWeight:     {label:"Free Weight",    color:"#4A90D9"},
  machine:        {label:"Machine",        color:"#9B59B6"},
  hammerStrength: {label:"Hammer Strength",color:"#E67E22"},
};
function getPhaseIdxFromWeek(w){return Math.floor(((w-1)%8)/2);}
function getPhase(w){
  const idx=getPhaseIdxFromWeek(w);const p=PHASES[idx];const cycleNum=Math.ceil(w/8);
  const colors=[[C.gold,C.goldLight,C.goldBorder],["#FF6B6B","rgba(255,107,107,0.15)","rgba(255,107,107,0.4)"],[C.accent,C.blueLight,C.blueBorder],[C.green,C.greenLight,C.greenBorder]];
  return{...p,cycleNum,color:colors[idx][0],colorBg:colors[idx][1],colorBorder:colors[idx][2]};
}

// ── READINESS ─────────────────────────────────────────────────────
function scoreReadiness(i){
  const bb=parseFloat((i.bodyBattery/10).toFixed(1));
  const ss=parseFloat((i.sleepScore/10).toFixed(1));
  const tr=parseFloat((i.trainingReadiness/10).toFixed(1));
  const hrv=({favorable:10,balanced:7,unbalanced:4,poor:1})[i.hrv]||5;
  const hr=({at:10,"1-3":7,"4-6":4,"7+":1})[i.restingHR]||5;
  const sor=parseFloat((10-i.soreness).toFixed(1));
  const mot=parseFloat(i.motivation.toFixed(1));
  return parseFloat((bb+ss+tr+hrv+hr+sor+mot).toFixed(1));
}
function getTier(s){
  if(s>=56)return{tier:"GREEN", label:"PUSH",        color:C.green,  bg:C.greenLight, note:"Train as programmed. Don't waste a green day."};
  if(s>=42)return{tier:"YELLOW",label:"MODIFIED",    color:C.gold,   bg:C.goldLight,  note:"Add 1 RIR all sets. No intensity techniques."};
  if(s>=28)return{tier:"ORANGE",label:"REDUCE",      color:"#FF8C42",bg:"rgba(255,140,66,0.15)",note:"Cut one set. Add 1–2 RIR. Skip conditioning."};
  return      {tier:"RED",   label:"REST ONLY",   color:"#FF4444",bg:"rgba(255,68,68,0.15)",note:"Zone 2 only. Do not train."};
}

// ── PROGRESSION ───────────────────────────────────────────────────
function parseRange(r){const m=r?r.match(/(\d+)[–\-](\d+)/):null;return m?{min:parseInt(m[1]),max:parseInt(m[2])}:{min:0,max:0};}
function checkProgression(log,repRange){
  const done=(log||[]).filter(s=>s&&s.reps&&s.weight);
  if(!done.length)return false;
  const{max}=parseRange(repRange);
  return done.every(s=>parseInt(s.reps)>=max)&&parseInt(done[done.length-1].rir||0)>=1;
}

// ── WARM-UP CALC ──────────────────────────────────────────────────
function feederCount(f){if(!f)return 0;if(f.includes("3"))return 3;if(f.includes("2"))return 2;if(f.includes("1"))return 1;return 0;}
function calcWarmup(w,count){
  const wt=parseFloat(w);if(!wt||isNaN(wt)||wt<=0)return null;
  const s={3:[{pct:45,reps:"6–10"},{pct:65,reps:"4–6"},{pct:85,reps:"3–4"}],2:[{pct:50,reps:"6–10"},{pct:70,reps:"4–6"}],1:[{pct:60,reps:"6–10"}]};
  return(s[count]||[]).map(x=>({...x,weight:Math.round(wt*x.pct/100/5)*5}));
}

// ── PHASE REP RANGES ──────────────────────────────────────────────
function getPhaseRepRange(ex,phase){
  if(ex&&ex.reps)return ex.reps;
  return phase?phase.reps:"10–12";
}

// ── PHASE SETS ───────────────────────────────────────────────────
// New program uses phase.sets from PHASES array
// FST-7 exercises use lockedSets=7, AMRAP=0, fixed=N
function getPhaseSets(base, phaseType, ex, phaseSets){
  if(ex&&ex.lockedSets!==undefined&&ex.lockedSets!==null)return ex.lockedSets;
  if(phaseSets!=null)return phaseSets;
  if(phaseType==="deload")return 2;
  if(phaseType==="volume")return 4;
  if(phaseType==="strength")return 5;
  return 4; // hypertrophy
}

// ── REST TIMER PARSE ──────────────────────────────────────────────
function parseRestSeconds(rest){
  if(!rest)return 90;
  if(rest.includes("180")||rest.includes("3 min"))return 180;
  if(rest.includes("120–180")||rest.includes("2–3"))return 150;
  if(rest.includes("120"))return 120;
  if(rest.includes("90"))return 90;
  if(rest.includes("75"))return 75;
  if(rest.includes("60–75"))return 67;
  if(rest.includes("60"))return 60;
  if(rest.includes("45"))return 45;
  if(rest.includes("30"))return 30;
  return 90;
}

// ── BOMB DROP ─────────────────────────────────────────────────────
const activeTimers={};
let globalFlashFn=null;
function scheduleBombDrop(restSecs){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const ctx=new AC();if(ctx.state==="suspended")ctx.resume();
    const t=ctx.currentTime;const ws=Math.max(0.1,restSecs-5);const ex=restSecs;
    const w=ctx.createOscillator();const wg=ctx.createGain();
    w.connect(wg);wg.connect(ctx.destination);w.type="sine";
    w.frequency.setValueAtTime(1400,t+ws);w.frequency.exponentialRampToValueAtTime(60,t+ex-0.05);
    wg.gain.setValueAtTime(0,t+ws);wg.gain.linearRampToValueAtTime(0.45,t+ws+2);wg.gain.linearRampToValueAtTime(0,t+ex);
    w.start(t+ws);w.stop(t+ex+0.1);
    const e=ctx.createOscillator();const eg=ctx.createGain();const ef=ctx.createBiquadFilter();
    e.connect(ef);ef.connect(eg);eg.connect(ctx.destination);e.type="sawtooth";ef.type="lowpass";
    ef.frequency.setValueAtTime(500,t+ex);ef.frequency.exponentialRampToValueAtTime(30,t+ex+0.7);
    e.frequency.setValueAtTime(80,t+ex);e.frequency.exponentialRampToValueAtTime(15,t+ex+0.8);
    eg.gain.setValueAtTime(0,t+ex-0.01);eg.gain.linearRampToValueAtTime(1,t+ex+0.04);eg.gain.exponentialRampToValueAtTime(0.001,t+ex+0.9);
    e.start(t+ex-0.01);e.stop(t+ex+1);
    const g=ctx.createOscillator();const gg=ctx.createGain();
    g.connect(gg);gg.connect(ctx.destination);g.type="sine";
    g.frequency.setValueAtTime(280,t+ex+0.7);g.frequency.exponentialRampToValueAtTime(1000,t+ex+1.2);
    gg.gain.setValueAtTime(0,t+ex+0.65);gg.gain.linearRampToValueAtTime(0.6,t+ex+0.75);gg.gain.exponentialRampToValueAtTime(0.001,t+ex+1.4);
    g.start(t+ex+0.65);g.stop(t+ex+1.5);
    setTimeout(()=>{try{ctx.close();}catch(e){}}, (restSecs+3)*1000);
  }catch(err){}
}

// ── REST TIMER ────────────────────────────────────────────────────
function RestTimer({seconds, onDismiss}){
  const[remaining,setRemaining]=useState(seconds);
  const[done,setDone]=useState(false);
  const[dismissed,setDismissed]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    ref.current=setInterval(()=>{
      setRemaining(r=>{
        if(r<=1){
          clearInterval(ref.current);
          setDone(true);
          if(navigator.vibrate)navigator.vibrate([400,200,400,200,600]);
          if(globalFlashFn)globalFlashFn();
          // Auto-dismiss after 2.5 seconds so next set highlights
          setTimeout(()=>{setDismissed(true);if(onDismiss)onDismiss();},2500);
          return 0;
        }
        return r-1;
      });
    },1000);
    return()=>clearInterval(ref.current);
  },[]);
  if(dismissed)return null;
  const pct=((seconds-remaining)/seconds)*100;
  const mins=Math.floor(remaining/60);const secs=remaining%60;
  const countdown=remaining<=5&&remaining>0&&!done;
  return(
    <div style={{background:done?C.greenLight:countdown?C.goldLight:"rgba(0,48,135,0.6)",border:`1px solid ${done?C.greenBorder:countdown?C.goldBorder:C.borderMid}`,borderLeft:`3px solid ${done?C.green:countdown?C.gold:C.accent}`,borderRadius:"6px",padding:"12px 14px",marginTop:"10px",transition:"opacity 0.3s"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}}>
        <div style={{fontSize:"11px",letterSpacing:"2px",color:done?C.green:countdown?C.gold:C.accent,textTransform:"uppercase",fontWeight:"bold"}}>{done?"✓ GO — NEXT SET":countdown?"💣 INCOMING...":"REST TIMER"}</div>
        <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
          <div style={{fontSize:countdown?"32px":"22px",fontWeight:"bold",color:done?C.green:countdown?"#FF4444":C.white,fontVariantNumeric:"tabular-nums"}}>{done?"💥":countdown?remaining:`${mins}:${secs.toString().padStart(2,"0")}`}</div>
          {!done&&<button onClick={()=>{clearInterval(ref.current);setDismissed(true);if(onDismiss)onDismiss();}} style={{background:"transparent",border:"none",color:C.textFaint,fontSize:"18px",padding:"2px 6px",lineHeight:1}}>✕</button>}
        </div>
      </div>
      <div style={{background:"rgba(255,255,255,0.1)",borderRadius:"2px",height:"4px",overflow:"hidden"}}>
        <div style={{background:done?C.green:countdown?"#FF4444":C.accent,height:"100%",width:`${pct}%`,transition:"width 1s linear",borderRadius:"2px"}}/>
      </div>
    </div>
  );
}

// ── WARMUP CALC COMPONENT ─────────────────────────────────────────
function WarmupCalc({feeders}){
  const[w,setW]=useState("");
  const count=feederCount(feeders);if(!count)return null;
  const sets=calcWarmup(w,count);
  return(
    <div style={{background:"rgba(0,48,135,0.5)",border:`1px solid ${C.goldBorder}`,borderLeft:`3px solid ${C.gold}`,borderRadius:"6px",padding:"14px",marginBottom:"14px"}}>
      <div style={{fontSize:"11px",letterSpacing:"2px",color:C.gold,textTransform:"uppercase",fontWeight:"bold",marginBottom:"10px"}}>Nippard Warm-Up Sets</div>
      <input type="number" placeholder="Working weight (lbs)" value={w} onChange={e=>setW(e.target.value)} style={{marginBottom:"10px",textAlign:"left",padding:"10px 12px",fontSize:"15px"}}/>
      {sets?sets.map((s,i)=>(
        <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:i<sets.length-1?`1px solid ${C.border}`:"none"}}>
          <div style={{fontSize:"12px",color:C.textMuted,letterSpacing:"1px",textTransform:"uppercase"}}>Set {i+1} — {s.pct}%</div>
          <div style={{display:"flex",gap:"16px",alignItems:"center"}}>
            <div style={{fontSize:"20px",fontWeight:"bold",color:C.white}}>{s.weight}<span style={{fontSize:"12px",fontWeight:"normal",color:C.textMuted}}> lbs</span></div>
            <div style={{fontSize:"13px",color:C.textMuted}}>{s.reps} reps</div>
          </div>
        </div>
      )):<div style={{fontSize:"13px",color:C.textFaint,fontStyle:"italic"}}>Enter working weight to calculate.</div>}
    </div>
  );
}

// ── SET LOG ROW ───────────────────────────────────────────────────
// isNextSet: true when this row should be highlighted as the next target
// hideTimer: true for superset A rows (timer fires on B only)
function SetLogRow({si,label,repRange,data,onLog,restSecs,exId,isNextSet,hideTimer,onTimerDone}){
  const[tv,setTv]=useState(activeTimers[exId+"_"+si]||0);
  const{max}=parseRange(repRange);
  const isLogged=!!(data.weight&&data.reps);
  function startTimer(){
    if(hideTimer)return;
    scheduleBombDrop(restSecs);
    const v=(activeTimers[exId+"_"+si]||0)+1;
    activeTimers[exId+"_"+si]=v;
    setTv(v);
  }
  function handleDismiss(){setTv(0);if(onTimerDone)onTimerDone();}
  const atMax=data.reps&&parseInt(data.reps)>=max&&max>0;
  // Next set highlight — gold border and subtle gold background
  const rowBg=isNextSet&&!isLogged?"rgba(255,199,44,0.08)":"transparent";
  const rowBorder=isNextSet&&!isLogged?`1.5px solid ${C.gold}`:"1.5px solid transparent";
  return(
    <div style={{marginBottom:"8px",borderRadius:"6px",background:rowBg,border:rowBorder,padding:isNextSet&&!isLogged?"8px 6px":"0 6px",transition:"all 0.3s"}}>
      <div style={{display:"flex",gap:"6px",alignItems:"center"}}>
        <div style={{fontSize:"11px",color:isNextSet&&!isLogged?C.gold:C.textMid,width:"50px",fontWeight:"bold",flexShrink:0,transition:"color 0.3s"}}>{label}</div>
        <input type="number" placeholder={max>0?String(max):"lbs"} value={data.weight||""} onChange={e=>onLog(si,"weight",e.target.value)} style={{flex:1,minWidth:"60px",borderColor:isNextSet&&!isLogged?C.gold:undefined}}/>
        <input type="number" placeholder={max>0?repRange:"reps"} value={data.reps||""} onChange={e=>onLog(si,"reps",e.target.value)} style={{flex:1,minWidth:"60px",color:atMax?C.green:C.white,borderColor:isNextSet&&!isLogged?C.gold:atMax?C.green:undefined}}/>
        <input type="number" placeholder="RIR" value={data.rir||""} onChange={e=>onLog(si,"rir",e.target.value)} style={{flex:"0 0 56px",width:"56px",minWidth:"56px",color:data.rir!==undefined&&parseInt(data.rir)<=1?C.gold:C.white}}/>
        {isLogged&&!hideTimer&&(
          <button onClick={startTimer} style={{background:tv>0?"transparent":C.gold,border:`1px solid ${C.gold}`,borderRadius:"6px",padding:"8px 10px",color:tv>0?C.gold:C.bg,fontSize:"10px",fontWeight:"bold",letterSpacing:"1px",whiteSpace:"nowrap",flexShrink:0,minWidth:"60px"}}>▶ REST</button>
        )}
        {isLogged&&hideTimer&&(
          <div style={{width:"60px",flexShrink:0}}/>
        )}
      </div>
      {tv>0&&<RestTimer key={tv} seconds={restSecs} onDismiss={handleDismiss}/>}
    </div>
  );
}

// ── BAND TRACKER ──────────────────────────────────────────────────
const BANDS=["Light","Medium","Heavy","Extra Heavy","Mini Band"];
function BandTracker({sessionKey,bandLog,onBandLog}){
  const current=bandLog[sessionKey]||"";
  return(
    <div style={{background:"rgba(0,48,135,0.4)",border:`1px solid ${C.border}`,borderRadius:"8px",padding:"14px",marginBottom:"14px"}}>
      <div style={{fontSize:"12px",letterSpacing:"2px",color:C.gold,textTransform:"uppercase",fontWeight:"bold",marginBottom:"10px"}}>Band Used Today</div>
      <div style={{display:"flex",gap:"6px",flexWrap:"wrap"}}>
        {BANDS.map(b=>(
          <button key={b} onClick={()=>onBandLog(sessionKey,current===b?"":b)}
            style={{padding:"8px 12px",background:current===b?C.gold:"transparent",border:`1.5px solid ${current===b?C.gold:C.borderMid}`,borderRadius:"6px",color:current===b?C.bg:C.textMid,fontSize:"12px",fontWeight:current===b?"bold":"normal"}}>
            {b}
          </button>
        ))}
      </div>
      {current&&<div style={{fontSize:"12px",color:C.gold,marginTop:"8px",fontWeight:"bold"}}>✓ {current} band logged</div>}
    </div>
  );
}


// ── EQUIPMENT BADGE COLORS ────────────────────────────────────────
const EQUIP_COLORS = {
  BARBELL:    {bg:"#E85A1A",text:"#FFFFFF"},
  DUMBBELL:   {bg:"#4A90D9",text:"#FFFFFF"},
  CABLE:      {bg:"#2ECC71",text:"#FFFFFF"},
  MACHINE:    {bg:"#9B59B6",text:"#FFFFFF"},
  BODYWEIGHT: {bg:"#16A085",text:"#FFFFFF"},

// ── VARIANT PICKER (full-screen panel) ───────────────────────────
function EquipBadge({type}){
  const meta=VARIANT_LABELS[type]||{label:type,color:C.gold};
  return <span style={{fontSize:"10px",letterSpacing:"1px",color:"#fff",background:meta.color,padding:"2px 7px",borderRadius:"3px",fontWeight:"bold",flexShrink:0}}>{meta.label}</span>;
}

function VariantPicker({ex, side, currentVariant, onSelect, onClose}){
  // ex.variants = {cable:{name,note}, freeWeight:{name,note}, machine:{...}, hammerStrength:{...}}
  const variants = ex.variants || {};
  const variantKeys = Object.keys(variants).filter(k=>variants[k]!==null);
  return(
    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:C.bg,zIndex:200,overflowY:"auto",display:"flex",flexDirection:"column"}}>
      <div style={{background:C.surfaceMid,borderBottom:`2px solid ${C.gold}`,padding:"20px 18px",position:"sticky",top:0,zIndex:10,flexShrink:0}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontSize:"10px",letterSpacing:"3px",color:C.gold,textTransform:"uppercase",fontWeight:"bold",marginBottom:"4px"}}>
              {side?"Swap Equipment — "+(side==="a"?"A Movement":"B Movement"):"Swap Equipment"}
            </div>
            <div style={{fontSize:"18px",fontWeight:"bold",color:C.white,lineHeight:1.2}}>
              {side==="a"?ex.name:side==="b"?(ex.subName||ex.name):ex.name}
            </div>
          </div>
          <button onClick={onClose} style={{background:"transparent",border:`1.5px solid ${C.borderMid}`,borderRadius:"8px",padding:"10px 16px",color:C.textMid,fontSize:"13px",fontWeight:"bold",flexShrink:0,marginLeft:"12px"}}>✕ Close</button>
        </div>
      </div>
      <div style={{padding:"20px 18px",flex:1}}>
        {/* Primary / Default */}
        <div style={{marginBottom:"16px"}}>
          <button onClick={()=>onSelect(null)} style={{width:"100%",padding:"14px 16px",background:!currentVariant?"rgba(255,199,44,0.1)":"transparent",border:`1.5px solid ${!currentVariant?C.gold:C.borderMid}`,borderRadius:"10px",color:!currentVariant?C.gold:C.textMuted,fontSize:"13px",fontWeight:"bold",textAlign:"left",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontSize:"15px",fontWeight:"bold",color:C.white}}>{ex.name}</div>
              <div style={{fontSize:"11px",color:C.textMuted,marginTop:"2px"}}>Primary / Default</div>
              {ex.note&&<div style={{fontSize:"12px",color:C.textMuted,marginTop:"4px",lineHeight:1.5}}>{ex.note}</div>}
            </div>
            {!currentVariant&&<span style={{color:C.gold,fontSize:"16px",flexShrink:0,marginLeft:"10px"}}>✓</span>}
          </button>
        </div>
        <div style={{fontSize:"11px",letterSpacing:"2px",color:C.textFaint,textTransform:"uppercase",fontWeight:"bold",marginBottom:"12px"}}>Equipment Options</div>
        {variantKeys.length===0&&<div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:"10px",padding:"20px",textAlign:"center",color:C.textMuted,fontSize:"14px"}}>No variants for this exercise.</div>}
        {variantKeys.map(key=>{
          const v=variants[key];
          const meta=VARIANT_LABELS[key]||{label:key,color:C.gold};
          const isActive=currentVariant===key;
          return(
            <div key={key} onClick={()=>onSelect(key)}
              style={{background:isActive?"rgba(255,199,44,0.08)":C.surface,border:`1.5px solid ${isActive?C.gold:C.border}`,borderRadius:"10px",padding:"16px",marginBottom:"12px",cursor:"pointer"}}>
              <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"8px",flexWrap:"wrap"}}>
                <EquipBadge type={key}/>
                <div style={{fontSize:"16px",fontWeight:"bold",color:C.white,flex:1}}>{v.name}</div>
                {isActive&&<span style={{fontSize:"10px",letterSpacing:"1px",color:C.bg,background:C.gold,padding:"2px 8px",borderRadius:"3px",fontWeight:"bold"}}>ACTIVE</span>}
              </div>
              <div style={{fontSize:"13px",color:C.textMid,lineHeight:1.6}}>{v.note}</div>
              {!isActive&&<div style={{fontSize:"12px",color:C.gold,fontWeight:"bold",marginTop:"8px"}}>Tap to select →</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── BODY COMP ENTRY (editable row) ───────────────────────────────
function BodyCompEntry({entry, origIdx, onSave, onDelete}){
  const[editing,setEditing]=useState(false);
  const[wt,setWt]=useState(String(entry.weight||""));
  const[bf,setBf]=useState(String(entry.bf||""));
  function save(){
    onSave(origIdx,{...entry,weight:parseFloat(wt)||entry.weight,bf:bf?parseFloat(bf):null});
    setEditing(false);
  }
  function cancel(){setWt(String(entry.weight||""));setBf(String(entry.bf||""));setEditing(false);}
  if(editing)return(
    <div style={{padding:"12px 0",borderBottom:`1px solid ${C.border}`}}>
      <div style={{fontSize:"11px",color:C.gold,letterSpacing:"1px",textTransform:"uppercase",fontWeight:"bold",marginBottom:"10px"}}>{entry.date} — Editing</div>
      <div style={{display:"flex",gap:"8px",marginBottom:"10px"}}>
        <div style={{flex:1}}><div style={{fontSize:"10px",color:C.textMuted,letterSpacing:"1px",textTransform:"uppercase",marginBottom:"4px",fontWeight:"bold"}}>Weight (lbs)</div><input type="number" value={wt} onChange={e=>setWt(e.target.value)} style={{width:"100%"}}/></div>
        <div style={{flex:1}}><div style={{fontSize:"10px",color:C.textMuted,letterSpacing:"1px",textTransform:"uppercase",marginBottom:"4px",fontWeight:"bold"}}>Body Fat %</div><input type="number" value={bf} onChange={e=>setBf(e.target.value)} style={{width:"100%"}}/></div>
      </div>
      <div style={{display:"flex",gap:"8px"}}>
        <button onClick={save} style={{flex:1,padding:"10px",background:C.gold,border:"none",borderRadius:"6px",color:C.bg,fontSize:"12px",fontWeight:"bold",letterSpacing:"1px",textTransform:"uppercase"}}>SAVE</button>
        <button onClick={cancel} style={{flex:1,padding:"10px",background:"transparent",border:`1.5px solid ${C.borderMid}`,borderRadius:"6px",color:C.textMuted,fontSize:"12px",fontWeight:"bold",letterSpacing:"1px",textTransform:"uppercase"}}>CANCEL</button>
        <button onClick={()=>onDelete(origIdx)} style={{padding:"10px 14px",background:"rgba(255,68,68,0.1)",border:"1.5px solid rgba(255,68,68,0.3)",borderRadius:"6px",color:"#FF4444",fontSize:"12px",fontWeight:"bold"}}>✕ DELETE</button>
      </div>
    </div>
  );
  return(
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:`1px solid ${C.border}`}}>
      <div style={{fontSize:"13px",color:C.textMid,fontWeight:"500"}}>{entry.date}</div>
      <div style={{display:"flex",gap:"14px",alignItems:"center"}}>
        <div style={{fontSize:"15px",fontWeight:"bold",color:C.white}}>{entry.weight}<span style={{fontSize:"11px",color:C.textFaint}}> lbs</span></div>
        {entry.bf&&<div style={{fontSize:"15px",fontWeight:"bold",color:C.gold}}>{entry.bf}<span style={{fontSize:"11px",color:C.textFaint}}>%</span></div>}
        <button onClick={()=>setEditing(true)} style={{background:"transparent",border:`1.5px solid ${C.borderMid}`,borderRadius:"6px",padding:"5px 10px",color:C.textMuted,fontSize:"11px",fontWeight:"bold",letterSpacing:"1px"}}>EDIT</button>
      </div>
    </div>
  );
}

// ── CONDITIONING TRACKER ──────────────────────────────────────────
function ConditioningTracker({sessionKey,condLog,onCondLog,options,phaseType}){
  const entry=condLog[sessionKey]||{selected:"",note:""};

  function update(field,val){const updated={...entry,[field]:val};onCondLog(sessionKey,updated);}
  return(
    <div style={{marginTop:"8px"}}>
      <div style={{fontSize:"12px",letterSpacing:"1px",color:C.gold,textTransform:"uppercase",fontWeight:"bold",marginBottom:"6px"}}>
        {fullBlock?"10 MIN — Full Block (Strength Week)":"5 MIN"}
      </div>
      {options.map((opt,i)=>{
        const isSelected=entry.selected===opt.name;
        return(
          <div key={i} style={{marginBottom:"10px",background:isSelected?"rgba(0,48,135,0.6)":"rgba(0,32,91,0.4)",border:`1.5px solid ${isSelected?C.gold:C.border}`,borderRadius:"8px",padding:"12px 14px",cursor:"pointer"}}
            onClick={()=>update("selected",isSelected?"":opt.name)}>

                {isSelected&&<div style={{fontSize:"11px",color:C.bg,fontWeight:"bold"}}>✓</div>}
              </div>
              <div>
                <div style={{fontSize:"14px",fontWeight:"bold",color:C.white}}>{opt.name}</div>
                <div style={{fontSize:"12px",color:C.textMuted,marginTop:"2px"}}>{opt.protocol}</div>
              </div>
            </div>
          </div>
        );
      })}
      {entry.selected&&(
        <div style={{marginTop:"8px"}}>
          <div style={{fontSize:"12px",color:C.textMid,letterSpacing:"1px",textTransform:"uppercase",fontWeight:"bold",marginBottom:"6px"}}>Notes — time / distance / rounds</div>

        </div>
      )}
    </div>
  );
}

const CARDIO_TYPES=["Pool Swim","Ruck","Assault Bike","Row","Run","Zone 2 Bike","MTNTOUGH Circuit","Other"];

// ── BODY COMP VIEW ─────────────────────────────────────────────
function BodyCompView({ phase }) {
  const [log, setLog] = useState(() => LS.get("tm_bodycomp") || []);
  const [wt, setWt] = useState(""); const [bf, setBf] = useState(""); const [note, setNote] = useState("");
  const [neck, setNeck] = useState(""); const [waist, setWaist] = useState(""); const [height, setHeight] = useState(""); const [navyBF, setNavyBF] = useState("");

  function calcNavyBF() {
    const n = parseFloat(neck), w = parseFloat(waist), h = parseFloat(height);
    if (!n||!w||!h||w<=n) return;
    const result = (86.010 * Math.log10(w - n) - 70.041 * Math.log10(h) + 36.76).toFixed(1);
    setNavyBF(result); setBf(result);
  }
  function addEntry() {
    if (!wt) return;
    const entry = { date: new Date().toLocaleDateString(), weight: parseFloat(wt), bf: bf ? parseFloat(bf) : null, note };
    const newLog = [...log, entry]; setLog(newLog); LS.set("tm_bodycomp", newLog);
    setWt(""); setBf(""); setNote("");
  }

  const recent = [...log].slice(-10);
  const minW = recent.length ? Math.min(...recent.map(e=>e.weight)) - 5 : 180;
  const maxW = recent.length ? Math.max(...recent.map(e=>e.weight)) + 5 : 230;

  return (
    <div style={{padding:"20px 18px"}}>
      <div style={{fontSize:"10px",letterSpacing:"3px",color:C.textFaint,textTransform:"uppercase",marginBottom:"20px",fontWeight:"bold"}}>Body Composition</div>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"18px",marginBottom:"14px"}}>
        <div style={{fontSize:"10px",letterSpacing:"2px",color:phase.color,textTransform:"uppercase",fontWeight:"bold",marginBottom:"4px"}}>Navy BF% Calculator</div>
        <div style={{fontSize:"11px",color:C.textFaint,marginBottom:"14px"}}>Neck · Waist · Height in inches → auto-populates BF%</div>
        <div style={{display:"flex",gap:"8px",marginBottom:"12px"}}>
          {[["Neck (in)",neck,setNeck,"15.5"],["Waist (in)",waist,setWaist,"34.0"],["Height (in)",height,setHeight,"71"]].map(([lbl,val,set,ph])=>(
            <div key={lbl} style={{flex:1}}>
              <div style={{fontSize:"10px",color:C.textFaint,letterSpacing:"1px",textTransform:"uppercase",marginBottom:"5px"}}>{lbl}</div>
              <input type="number" placeholder={ph} value={val} onChange={e=>set(e.target.value)} style={{width:"100%"}}/>
            </div>
          ))}
        </div>
        <button onClick={calcNavyBF} style={{width:"100%",padding:"12px",background:phase.color,border:"none",borderRadius:"6px",color:C.white,fontSize:"11px",fontWeight:"bold",letterSpacing:"2px",textTransform:"uppercase",marginBottom:navyBF?"12px":"0"}}>CALCULATE</button>
        {navyBF && (
          <div style={{background:C.blueLight,border:`1px solid ${C.blueBorder}`,borderLeft:`3px solid ${C.blue}`,borderRadius:"6px",padding:"12px 14px"}}>
            <div style={{fontSize:"10px",letterSpacing:"2px",color:C.blue,textTransform:"uppercase",marginBottom:"3px",fontWeight:"bold"}}>Navy Method Result</div>
            <div style={{fontSize:"26px",fontWeight:"bold",color:C.white}}>{navyBF}% <span style={{fontSize:"13px",color:C.textMuted,fontWeight:"normal"}}>body fat — auto-populated below</span></div>
          </div>
        )}
      </div>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"18px",marginBottom:"24px"}}>
        <div style={{fontSize:"10px",letterSpacing:"2px",color:phase.color,textTransform:"uppercase",fontWeight:"bold",marginBottom:"14px"}}>Log Today</div>
        <div style={{display:"flex",gap:"8px",marginBottom:"12px"}}>
          <div style={{flex:1}}><div style={{fontSize:"10px",color:C.textFaint,letterSpacing:"1px",textTransform:"uppercase",marginBottom:"5px"}}>Weight (lbs)</div><input type="number" placeholder="217" value={wt} onChange={e=>setWt(e.target.value)} style={{width:"100%"}}/></div>
          <div style={{flex:1}}><div style={{fontSize:"10px",color:C.textFaint,letterSpacing:"1px",textTransform:"uppercase",marginBottom:"5px"}}>Body Fat %</div><input type="number" placeholder="23.5" value={bf} onChange={e=>setBf(e.target.value)} style={{width:"100%",borderColor:navyBF&&bf===navyBF?C.blue:undefined}}/></div>
        </div>
        <button onClick={addEntry} style={{width:"100%",padding:"14px",background:phase.color,border:"none",borderRadius:"6px",color:C.white,fontSize:"11px",fontWeight:"bold",letterSpacing:"2px",textTransform:"uppercase"}}>LOG ENTRY</button>
      </div>

      {recent.length >= 2 && (() => {
        const W = 320; const H = 120; const PAD = 20;
        const chartW = W - PAD*2; const chartH = H - PAD*2;
        return (
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"18px",marginBottom:"20px",overflowX:"auto"}}>
            <div style={{fontSize:"10px",letterSpacing:"2px",color:C.textFaint,textTransform:"uppercase",fontWeight:"bold",marginBottom:"14px"}}>Weight Trend</div>
            <svg width={W} height={H}>
              {recent.map((e,i)=>{
                const x = PAD + (i/(recent.length-1))*chartW;
                const y = PAD + chartH - ((e.weight-minW)/(maxW-minW))*chartH;
                return <circle key={i} cx={x} cy={y} r={4} fill={phase.color}/>;
              })}
              {recent.slice(1).map((e,i)=>{
                const x1 = PAD + (i/(recent.length-1))*chartW;
                const y1 = PAD + chartH - ((recent[i].weight-minW)/(maxW-minW))*chartH;
                const x2 = PAD + ((i+1)/(recent.length-1))*chartW;
                const y2 = PAD + chartH - ((e.weight-minW)/(maxW-minW))*chartH;
                return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={phase.color} strokeWidth={2} opacity={0.6}/>;
              })}
            </svg>
          </div>
        );
      })()}

      {log.length > 0 && (
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"18px"}}>
          <div style={{fontSize:"10px",letterSpacing:"2px",color:C.textFaint,textTransform:"uppercase",fontWeight:"bold",marginBottom:"14px"}}>Log History</div>
          {[...log].reverse().slice(0,10).map((e,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:`1px solid ${C.border}`}}>
              <div style={{fontSize:"12px",color:C.textMuted}}>{e.date}</div>
              <div style={{display:"flex",gap:"16px"}}>

}

// ── CSV EXPORT ────────────────────────────────────────────────────
function exportCSV(sessionLog, readinessLog, bodyCompLog, week) {
  const rows = [["RAYMOND — TACTICAL MONSTER PROTOCOL"],["Exported:",new Date().toLocaleDateString()],["Week:",week],[]];
  rows.push(["SESSION LOG"]);
  rows.push(["Exercise ID","Week","Set","Weight (lbs)","Reps","RIR"]);
  DAY_ORDER.forEach(day => {
    const s = SESSIONS[day];
    if (!s) return;
    (s.exercises||[]).forEach(ex => {
      if (ex.noLog || typeof ex.sets !== "number") return;
      const exId = ex.id;
      ["a","b"].forEach(side => {
        const key = `${exId}_w${week}_${side}`;
        const log = sessionLog[key] || [];
        log.forEach((s, i) => {
          if (s && s.weight) rows.push([exId + side, "Week " + week, "Set " + (i+1), s.weight, s.reps||"", s.rir||""]);
        });
      });
    });
  });
  rows.push([]);
  rows.push(["READINESS LOG"]); rows.push(["Date","Score","Tier"]);
  Object.entries(readinessLog).forEach(([date, entry]) => { rows.push([date, entry.score, entry.tier]); });
  rows.push([]);
  rows.push(["BODY COMPOSITION LOG"]); rows.push(["Date","Weight (lbs)","Body Fat %"]);
  (bodyCompLog||[]).forEach(entry => { rows.push([entry.date, entry.weight, entry.bf||""]); });
  const csv = rows.map(r => r.map(cell => `"${String(cell||"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `raymond_tm_week${week}_${new Date().toISOString().split("T")[0]}.csv`; a.click();
  URL.revokeObjectURL(url);
}

      {view==="tracker"&&(
        <div style={{padding:"20px 18px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"20px"}}>
            <div style={sectionLabel}>Week {week} — {phase.name}</div>
            <button onClick={()=>exportCSV(sessionLog,readinessLog,LS.get("tm_bodycomp")||[],condLog,cardioLog,week)} style={{background:C.surfaceMid,border:`1.5px solid ${C.borderMid}`,borderRadius:"6px",padding:"10px 16px",color:C.white,fontSize:"11px",letterSpacing:"1px",textTransform:"uppercase",fontWeight:"bold"}}>⬇ CSV</button>
          </div>

          {/* Completion grid */}
          <div style={{background:C.surface,border:`1.5px solid ${C.borderMid}`,borderRadius:"8px",padding:"16px",marginBottom:"22px"}}>
            <div style={sectionLabel}>Session Completion</div>
            <div style={{display:"flex",gap:"6px"}}>
              {DAY_ORDER.map(d=>{
                const done=!!completed[d+"_w"+week];
                return(<div key={d} style={{flex:1,textAlign:"center",padding:"12px 4px",borderRadius:"6px",background:done?C.greenLight:C.surface,border:`1.5px solid ${done?C.green:C.border}`,fontSize:"11px",fontWeight:"bold",color:done?C.green:C.textFaint}}>{done?"✓":d}</div>);
              })}
            </div>
          </div>

          {/* Conditioning log summary */}
          <div style={{background:C.surface,border:`1.5px solid ${C.borderMid}`,borderRadius:"8px",padding:"16px",marginBottom:"22px"}}>
            <div style={sectionLabel}>Conditioning This Week</div>
            {DAY_ORDER.map(d=>{
              const entry=condLog[d+"_w"+week];
              if(!entry||!entry.selected)return null;
              return(
                <div key={d} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:`1px solid ${C.border}`}}>
                  <div style={{fontSize:"13px",color:C.textMid,fontWeight:"bold"}}>{d}</div>
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:"13px",color:C.white,fontWeight:"bold"}}>{entry.selected}</div>
                    {entry.note&&<div style={{fontSize:"11px",color:C.textMuted,marginTop:"2px"}}>{entry.note}</div>}
                  </div>
                </div>
              );
            })}
            {!DAY_ORDER.some(d=>condLog[d+"_w"+week]?.selected)&&<div style={{fontSize:"13px",color:C.textFaint,fontStyle:"italic"}}>No conditioning logged yet this week.</div>}
          </div>

          {/* Band log summary */}
          <div style={{background:C.surface,border:`1.5px solid ${C.borderMid}`,borderRadius:"8px",padding:"16px",marginBottom:"22px"}}>
            <div style={sectionLabel}>Band Usage This Week</div>
            {Object.entries(bandLog).filter(([k,v])=>v).map(([k,v])=>(
              <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:`1px solid ${C.border}`}}>
                <div style={{fontSize:"12px",color:C.textMuted,fontWeight:"500"}}>{k}</div>
                <div style={{fontSize:"13px",color:C.gold,fontWeight:"bold"}}>{v}</div>
              </div>
            ))}
            {!Object.values(bandLog).some(v=>v)&&<div style={{fontSize:"13px",color:C.textFaint,fontStyle:"italic"}}>No band usage logged yet.</div>}
          </div>

          {/* Progressive overload per exercise */}
          {DAY_ORDER.map(d=>{
            const s=PROGRAM.find(p=>p.day===d);
            return(
              <div key={d} style={{marginBottom:"24px"}}>
                <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"10px",paddingBottom:"8px",borderBottom:`2px solid ${C.goldBorder}`}}>
                  <div style={{fontSize:"11px",letterSpacing:"3px",color:C.gold,textTransform:"uppercase",fontWeight:"bold"}}>{s.fullDay}</div>
                  <div style={{fontSize:"12px",color:C.textMuted,fontWeight:"500"}}>{s.label}</div>
                </div>
                {(s.groups||[]).flatMap(g=>g.exercises||[]).filter(ex=>ex.id&&ex.lockedSets!==0).map(ex=>{
                  const variantKey=variantSelections[ex.id]||null;
                  const trackerLogKey=variantKey?ex.id+"_v_"+variantKey:ex.id;
                  const logA=sessionLog[trackerLogKey+"_w"+week+"_a"]||[];
                  const done=(logA||[]).filter(s=>s&&s.weight&&s.reps);
                  const prog=checkProgression(logA,getPhaseRepRange(ex,phase)||ex.reps||"10–12");
                  const ps=getPhaseSets(null,phase.type,ex,phase.sets);
                  const{max}=parseRange(ex.reps||phase.reps||"10–12");
                  return(
                    <div key={ex.id} style={{marginBottom:"10px",background:C.surface,border:`1.5px solid ${C.border}`,borderRadius:"8px",padding:"13px 15px"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"6px"}}>
                        <div style={{fontSize:"14px",fontWeight:"bold",color:C.white,maxWidth:"220px",lineHeight:1.3}}>
                          {(()=>{
                            const vk=variantSelections[ex.id];
                            const vd=vk&&ex.variants?ex.variants[vk]:null;
                            if(vd)return(<><span style={{color:C.gold}}>{vd.name}</span><span style={{fontSize:"11px",color:C.textFaint,fontWeight:"normal",display:"block"}}>Variant of: {ex.name}</span></>);
                            return <>{ex.name}{ex.isSuperset&&ex.subName?<span style={{fontSize:"12px",color:C.textFaint,fontWeight:"normal"}}> / {ex.subName}</span>:""}</>;
                          })()}
                        </div>
                        {prog&&<span style={{fontSize:"9px",letterSpacing:"1px",background:C.green,color:C.bg,padding:"3px 8px",borderRadius:"3px",fontWeight:"bold",whiteSpace:"nowrap"}}>↑ ADD WEIGHT</span>}
                      </div>
                      <div style={{fontSize:"12px",color:C.textMuted,marginBottom:"8px",fontWeight:"500"}}>{ps} × {ex.reps||phase.reps} · {phase.focus}</div>
                      {done.length>0?(
                        <div style={{display:"flex",gap:"5px",flexWrap:"wrap"}}>
                          {done.map((set,si)=>(
                            <div key={si} style={{background:parseInt(set.reps)>=max?C.greenLight:C.surfaceMid,border:`1.5px solid ${parseInt(set.reps)>=max?C.greenBorder:C.border}`,borderRadius:"4px",padding:"4px 9px",fontSize:"12px",color:parseInt(set.reps)>=max?C.green:C.textMid,fontWeight:"bold"}}>
                              {set.weight}lb×{set.reps}<span style={{color:C.textFaint,fontWeight:"normal"}}> @{set.rir}</span>
                            </div>
                          ))}
                        </div>
                      ):(
                        <div style={{fontSize:"12px",color:C.textFaint,fontStyle:"italic"}}>Not logged this week</div>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      )}

      {/* ══ BODY COMP VIEW ══ */}
      {view==="bodycomp"&&<BodyCompView/>}

    </div>
    {pickerEx&&(
      <VariantPicker
        ex={pickerEx}
        side={pickerSide}
        currentVariant={variantSelections[pickerEx.id]||null}
        onSelect={(altId)=>{
          const key=pickerSide?pickerEx.id+"_"+pickerSide:pickerEx.id;
          handleAltSelect(key,altId);
          setPickerEx(null);setPickerSide(null);
        }}
        onClose={()=>{setPickerEx(null);setPickerSide(null);}}/>
    )}
    </>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
