// ── PHASE CONFIG ──────────────────────────────────────────────────
function getPhase(w) {
  if (w <= 2) return { name:"CALIBRATION",        rir:"3–4 RIR", color:C.trouserBlue,  colorBg:C.trouserLight,  weeks:"1–2", note:"Movement quality over load. Find baseline weights. No intensity techniques." };
  if (w <= 4) return { name:"LOADING",             rir:"2–3 RIR", color:C.gold,         colorBg:C.goldLight,     weeks:"3–4", note:"True working weights established. Still no intensity techniques." };
  if (w <= 7) return { name:"PROGRESSIVE OVERLOAD",rir:"1–2 RIR", color:C.midnightBlue, colorBg:C.midnightLight, weeks:"5–7", note:"Double progression in full effect. Add weight when earned." };
  if (w <= 9) return { name:"INTENSIFICATION",     rir:"0–1 RIR isolation / 1 RIR compounds", color:C.scarlet, colorBg:C.scarletLight, weeks:"8–9", note:"Intensity techniques on isolation and machine work ONLY." };
  return { name:"DELOAD", rir:"3–4 RIR", color:C.textMuted, colorBg:C.bgAlt, weeks:"10", note:"Volume cut 40–50%. Load at 60–70% of working weight. Recover fully." };
}

// ── READINESS ─────────────────────────────────────────────────────
function scoreReadiness(i) {
  // Each input scored out of 10, total out of 70
  // Garmin metrics: divide raw score by 10 (keeps decimals)
  const bodyBatteryScore    = parseFloat((i.bodyBattery / 10).toFixed(1));
  const sleepScore          = parseFloat((i.sleepScore / 10).toFixed(1));
  const trainingReadiness   = parseFloat((i.trainingReadiness / 10).toFixed(1));
  // HRV Status: label-based, whole numbers
  const hrvScore = ({favorable:10, balanced:7, unbalanced:4, poor:1})[i.hrv] || 5;
  // Resting HR: label-based, whole numbers
  const hrScore  = ({at:10, "1-3":7, "4-6":4, "7+":1})[i.restingHR] || 5;
  // Soreness: user enters 0-10, we invert (high soreness = low score)
  const sorenessScore = parseFloat((10 - i.soreness).toFixed(1));
  // Motivation: carries directly
  const motivationScore = parseFloat(i.motivation.toFixed(1));

  const total = bodyBatteryScore + sleepScore + trainingReadiness + hrvScore + hrScore + sorenessScore + motivationScore;
  return parseFloat(total.toFixed(1));
}

function getTier(score) {
  // Out of 70 total. Bands maintain same proportional thresholds as original system.
  if (score >= 56) return { tier:"GREEN",  label:"PUSH",         color:C.green,   bg:C.greenBg,     note:"Train exactly as programmed. Don't waste a green day." };
  if (score >= 42) return { tier:"YELLOW", label:"TRAIN NORMAL", color:C.gold,    bg:C.goldLight,   note:"Add 1 RIR to all sets. No intensity techniques. Skip Friday conditioning finisher." };
  if (score >= 28) return { tier:"ORANGE", label:"REDUCE",       color:"#B85C00", bg:"#FDF3EA",     note:"Cut one set per exercise. Add 1–2 RIR. Skip conditioning finisher. Three Orange days in 7 = immediate deload." };
  return { tier:"RED", label:"REST", color:C.scarlet, bg:C.scarletLight, note:"Do not train. Zone 2 only — 20–30 min easy walk or bike." };
}

// ── PROGRESSION ───────────────────────────────────────────────────
function parseRange(r) {
  const m = r ? r.match(/(\d+)[–\-](\d+)/) : null;
  return m ? { min:parseInt(m[1]), max:parseInt(m[2]) } : { min:0, max:0 };
}
function checkProgression(log, repRange) {
  const completed = (log||[]).filter(s => s && s.reps && s.weight);
  if (!completed.length) return false;
  const { max } = parseRange(repRange);
  return completed.every(s => parseInt(s.reps) >= max) && parseInt(completed[completed.length-1].rir||0) >= 1;
}

// ── WARM-UP CALC ──────────────────────────────────────────────────
function feederCount(feeders) {
  if (!feeders) return 0;
  if (feeders.includes("3 Sets") || feeders.includes("3 Warm")) return 3;
  if (feeders.includes("2 Sets") || feeders.includes("2 Warm")) return 2;
  if (feeders.includes("1 Set")  || feeders.includes("1 Warm")) return 1;
  return 0;
}
function calcWarmup(w, count) {
  const wt = parseFloat(w);
  if (!wt || isNaN(wt) || wt <= 0) return null;
  const schemes = {
    3: [{pct:45,reps:"6–10"},{pct:65,reps:"4–6"},{pct:85,reps:"3–4"}],
    2: [{pct:50,reps:"6–10"},{pct:70,reps:"4–6"}],
    1: [{pct:60,reps:"6–10"}],
  };
  return (schemes[count]||[]).map(s => ({...s, weight: Math.round(wt * s.pct/100 / 5)*5}));
}

// ── REST TIMER ────────────────────────────────────────────────────
function parseRestSeconds(rest) {
  if (!rest) return 90;
  if (rest.includes("2–3") || rest.includes("2-3")) return 150;
  if (rest.includes("3"))   return 180;
  if (rest.includes("2 min")) return 120;
  if (rest.includes("90"))  return 90;
  if (rest.includes("75"))  return 75;
  if (rest.includes("60–75")||rest.includes("60-75")) return 67;
  if (rest.includes("60"))  return 60;
  if (rest.includes("45"))  return 45;
  return 90;
}

function getModifiedSets(originalSets, mode) {

// Global screen flash controller
let globalFlashFn = null;

function RestTimer({ seconds, onDone }) {
  const [remaining, setRemaining] = useState(seconds);
  const [done, setDone]           = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    ref.current = setInterval(() => {
      setRemaining(r => {
        if (r <= 1) {
          clearInterval(ref.current);
          setDone(true);
          if (navigator.vibrate) navigator.vibrate([400,200,400,200,600]);
          if (globalFlashFn) globalFlashFn();
          return 0;
        }
        return r - 1;
      });
    }, 1000);
    return () => clearInterval(ref.current);
  }, []);

  const pct = ((seconds - remaining) / seconds) * 100;
  const mins = Math.floor(remaining / 60);
  const secs = remaining % 60;
  const inCountdown = remaining <= 5 && remaining > 0 && !done;

  return (
    <div style={{
      background: done ? C.greenBg : inCountdown ? "#FFF8E8" : C.midnightLight,
      border: `1px solid ${done ? C.greenBorder : inCountdown ? C.gold : C.midnightBorder}`,
      borderLeft: `3px solid ${done ? C.green : inCountdown ? C.gold : C.midnightBlue}`,
      borderRadius:"4px", padding:"12px 14px", marginTop:"10px",
      transition:"all 0.3s",

          fontSize: inCountdown ? "32px" : "22px",
          fontWeight:"bold",
          color:done?C.green:inCountdown?C.scarlet:C.midnightBlue,
          fontVariantNumeric:"tabular-nums",
          transition:"font-size 0.2s",
        }}>
          {done ? "💥 GO!" : inCountdown ? remaining : `${mins}:${secs.toString().padStart(2,"0")}`}
        </div>

      <div style={{background:done?C.greenBorder:C.midnightBorder,borderRadius:"2px",height:"4px",overflow:"hidden"}}>

          height:"100%",width:`${pct}%`,
          transition:"width 1s linear",borderRadius:"2px",

    </div>
  );
}

// ── SOUNDS ────────────────────────────────────────────────────────
function scheduleBombDrop(restSecs) {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    if (ctx.state === "suspended") ctx.resume();
    const t = ctx.currentTime;
    const whistleStart = Math.max(0.1, restSecs - 5);
    const explodeAt = restSecs;

    // Whistle descend
    const w = ctx.createOscillator();
    const wg = ctx.createGain();
    w.connect(wg); wg.connect(ctx.destination);
    w.type = "sine";
    w.frequency.setValueAtTime(1400, t + whistleStart);
    w.frequency.exponentialRampToValueAtTime(60, t + explodeAt - 0.05);
    wg.gain.setValueAtTime(0.0, t + whistleStart);
    wg.gain.linearRampToValueAtTime(0.45, t + whistleStart + 2.0);
    wg.gain.linearRampToValueAtTime(0.6, t + explodeAt - 0.1);
    wg.gain.linearRampToValueAtTime(0.0, t + explodeAt);
    w.start(t + whistleStart);
    w.stop(t + explodeAt + 0.1);

    // Explosion
    const e = ctx.createOscillator();
    const eg = ctx.createGain();
    const ef = ctx.createBiquadFilter();
    e.connect(ef); ef.connect(eg); eg.connect(ctx.destination);
    e.type = "sawtooth"; ef.type = "lowpass";
    ef.frequency.setValueAtTime(500, t + explodeAt);
    ef.frequency.exponentialRampToValueAtTime(30, t + explodeAt + 0.7);
    e.frequency.setValueAtTime(80, t + explodeAt);
    e.frequency.exponentialRampToValueAtTime(15, t + explodeAt + 0.8);
    eg.gain.setValueAtTime(0.0, t + explodeAt - 0.01);
    eg.gain.linearRampToValueAtTime(1.0, t + explodeAt + 0.04);
    eg.gain.exponentialRampToValueAtTime(0.001, t + explodeAt + 0.9);
    e.start(t + explodeAt - 0.01);
    e.stop(t + explodeAt + 1.0);

    // GO tone
    const g = ctx.createOscillator();
    const gg = ctx.createGain();
    g.connect(gg); gg.connect(ctx.destination);
    g.type = "sine";
    g.frequency.setValueAtTime(280, t + explodeAt + 0.7);
    g.frequency.exponentialRampToValueAtTime(1000, t + explodeAt + 1.2);
    gg.gain.setValueAtTime(0.0, t + explodeAt + 0.65);
    gg.gain.linearRampToValueAtTime(0.6, t + explodeAt + 0.75);
    gg.gain.exponentialRampToValueAtTime(0.001, t + explodeAt + 1.4);
    g.start(t + explodeAt + 0.65);
    g.stop(t + explodeAt + 1.5);

    setTimeout(() => { try { ctx.close(); } catch(e) {} }, (restSecs + 3) * 1000);
  } catch(err) { console.log("Audio:", err); }
}

// ── WARM-UP CALC PANEL ────────────────────────────────────────────
// Mode working weight multipliers
// Functional Day: +2 RIR buffer ≈ 87% of working weight
// Maintenance Day: +3 RIR buffer ≈ 78% of working weight
const MODE_WEIGHT_MULTIPLIERS = {
  full:        { pct: 100 },
  functional:  { pct: 87  },
  maintenance: { pct: 78  },
};

function WarmupCalc({ feeders, color, mode }) {
  const [w, setW] = useState("");
  const count = feederCount(feeders);
  if (!count) return null;

  const activeMode = mode || MODES.full;
  const modeMultiplier = MODE_WEIGHT_MULTIPLIERS[activeMode.id] || MODE_WEIGHT_MULTIPLIERS.full;
  const baseWeight = parseFloat(w);
  const modifiedWeight = (baseWeight && !isNaN(baseWeight) && activeMode.id !== "full")
    ? Math.round(baseWeight * modeMultiplier.pct / 100 / 5) * 5
    : null;
  const effectiveWeight = modifiedWeight || baseWeight;
  const sets = calcWarmup(effectiveWeight, count);

  return (
    <div style={{background:C.bgAlt,border:`1px solid ${C.border}`,borderLeft:`3px solid ${color}`,borderRadius:"3px",padding:"12px 14px",marginBottom:"12px"}}>
      <div style={{fontSize:"8px",letterSpacing:"2px",color,textTransform:"uppercase",fontWeight:"bold",marginBottom:"8px"}}>Nippard Warm-Up Sets</div>
      <input type="number" placeholder="Enter normal working weight (lbs)" value={w} onChange={e=>setW(e.target.value)}
        style={{width:"100%",marginBottom:"10px",textAlign:"left",padding:"8px 10px",background:"#fff",border:`1px solid ${C.border}`,borderRadius:"3px",fontSize:"13px",fontFamily:"Georgia,serif",color:C.text}}/>

      {baseWeight > 0 && !isNaN(baseWeight) && activeMode.id !== "full" && modifiedWeight && (
        <div style={{background:activeMode.colorBg,border:`1px solid ${activeMode.color}55`,borderLeft:`3px solid ${activeMode.color}`,borderRadius:"3px",padding:"10px 12px",marginBottom:"12px"}}>
          <div style={{fontSize:"8px",letterSpacing:"2px",color:activeMode.color,textTransform:"uppercase",fontWeight:"bold",marginBottom:"6px"}}>
            {activeMode.emoji} {activeMode.label} Working Weight
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontSize:"26px",fontWeight:"bold",color:activeMode.color,lineHeight:1}}>
                {modifiedWeight}<span style={{fontSize:"13px",fontWeight:"normal",color:C.textMuted}}> lbs</span>
              </div>
              <div style={{fontSize:"11px",color:C.textMuted,marginTop:"3px"}}>
                {modeMultiplier.pct}% of {baseWeight} lbs · +{activeMode.rirAdd} RIR buffer
              </div>
            </div>
            <div style={{fontSize:"10px",color:C.textFaint,fontStyle:"italic",maxWidth:"110px",textAlign:"right",lineHeight:1.4}}>
              Load this for all working sets today
            </div>
          </div>
        </div>
      )}

      {sets ? (
        <div>
          {baseWeight > 0 && !isNaN(baseWeight) && (
            <div style={{fontSize:"8px",letterSpacing:"2px",color:C.textFaint,textTransform:"uppercase",marginBottom:"7px"}}>
              Warm-Up Sets{activeMode.id !== "full" && modifiedWeight ? ` (ramping to ${modifiedWeight} lbs)` : ""}
            </div>
          )}
          {sets.map((s,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:i<sets.length-1?`1px solid ${C.border}`:"none"}}>
              <div style={{fontSize:"11px",color:C.textMuted,letterSpacing:"1px",textTransform:"uppercase"}}>Set {i+1} — {s.pct}%</div>
              <div style={{display:"flex",gap:"16px",alignItems:"center"}}>
                <div style={{fontSize:"17px",fontWeight:"bold",color:C.text}}>{s.weight}<span style={{fontSize:"11px",color:C.textMuted,fontWeight:"normal"}}> lbs</span></div>
                <div style={{fontSize:"12px",color:C.textMuted}}>{s.reps} reps</div>
              </div>
            </div>
          ))}
          <div style={{fontSize:"10px",color:C.textFaint,marginTop:"8px",fontStyle:"italic"}}>Rounded to nearest 5 lbs. Adjust to available plates.</div>
        </div>
      ) : (
        <div style={{fontSize:"12px",color:C.textFaint,fontStyle:"italic"}}>Enter your working weight to calculate.</div>
      )}
    </div>
  );
}

// ── SET LOG ROW ───────────────────────────────────────────────────
// Global timer registry — persists timers across log open/close
const activeTimers = {};

function SetLogRow({ si, label, repRange, data, onLog, restSecs, color, exId, isLastInSuperset }) {
  const timerKey = `${exId}_set${si}`;
  const [timerVersion, setTimerVersion] = useState(activeTimers[timerKey]||0);
  const { max } = parseRange(repRange);

  function handleLog(field, val) {
    onLog(si, field, val);
    // Double beep on weight or reps log
    // no beep on log entry
  }

  function startTimer() {
    // Schedule bomb drop IMMEDIATELY on tap — iOS Safari requires AudioContext
    // from a direct user touch event, not a timeout or interval callback
    scheduleBombDrop(restSecs);
    const v = (activeTimers[timerKey]||0) + 1;
    activeTimers[timerKey] = v;
    setTimerVersion(v);
  }

  return (
    <div style={{marginBottom:"8px"}}>
      <div style={{display:"flex",gap:"6px",alignItems:"center"}}>
        <div style={{fontSize:"10px",color:C.textMuted,width:"52px",fontWeight:"bold"}}>{label}</div>
        <input type="number" placeholder={max > 0 ? String(max) : "0"} value={data.weight||""} onChange={e=>handleLog("weight",e.target.value)} style={{flex:1}}/>
        <input type="number" placeholder={max > 0 ? `${repRange}` : "0"} value={data.reps||""} onChange={e=>handleLog("reps",e.target.value)} style={{flex:1,color:data.reps && parseInt(data.reps)>=max?C.green:C.text}}/>
        <input type="number" placeholder="RIR" value={data.rir||""} onChange={e=>handleLog("rir",e.target.value)} style={{flex:0.7,color:data.rir!==undefined&&parseInt(data.rir)<=1?C.gold:C.text}}/>
        {data.weight && data.reps && (
          <button onClick={startTimer} style={{
            background:timerVersion>0?"#fff":color,border:`1px solid ${color}`,
            borderRadius:"3px",padding:"6px 8px",color:timerVersion>0?color:"#fff",
            fontSize:"9px",fontWeight:"bold",letterSpacing:"1px",whiteSpace:"nowrap",
          }}>▶ REST</button>
        )}
      </div>
      {timerVersion > 0 && <RestTimer key={timerVersion} seconds={restSecs} onDone={()=>{}} />}
    </div>
  );
}

// ── EXERCISE ROW ──────────────────────────────────────────────────
function ExerciseRow({ ex, session, week, logA, logB, onLogA, onLogB, mode, timeWindow }) {
  const [expanded, setExpanded] = useState(false);
  const [logging,  setLogging]  = useState(false);
  const [usingAlt, setUsingAlt] = useState(false);
  const tierColor = TIER_COLORS[ex.tier] || C.textFaint;
  const activeMode = mode || MODES.full;
  // Week-aware name resolution for Monday chest alternation
  const isOddWeek = week % 2 !== 0;
  const displayName = ex.weekAware
    ? (isOddWeek ? ex.oddName : ex.evenName)
    : ex.name;
  const weekLabel = ex.weekAware
    ? (isOddWeek ? "ODD WEEK" : "EVEN WEEK")
    : null;
  const activeTW = timeWindow || TIME_WINDOWS.full;
  const originalSets = typeof ex.sets === "number" ? ex.sets : 3;
  // Time window takes priority over mode for set count when in Full Session mode
  const twSets = activeMode.id === "full" ? getTimeWindowSets(originalSets, activeTW) : originalSets;
  const numSets = activeMode.id === "full" ? twSets : getModifiedSets(originalSets, activeMode);
  const restSecs  = getModifiedRestSecs(parseRestSeconds(ex.rest), activeMode);
  const completedA = (logA||[]).filter(s=>s&&s.weight&&s.reps);
  const progressionA = checkProgression(logA, ex.repRange||ex.repRangeA||"");
  const hasFeeders = feederCount(ex.feeders) > 0;

  return (
    <div style={{borderBottom:`1px solid ${C.border}`}}>
      <div onClick={()=>{setExpanded(!expanded);setLogging(false);}} style={{padding:"15px 0",cursor:"pointer",display:"flex",gap:"12px",alignItems:"flex-start"}}>
        <div style={{fontSize:"10px",color:C.textFaint,fontWeight:"bold",minWidth:"22px",paddingTop:"2px"}}>{ex.number}</div>
        <div style={{flex:1}}>
          <div style={{fontSize:"8px",letterSpacing:"2px",color:tierColor,textTransform:"uppercase",fontWeight:"bold",marginBottom:"4px"}}>{ex.tier}</div>
          <div style={{display:"flex",alignItems:"center",gap:"6px",flexWrap:"wrap",marginBottom:"5px"}}>
            <div style={{fontSize:"15px",fontWeight:"bold",color:C.text,lineHeight:1.2}}>
              {displayName}{ex.isSuperset && ex.subName ? <span style={{color:C.textMuted,fontWeight:"normal"}}> / {ex.subName}</span> : ""}
            </div>
            {ex.preferred && <span style={{fontSize:"7px",letterSpacing:"1px",color:"#fff",background:session.color,padding:"2px 6px",borderRadius:"2px",fontWeight:"bold",textTransform:"uppercase"}}>PREFERRED</span>}
            {weekLabel && <span style={{fontSize:"7px",letterSpacing:"1px",color:"#fff",background:isOddWeek?C.trouserBlue:C.gold,padding:"2px 6px",borderRadius:"2px",fontWeight:"bold",textTransform:"uppercase"}}>{weekLabel}</span>}
            {progressionA && <span style={{fontSize:"7px",letterSpacing:"1px",color:"#fff",background:C.green,padding:"2px 6px",borderRadius:"2px",fontWeight:"bold",textTransform:"uppercase"}}>↑ ADD WEIGHT</span>}
          </div>
          <div style={{fontSize:"12px",color:C.textMuted}}>
            {ex.isSuperset ? `${ex.repRangeA||ex.repRange} / ${ex.repRangeB||""}` : ex.repRange} · {numSets}
            {activeMode.id !== "full" && numSets !== originalSets ? <span style={{color:activeMode.color}}> of {originalSets}</span> : ""}
            {activeMode.id === "full" && activeTW.id !== "full" && twSets !== originalSets ? <span style={{color:activeTW.color}}> of {originalSets}</span> : ""}
            {" "}sets · Rest: {ex.rest}
          </div>
          {activeMode.rpeCapNote && !ex.noLog && typeof ex.sets === "number" && (
            <div style={{fontSize:"10px",color:activeMode.color,marginTop:"2px",fontWeight:"bold"}}>{activeMode.rpeCapNote}</div>
          )}
          {ex.alt && (
            <div style={{marginTop:"4px",display:"flex",alignItems:"center",gap:"6px",flexWrap:"wrap"}}>
              <div style={{fontSize:"10px",color:usingAlt?session.color:C.textFaint,fontStyle:"italic"}}>
                {usingAlt ? "USING ALT: " : "Alt: "}{ex.alt.split("/")[0].trim()}
              </div>
              {usingAlt && ex.alt.includes("/") && (
                <div style={{fontSize:"9px",color:C.textFaint,fontStyle:"italic"}}>{ex.alt.split("/").slice(1).join("/").trim()}</div>
              )}
            </div>
          )}
          {completedA.length > 0 && (
            <div style={{marginTop:"5px",display:"flex",gap:"4px",flexWrap:"wrap"}}>
              {completedA.map((s,si)=>(
                <span key={si} style={{fontSize:"9px",color:C.green,background:C.greenBg,border:`1px solid ${C.greenBorder}`,borderRadius:"2px",padding:"2px 6px"}}>
                  {s.weight}lb×{s.reps}
                </span>
              ))}
            </div>
          )}
        </div>
        <div style={{fontSize:"16px",color:C.textFaint,transition:"transform 0.15s",transform:expanded?"rotate(45deg)":"none",paddingTop:"2px"}}>+</div>
      </div>

      {expanded && (
        <div style={{paddingBottom:"16px",paddingLeft:"34px"}} onClick={e=>e.stopPropagation()}>
          {hasFeeders && <WarmupCalc feeders={ex.feeders} color={session.color} mode={activeMode}/>}
          <div style={{fontSize:"13px",color:C.textMid,lineHeight:1.75,marginBottom:"10px"}}>{ex.notes}</div>
          {ex.spineFlag && (
            <div style={{background:C.scarletLight,border:`1px solid ${C.scarletBorder}`,borderLeft:`3px solid ${C.scarlet}`,borderRadius:"3px",padding:"9px 12px",marginBottom:"10px"}}>
              <div style={{fontSize:"8px",letterSpacing:"2px",color:C.scarlet,textTransform:"uppercase",fontWeight:"bold",marginBottom:"3px"}}>Spine Flag</div>
              <div style={{fontSize:"12px",color:"#8A1A1A",lineHeight:1.5}}>{ex.spineFlag}</div>
            </div>
          )}

          {!ex.noLog && typeof ex.sets === "number" && (
            <>
              {ex.alt && (
                <button onClick={()=>setUsingAlt(!usingAlt)} style={{
                  background:usingAlt?session.color+"22":"transparent",
                  border:`1px solid ${usingAlt?session.color:C.borderMid}`,
                  borderRadius:"3px",padding:"7px 14px",marginRight:"8px",marginBottom:"8px",
                  color:usingAlt?session.color:C.textFaint,
                  fontSize:"9px",letterSpacing:"1px",textTransform:"uppercase",fontWeight:"bold",
                }}>
                  {usingAlt ? "✓ USING ALT" : "SWITCH TO ALT"}
                </button>
              )}
              <button onClick={()=>setLogging(!logging)} style={{
                background:logging?session.color:"transparent",
                border:`1px solid ${logging?session.color:C.borderMid}`,
                borderRadius:"3px",padding:"8px 16px",
                color:logging?"#fff":C.textMuted,
                fontSize:"9px",letterSpacing:"2px",textTransform:"uppercase",
                fontWeight:"bold",marginBottom:logging?"14px":"0",
              }}>
                {logging?"CLOSE LOG":"LOG SETS"}
              </button>

              {logging && (
                <div style={{marginTop:"12px"}}>
                  {/* Header row */}
                  <div style={{display:"flex",gap:"6px",marginBottom:"8px"}}>
                    <div style={{width:"52px"}}/>
                    <div style={{flex:1,fontSize:"9px",color:C.textFaint,textAlign:"center",letterSpacing:"1px",textTransform:"uppercase"}}>LBS</div>
                    <div style={{flex:1,fontSize:"9px",color:C.textFaint,textAlign:"center",letterSpacing:"1px",textTransform:"uppercase"}}>REPS</div>
                    <div style={{flex:0.7,fontSize:"9px",color:C.textFaint,textAlign:"center",letterSpacing:"1px",textTransform:"uppercase"}}>RIR</div>
                    <div style={{width:"52px"}}/>
                  </div>

                  {/* Alt indicator in log */}
                  {usingAlt && ex.alt && (
                    <div style={{background:session.colorBg,border:`1px solid ${session.color}44`,borderLeft:`3px solid ${session.color}`,borderRadius:"3px",padding:"7px 10px",marginBottom:"10px"}}>
                      <div style={{fontSize:"8px",letterSpacing:"2px",color:session.color,textTransform:"uppercase",fontWeight:"bold",marginBottom:"2px"}}>Logging Alternative</div>
                      <div style={{fontSize:"11px",color:C.textMid}}>{ex.alt.split("/")[0].trim()}</div>
                    </div>
                  )}
                  {/* Movement A */}
                  {ex.isSuperset && (
                    <div style={{fontSize:"9px",letterSpacing:"2px",color:session.color,textTransform:"uppercase",fontWeight:"bold",marginBottom:"6px"}}>
                      A — {usingAlt && ex.alt ? ex.alt.split("/")[0].trim() : ex.name}
                    </div>
                  )}
                  {[...Array(numSets)].map((_,si)=>(
                    <SetLogRow key={`a${si}`}
                      si={si} label={`Set ${si+1}`}
                      repRange={ex.repRangeA||ex.repRange||""}
                      data={(logA||[])[si]||{}}
                      onLog={onLogA}
                      restSecs={restSecs}
                      color={session.color}
                      exId={ex.id+"_a"}
                      isLastInSuperset={ex.isSuperset ? false : si===numSets-1}
                    />
                  ))}

                  {/* Movement B for supersets */}
                  {ex.isSuperset && ex.subName && (
                    <>
                      <div style={{height:"1px",background:C.border,margin:"12px 0"}}/>
                      <div style={{fontSize:"9px",letterSpacing:"2px",color:session.color,textTransform:"uppercase",fontWeight:"bold",marginBottom:"6px"}}>
                        B — {ex.subName}
                      </div>
                      {[...Array(numSets)].map((_,si)=>(
                        <SetLogRow key={`b${si}`}
                          si={si} label={`Set ${si+1}`}
                          repRange={ex.repRangeB||ex.repRange||""}
                          data={(logB||[])[si]||{}}
                          onLog={onLogB}
                          restSecs={restSecs}
                          color={session.color}
                          exId={ex.id+"_b"}
                          isLastInSuperset={si===numSets-1}

                      ))}
                    </>
                  )}

                  {progressionA && (
                    <div style={{background:C.greenBg,border:`1px solid ${C.greenBorder}`,borderLeft:`3px solid ${C.green}`,borderRadius:"3px",padding:"9px 12px",marginTop:"10px"}}>

        </div>
      )}
    </div>
  );
}

// ── BODY COMP TRACKER ─────────────────────────────────────────────
function BodyCompView({ phase }) {
  const [log, setLog] = useState(() => LS.get("block1_bodycomp") || []);
  const [wt,  setWt]  = useState("");
  const [bf,  setBf]  = useState("");
  const [note,setNote]= useState("");
  const [neck,  setNeck]   = useState("");
  const [waist, setWaist]  = useState("");
  const [height,setHeight] = useState("");
  const [navyBF,setNavyBF] = useState("");

  function calcNavyBF() {
    const n = parseFloat(neck), w = parseFloat(waist), h = parseFloat(height);
    if (!n||!w||!h||w<=n) return;
    // Navy method for men: BF% = 86.010 * log10(waist-neck) - 70.041 * log10(height) + 36.76
    const result = (86.010 * Math.log10(w - n) - 70.041 * Math.log10(h) + 36.76).toFixed(1);
    setNavyBF(result);
    setBf(result); // auto-populate the BF field
  }

  function addEntry() {
    if (!wt) return;
    const entry = { date: new Date().toLocaleDateString(), weight: parseFloat(wt), bf: bf ? parseFloat(bf) : null, note };
    const newLog = [...log, entry];
    setLog(newLog);
    LS.set("block1_bodycomp", newLog);
    setWt(""); setBf(""); setNote("");
  }

  const recent = [...log].slice(-10);
  const minW = recent.length ? Math.min(...recent.map(e=>e.weight)) - 5 : 150;
  const maxW = recent.length ? Math.max(...recent.map(e=>e.weight)) + 5 : 220;

  return (
    <div style={{padding:"20px 18px"}}>
      <div style={{fontSize:"9px",letterSpacing:"3px",color:C.textFaint,textTransform:"uppercase",marginBottom:"18px",fontWeight:"bold"}}>Body Composition</div>

      {/* Entry form */}
      {/* Navy BF% Calculator */}
      <div style={{background:C.bgCard,border:`1px solid ${C.border}`,borderRadius:"4px",padding:"16px",marginBottom:"12px"}}>
        <div style={{fontSize:"9px",letterSpacing:"2px",color:C.midnightBlue,textTransform:"uppercase",fontWeight:"bold",marginBottom:"4px"}}>Navy BF% Calculator</div>
        <div style={{fontSize:"10px",color:C.textFaint,marginBottom:"12px"}}>Neck · Waist · Height in inches → auto-populates BF% below</div>
        <div style={{display:"flex",gap:"8px",marginBottom:"10px"}}>
          <div style={{flex:1}}>
            <div style={{fontSize:"9px",color:C.textFaint,letterSpacing:"1px",textTransform:"uppercase",marginBottom:"4px"}}>Neck (in)</div>
            <input type="number" placeholder="15.5" value={neck} onChange={e=>setNeck(e.target.value)} style={{width:"100%"}}/>
          </div>
          <div style={{flex:1}}>
            <div style={{fontSize:"9px",color:C.textFaint,letterSpacing:"1px",textTransform:"uppercase",marginBottom:"4px"}}>Waist (in)</div>
            <input type="number" placeholder="34.0" value={waist} onChange={e=>setWaist(e.target.value)} style={{width:"100%"}}/>
          </div>
          <div style={{flex:1}}>
            <div style={{fontSize:"9px",color:C.textFaint,letterSpacing:"1px",textTransform:"uppercase",marginBottom:"4px"}}>Height (in)</div>
            <input type="number" placeholder="71" value={height} onChange={e=>setHeight(e.target.value)} style={{width:"100%"}}/>
          </div>
        </div>
        <button onClick={calcNavyBF} style={{
          width:"100%",padding:"10px",background:C.midnightBlue,border:"none",borderRadius:"3px",
          color:"#fff",fontSize:"9px",fontWeight:"bold",letterSpacing:"2px",textTransform:"uppercase",
          marginBottom: navyBF ? "10px" : "0",
        }}>CALCULATE</button>
        {navyBF && (
          <div style={{background:C.midnightLight,border:`1px solid ${C.midnightBorder}`,borderLeft:`3px solid ${C.midnightBlue}`,borderRadius:"3px",padding:"10px 12px"}}>
            <div style={{fontSize:"8px",letterSpacing:"2px",color:C.midnightBlue,textTransform:"uppercase",marginBottom:"3px",fontWeight:"bold"}}>Navy Method Result</div>
            <div style={{fontSize:"22px",fontWeight:"bold",color:C.midnightBlue}}>{navyBF}% <span style={{fontSize:"12px",color:C.textMuted,fontWeight:"normal"}}>body fat — auto-populated below</span></div>
          </div>
        )}
      </div>

      {/* Log entry */}
      <div style={{background:C.bgCard,border:`1px solid ${C.border}`,borderRadius:"4px",padding:"16px",marginBottom:"20px"}}>
        <div style={{fontSize:"9px",letterSpacing:"2px",color:phase.color,textTransform:"uppercase",fontWeight:"bold",marginBottom:"12px"}}>Log Today</div>
        <div style={{display:"flex",gap:"8px",marginBottom:"10px"}}>
          <div style={{flex:1}}>
            <div style={{fontSize:"9px",color:C.textFaint,letterSpacing:"1px",textTransform:"uppercase",marginBottom:"4px"}}>Weight (lbs)</div>
            <input type="number" placeholder="185" value={wt} onChange={e=>setWt(e.target.value)} style={{width:"100%"}}/>
          </div>
          <div style={{flex:1}}>
            <div style={{fontSize:"9px",color:C.textFaint,letterSpacing:"1px",textTransform:"uppercase",marginBottom:"4px"}}>Body Fat %</div>
            <input type="number" placeholder="15.0" value={bf} onChange={e=>setBf(e.target.value)} style={{width:"100%",background:navyBF&&bf===navyBF?C.midnightLight:"#fff",borderColor:navyBF&&bf===navyBF?C.midnightBlue:C.border}}/>
          </div>
        </div>
        <button onClick={addEntry} style={{
          width:"100%",padding:"12px",background:phase.color,border:"none",borderRadius:"3px",
          color:"#fff",fontSize:"10px",fontWeight:"bold",letterSpacing:"2px",textTransform:"uppercase",
        }}>LOG ENTRY</button>
      </div>

      {/* Weight chart */}
      {recent.length >= 2 && (
        <div style={{background:C.bgCard,border:`1px solid ${C.border}`,borderRadius:"4px",padding:"16px",marginBottom:"16px"}}>
          <div style={{fontSize:"9px",letterSpacing:"2px",color:C.textFaint,textTransform:"uppercase",fontWeight:"bold",marginBottom:"12px"}}>Weight Trend</div>
          <svg width="100%" height="120" viewBox={`0 0 ${recent.length*40} 120`} preserveAspectRatio="none">
            <polyline
              points={recent.map((e,i)=>`${i*40+20},${120-((e.weight-minW)/(maxW-minW))*100}`).join(" ")}
              fill="none" stroke={phase.color} strokeWidth="2" strokeLinejoin="round"
            />
            {recent.map((e,i)=>{
              const cx = i*40+20;
              const cy = 120-((e.weight-minW)/(maxW-minW))*100;
              const labelRight = cx < (recent.length*40)/2;
              return (
                <g key={i}>
                  <circle cx={cx} cy={cy} r="3" fill={phase.color}/>
                  <text
                    x={labelRight ? cx+6 : cx-6}
                    y={cy+4}
                    textAnchor={labelRight?"start":"end"}
                    fontSize="8"
                    fill={C.textMuted}
                  >{e.weight}</text>
                </g>
              );
            })}
          </svg>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:"4px"}}>
            {recent.map((e,i)=>(
              <div key={i} style={{fontSize:"8px",color:C.textFaint,textAlign:"center",flex:1}}>{e.date.split("/").slice(0,2).join("/")}</div>
            ))}
          </div>
        </div>
      )}

      {/* Log table */}
      {log.length > 0 && (
        <div style={{background:C.bgCard,border:`1px solid ${C.border}`,borderRadius:"4px",overflow:"hidden"}}>
          <div style={{padding:"12px 14px",borderBottom:`1px solid ${C.border}`,display:"flex",gap:"8px"}}>
            <div style={{flex:2,fontSize:"9px",color:C.textFaint,letterSpacing:"1px",textTransform:"uppercase",fontWeight:"bold"}}>Date</div>
            <div style={{flex:1,fontSize:"9px",color:C.textFaint,letterSpacing:"1px",textTransform:"uppercase",fontWeight:"bold",textAlign:"center"}}>Weight</div>
            <div style={{flex:1,fontSize:"9px",color:C.textFaint,letterSpacing:"1px",textTransform:"uppercase",fontWeight:"bold",textAlign:"center"}}>BF%</div>
          </div>
          {[...log].reverse().slice(0,10).map((e,i)=>(
            <div key={i} style={{padding:"10px 14px",borderBottom:`1px solid ${C.border}`,display:"flex",gap:"8px",alignItems:"center"}}>
              <div style={{flex:2,fontSize:"12px",color:C.textMid}}>{e.date}</div>
              <div style={{flex:1,fontSize:"13px",fontWeight:"bold",color:phase.color,textAlign:"center"}}>{e.weight}</div>
              <div style={{flex:1,fontSize:"13px",color:C.textMuted,textAlign:"center"}}>{e.bf || "—"}</div>
            </div>
          ))}
        </div>
      )}

      {log.length === 0 && (
        <div style={{textAlign:"center",padding:"40px 20px",color:C.textFaint,fontSize:"13px",fontStyle:"italic"}}>
          No entries yet. Log your first body composition data above.
        </div>
      )}
    </div>
  );
}

// ── EXCEL EXPORT ─────────────────────────────────────────────────
function exportToExcel(sessionLog, readinessLog, bodyCompLog, week) {
  // Build CSV content for each data type then combine into one download
  const rows = [];

  // Header
  rows.push(["RAYMOND — BLOCK 1 TRAINING LOG"]);
  rows.push(["Exported:", new Date().toLocaleDateString()]);
  rows.push([]);

  // Session Log
  rows.push(["SESSION LOG"]);
  rows.push(["Exercise","Week","Set","Weight (lbs)","Reps","RIR"]);
  Object.entries(sessionLog).forEach(([key, sets]) => {
    const parts = key.split("_w");
    const exId = parts[0];
    const wk = parts[1] ? parts[1].replace("_a","").replace("_b","") : "?";
    const side = key.includes("_b") ? " (B)" : key.includes("_a") ? " (A)" : "";
    (sets||[]).forEach((s,i) => {
      if (s && s.weight) {
        rows.push([exId + side, "Week " + wk, "Set " + (i+1), s.weight, s.reps||"", s.rir||""]);
      }
    });
  });
  rows.push([]);

  // Readiness Log
  rows.push(["READINESS LOG"]);
  rows.push(["Date","Score","Tier"]);
  Object.entries(readinessLog).forEach(([date, entry]) => {
    rows.push([date, entry.score, entry.tier]);
  });
  rows.push([]);

  // Body Comp Log
  rows.push(["BODY COMPOSITION LOG"]);
  rows.push(["Date","Weight (lbs)","Body Fat %"]);
  (bodyCompLog||[]).forEach(entry => {
    rows.push([entry.date, entry.weight, entry.bf||""]);
  });

  // Convert to CSV
  const csv = rows.map(r => r.map(cell => `"${String(cell||"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `raymond_block1_week${week}_${new Date().toISOString().split("T")[0]}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ── MAIN APP ──────────────────────────────────────────────────────
function App() {
  const [view,       setView]       = useState("session");
  const [activeDay,  setActiveDay]  = useState("MON");
  const [week,       setWeek]       = useState(() => LS.get("block1_week") || 1);
  const [sessionLog, setSessionLog] = useState(() => LS.get("block1_log") || {});
  const [completedSessions, setCompletedSessions] = useState(() => LS.get("block1_completed") || {});
  const [readinessLog, setReadinessLog] = useState(() => LS.get("block1_readiness") || {});
  const [sessionMode, setSessionMode] = useState("full");
  const [timeWindow, setTimeWindow] = useState("full");
  const [screenFlash, setScreenFlash] = useState(false);
  const [ri,    setRi]    = useState({bodyBattery:70,sleepScore:75,trainingReadiness:65,hrv:"favorable",restingHR:"at",soreness:2,motivation:8});
  const [todayScore, setTodayScore] = useState(null);

  const phase   = getPhase(week);
  const session = SESSIONS[activeDay];
  const today   = new Date().toDateString();
  const activeMode = MODES[sessionMode] || MODES.full;
  const activeTW = (sessionMode === "full") ? (TIME_WINDOWS[timeWindow] || TIME_WINDOWS.full) : TIME_WINDOWS.full;

  // Wire global screen flash to App state
  globalFlashFn = () => {
    setScreenFlash(true);
    setTimeout(() => setScreenFlash(false), 3500);
  };

  function handleWeekChange(w) { setWeek(w); LS.set("block1_week", w); }

  function getLogA(exId) { return sessionLog[`${exId}_w${week}_a`] || []; }
  function getLogB(exId) { return sessionLog[`${exId}_w${week}_b`] || []; }

  function handleLog(exId, ab, si, field, val) {
    const key  = `${exId}_w${week}_${ab}`;
    const curr = sessionLog[key] || [];
    const upd  = [...curr];
    if (!upd[si]) upd[si] = {};
    upd[si][field] = val;
    const newLog = {...sessionLog, [key]: upd};
    setSessionLog(newLog);
    LS.set("block1_log", newLog);
  }

  function markComplete() {
    const key = `${activeDay}_w${week}`;
    const newC = {...completedSessions, [key]: { date: today, timestamp: Date.now() }};
    setCompletedSessions(newC);
    LS.set("block1_completed", newC);
  }

  const isComplete = !!completedSessions[`${activeDay}_w${week}`];

  function handleReadiness() {
    const score = scoreReadiness(ri);
    const entry = { score, tier: getTier(score).tier, date: today };
    const newLog = {...readinessLog, [today]: entry};
    setReadinessLog(newLog);
    setTodayScore(score);
    LS.set("block1_readiness", newLog);
    // Auto-suggest session mode based on score
    if (score >= 56) setSessionMode("full");
    else if (score >= 42) setSessionMode("functional");
    else setSessionMode("maintenance");
  }

  return (
    <div style={{
      minHeight:"100vh",
      background: screenFlash ? "#2E7D52" : C.bg,

      transition: screenFlash ? "background 0.05s" : "background 0.4s",

      {/* ── TOP NAV ── */}
      <div style={{background:C.bgHeader,borderBottom:`1px solid ${C.border}`,padding:"18px 18px 0",position:"sticky",top:0,zIndex:20}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"12px"}}>
          <div>
            <div style={{fontSize:"8px",letterSpacing:"4px",color:C.textFaint,textTransform:"uppercase",marginBottom:"3px"}}>AmFam Swift Creek</div>
            <div style={{fontSize:"15px",fontWeight:"bold",letterSpacing:"1px",color:C.midnightBlue,textTransform:"uppercase"}}>Block 1 — Hypertrophy</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:"5px"}}>
            <div style={{fontSize:"8px",color:C.textFaint,letterSpacing:"2px",textTransform:"uppercase"}}>WEEK</div>
            <div style={{display:"flex",gap:"3px"}}>
              {[...Array(10)].map((_,i)=>{
                const wk = i+1;
                const isActive = week === wk;
                return (
                  <div key={i} onClick={()=>handleWeekChange(wk)} style={{
                    width:"18px",height:"18px",borderRadius:"2px",display:"flex",alignItems:"center",justifyContent:"center",
                    background:isActive?phase.color:C.bgCard,
                    border:`1px solid ${isActive?phase.color:C.border}`,
                    color:isActive?"#fff":C.textFaint,
                    fontSize:"9px",fontWeight:"bold",cursor:"pointer",
                  }}>{wk}</div>
                );
              })}
            </div>
          </div>
        </div>

        {/* Phase badge */}
        <div style={{background:phase.colorBg,border:`1px solid ${phase.color}55`,borderLeft:`3px solid ${phase.color}`,borderRadius:"3px",padding:"8px 12px",marginBottom:"12px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>

            ];
            return (
              <div style={{background:C.bgCard,border:`1px solid ${C.border}`,borderRadius:"4px",padding:"14px",marginBottom:"24px"}}>
                <div style={{fontSize:"9px",letterSpacing:"2px",color:C.textFaint,textTransform:"uppercase",fontWeight:"bold",marginBottom:"10px"}}>Score Breakdown</div>
                {inputs.map(([label, score]) => (
                  <div key={label} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:`1px solid ${C.border}`}}>
                    <div style={{fontSize:"11px",color:C.textMid}}>{label}</div>
                    <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                      <div style={{width:"80px",height:"4px",background:C.bgAlt,borderRadius:"2px",overflow:"hidden"}}>
                        <div style={{width:`${(score/10)*100}%`,height:"100%",background:score>=7?C.green:score>=4?C.gold:C.scarlet,borderRadius:"2px"}}/>
                      </div>
                      <div style={{fontSize:"13px",fontWeight:"bold",color:score>=7?C.green:score>=4?C.gold:C.scarlet,minWidth:"28px",textAlign:"right"}}>{score}</div>
                    </div>
                  </div>
                ))}
              </div>
            );
          })()}

          {Object.keys(readinessLog).length > 0 && (
            <div>
              <div style={{fontSize:"9px",letterSpacing:"3px",color:C.textFaint,textTransform:"uppercase",marginBottom:"12px",fontWeight:"bold"}}>Recent History</div>
              {Object.entries(readinessLog).slice(-5).reverse().map(([date,entry])=>{
                const t = getTier(entry.score);
                return (
                  <div key={date} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:`1px solid ${C.border}`}}>
                    <div style={{fontSize:"11px",color:C.textMuted}}>{date}</div>
                    <div style={{display:"flex",gap:"12px",alignItems:"center"}}>
                      <div style={{fontSize:"9px",color:t.color,letterSpacing:"1px",fontWeight:"bold"}}>{entry.tier}</div>
                      <div style={{fontSize:"14px",color:t.color,fontWeight:"bold"}}>{entry.score}<span style={{fontSize:"10px",color:C.textFaint}}>/70</span></div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* ══ TRACKER VIEW ══ */}
      {view === "tracker" && (
        <div style={{padding:"20px 18px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"18px"}}>
            <div style={{fontSize:"9px",letterSpacing:"3px",color:C.textFaint,textTransform:"uppercase",fontWeight:"bold"}}>Progressive Overload — Week {week}</div>
            <button onClick={()=>exportToExcel(sessionLog,readinessLog,LS.get("block1_bodycomp")||[],week)} style={{
              background:C.midnightBlue,border:"none",borderRadius:"3px",
              padding:"8px 14px",color:"#fff",
              fontSize:"9px",letterSpacing:"1px",textTransform:"uppercase",fontWeight:"bold",
            }}>⬇ EXPORT CSV</button>
          </div>

          {/* Completion grid */}
          <div style={{background:C.bgCard,border:`1px solid ${C.border}`,borderRadius:"4px",padding:"14px",marginBottom:"20px"}}>
            <div style={{fontSize:"9px",letterSpacing:"2px",color:C.textFaint,textTransform:"uppercase",fontWeight:"bold",marginBottom:"10px"}}>Session Completion</div>
            <div style={{display:"flex",gap:"6px"}}>
              {DAY_ORDER.map(d=>{
                const done = !!completedSessions[`${d}_w${week}`];
                return (
                  <div key={d} style={{flex:1,textAlign:"center"}}>
                    <div style={{
                      padding:"8px 4px",borderRadius:"3px",
                      background:done?C.green:C.bgAlt,
                      border:`1px solid ${done?C.green:C.border}`,
                      fontSize:"9px",fontWeight:"bold",
                      color:done?"#fff":C.textFaint,
                    }}>{done?"✓":d}</div>
                  </div>
                );
              })}
            </div>
          </div>

          {DAY_ORDER.filter(d=>d!=="SUN").map(d=>{
            const s = SESSIONS[d];
            return (
              <div key={d} style={{marginBottom:"22px"}}>
                <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"8px",paddingBottom:"6px",borderBottom:`2px solid ${s.color}44`}}>
                  <div style={{fontSize:"8px",letterSpacing:"3px",color:s.color,textTransform:"uppercase",fontWeight:"bold"}}>{s.fullDay}</div>
                  <div style={{fontSize:"10px",color:C.textFaint}}>{s.focus}</div>
                </div>
                {s.exercises.filter(ex=>typeof ex.sets==="number"&&!ex.noLog).map(ex=>{
                  const logA = getLogA(ex.id);
                  const completedA = (logA||[]).filter(s=>s&&s.weight&&s.reps);
                  const progression = checkProgression(logA, ex.repRange||ex.repRangeA||"");
                  const { max } = parseRange(ex.repRange||ex.repRangeA||"");
                  return (
                    <div key={ex.id} style={{marginBottom:"10px",background:C.bgCard,border:`1px solid ${C.border}`,borderRadius:"3px",padding:"11px 13px"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"5px"}}>
                        <div style={{fontSize:"13px",fontWeight:"bold",color:C.text,maxWidth:"210px",lineHeight:1.3}}>
                          {ex.name}{ex.isSuperset&&ex.subName?<span style={{fontSize:"11px",color:C.textFaint,fontWeight:"normal"}}> / {ex.subName}</span>:""}
                        </div>
                        {progression&&<span style={{fontSize:"7px",letterSpacing:"1px",background:C.green,color:"#fff",padding:"2px 6px",borderRadius:"2px",fontWeight:"bold",whiteSpace:"nowrap"}}>↑ ADD WEIGHT</span>}
                      </div>
                      <div style={{fontSize:"11px",color:C.textMuted,marginBottom:"7px"}}>{ex.sets} × {ex.repRange||ex.repRangeA}</div>
                      {completedA.length>0?(
                        <div style={{display:"flex",gap:"4px",flexWrap:"wrap"}}>
                          {completedA.map((set,si)=>(
                            <div key={si} style={{
                              background:parseInt(set.reps)>=max?C.greenBg:C.bgAlt,
                              border:`1px solid ${parseInt(set.reps)>=max?C.greenBorder:C.border}`,
                              borderRadius:"2px",padding:"3px 8px",
                              fontSize:"11px",color:parseInt(set.reps)>=max?C.green:C.textMid,
                            }}>{set.weight}lb×{set.reps} <span style={{color:C.textFaint}}>@{set.rir}RIR</span></div>
                          ))}
                        </div>
                      ):(
                        <div style={{fontSize:"11px",color:C.textFaint,fontStyle:"italic"}}>Not logged this week</div>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      )}

      {/* ══ BODY COMP VIEW ══ */}
      {view === "bodycomp" && <BodyCompView phase={phase}/>}

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
