          style={{flex:1,padding:"12px 2px 10px",minHeight:"64px",background:view===tab.id?C.cyanLight:"transparent",border:"none",borderTop:`3px solid ${view===tab.id?C.cyan:"transparent"}`,color:view===tab.id?C.cyan:C.textMuted,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"5px",transition:"all 0.2s"}}>
          <div style={{fontSize:"24px",lineHeight:1}}>{tab.icon}</div>
          <div style={{fontSize:"10px",letterSpacing:"0.5px",fontWeight:"bold",textTransform:"uppercase"}}>{tab.label}</div>
        </button>
      ))}
    </div>

    {/* ── VARIANT PICKER OVERLAY ── */}
    {pickerEx&&(
      <VariantPicker ex={pickerEx} side={pickerSide}
        currentVariant={variantSelections[pickerEx.id]||null}
        onSelect={(altId)=>{
          const key=pickerEx.id;
          handleAltSelect(key,altId);
          setPickerEx(null);setPickerSide(null);
        }}
        onClose={()=>{setPickerEx(null);setPickerSide(null);}}/>
    )}

    {/* ── REPLACE EXERCISE OVERLAY ── */}
    {replaceEx&&(
      <ReplacePicker original={replaceEx}
        onSelect={(replacement)=>handleReplaceSelect(replaceEx.id,replacement)}
        onClose={()=>setReplaceEx(null)}/>
    )}

    {/* ── POST-WORKOUT SUMMARY ── */}
    {showSummary&&(
      <PostWorkoutSummary
        session={session} week={week} sessionLog={sessionLog} phase={phase}
        substitutions={substitutions} customPrimary={customPrimary} condV2={condV2} condV2Done={condV2Done}
        totalSessionsCompleted={milestones.totalSessions||0}
        onDismiss={()=>setShowSummary(false)}/>
    )}

    {/* ── EDIT EXERCISE LABEL ── */}
    {editNameFor&&(
      <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.85)",zIndex:400,display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}}>
        <div className="slideUp" style={{background:C.surface,border:`2px solid ${C.cyan}`,borderRadius:"16px",padding:"24px",width:"100%",maxWidth:"400px"}}>
          <div style={{fontSize:"17px",fontWeight:"bold",color:C.white,marginBottom:"4px"}}>Edit Exercise Name</div>
          <div style={{fontSize:"12px",color:C.textMuted,marginBottom:"16px",lineHeight:1.5}}>Rename this to match your gym's equipment. It replaces the displayed name across all weeks. The original stays as a small "originally:" note so you never lose the reference.</div>
          <input autoFocus type="text" value={editNameVal} onChange={e=>setEditNameVal(e.target.value)}
            placeholder="e.g. Hammer Iso Row — corner by mirrors"
            style={{width:"100%",padding:"12px",marginBottom:"16px",fontSize:"15px"}}/>
          <div style={{display:"flex",gap:"10px"}}>
            <button onClick={()=>{setEditNameFor(null);setEditNameVal("");}} style={{flex:1,padding:"13px",background:"transparent",border:`1.5px solid ${C.borderMid}`,borderRadius:"8px",color:C.textMid,fontSize:"12px",fontWeight:"bold",letterSpacing:"1px",textTransform:"uppercase"}}>Cancel</button>
            {customNames[editNameFor]&&(
              <button onClick={()=>{setCustomName(editNameFor,"");setEditNameFor(null);setEditNameVal("");}} style={{flex:1,padding:"13px",background:"transparent",border:`1.5px solid ${C.redBorder}`,borderRadius:"8px",color:C.red,fontSize:"12px",fontWeight:"bold",letterSpacing:"1px",textTransform:"uppercase"}}>Remove</button>
            )}
            <button onClick={()=>{setCustomName(editNameFor,editNameVal);setEditNameFor(null);setEditNameVal("");}} style={{flex:1,padding:"13px",background:C.cyan,border:"none",borderRadius:"8px",color:C.bg,fontSize:"12px",fontWeight:"bold",letterSpacing:"1px",textTransform:"uppercase"}}>Save</button>
          </div>
        </div>
      </div>
    )}

    {/* ── RESET PROGRESS CONFIRMATION ── */}
    {showResetConfirm&&(
      <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.85)",zIndex:400,display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}}>
        <div className="slideUp" style={{background:C.surface,border:`2px solid ${C.red}`,borderRadius:"16px",padding:"28px 24px",width:"100%",maxWidth:"400px"}}>
          <div style={{textAlign:"center",marginBottom:"16px"}}>
            <div style={{fontSize:"36px",marginBottom:"8px"}}>⚠️</div>
            <div style={{fontSize:"18px",fontWeight:"bold",color:C.white,marginBottom:"4px"}}>Reset Progress?</div>
            <div style={{fontSize:"11px",letterSpacing:"2px",color:C.red,textTransform:"uppercase",fontWeight:"bold"}}>This cannot be undone</div>
          </div>
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"10px",padding:"16px",marginBottom:"20px"}}>
            <div style={{fontSize:"11px",letterSpacing:"1px",color:C.red,textTransform:"uppercase",fontWeight:"bold",marginBottom:"8px"}}>Will be cleared</div>
            <div style={{fontSize:"13px",color:C.textMid,lineHeight:1.7,marginBottom:"14px"}}>Session completion marks · session counter · conditioning completion · returns you to Week 1</div>
            <div style={{fontSize:"11px",letterSpacing:"1px",color:C.green,textTransform:"uppercase",fontWeight:"bold",marginBottom:"8px"}}>Will be kept</div>
            <div style={{fontSize:"13px",color:C.textMid,lineHeight:1.7}}>All logged weights, reps &amp; sets · body composition · cardio log · readiness history · your exercise swaps. Your working weights stay visible as "Last:" references.</div>
          </div>
          <div style={{display:"flex",gap:"10px"}}>
            <button onClick={()=>setShowResetConfirm(false)} style={{flex:1,padding:"14px",background:"transparent",border:`1.5px solid ${C.borderMid}`,borderRadius:"8px",color:C.textMid,fontSize:"13px",fontWeight:"bold",letterSpacing:"1px",textTransform:"uppercase"}}>Cancel</button>
            <button onClick={resetProgress} style={{flex:1,padding:"14px",background:C.red,border:"none",borderRadius:"8px",color:"#fff",fontSize:"13px",fontWeight:"bold",letterSpacing:"1px",textTransform:"uppercase"}}>Yes, Reset</button>
          </div>
        </div>
      </div>
    )}
    </>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
