// ── PHASE ─────────────────────────────────────────────────────────
function getPhase(w) {
  if (w <= 2) return { name:"CALIBRATION",   rir:"3–4 RIR", color:"#4A7C60", colorBg:"#EBF5F0", weeks:"1–2", note:"Movement quality over load. Find baseline weights. No intensity techniques." };
  if (w <= 4) return { name:"LOADING",        rir:"2–3 RIR", color:"#8B6914", colorBg:"#FBF4E6", weeks:"3–4", note:"True working weights established. Still no intensity techniques." };
  if (w <= 7) return { name:"PROGRESSIVE OVERLOAD", rir:"1–2 RIR", color:"#3A5A8A", colorBg:"#EBF0F8", weeks:"5–7", note:"Double progression in full effect. Add weight when earned." };
  if (w <= 9) return { name:"INTENSIFICATION", rir:"0–1 RIR isolation / 1 RIR compounds", color:"#8A3A3A", colorBg:"#F8EBEB", weeks:"8–9", note:"Intensity techniques on isolation and machine work ONLY." };
  return { name:"DELOAD", rir:"3–4 RIR", color:"#666", colorBg:"#F0EFED", weeks:"10", note:"Volume cut 40–50%. Load at 60–70% of working weight. Recover fully." };
}

// ── READINESS ─────────────────────────────────────────────────────
function scoreReadiness(i) {
  let s = 0;
  s += i.bodyBattery >= 70 ? 4 : i.bodyBattery >= 50 ? 3 : i.bodyBattery >= 30 ? 2 : 1;
  s += i.sleepScore >= 76 ? 4 : i.sleepScore >= 60 ? 3 : i.sleepScore >= 45 ? 2 : 1;
  s += ({favorable:4,balanced:3,unbalanced:2,poor:1})[i.hrv] || 2;
  s += i.restingHR === "at" ? 4 : i.restingHR === "1-3" ? 3 : i.restingHR === "4-6" ? 2 : 1;
  s += i.soreness <= 2 ? 4 : i.soreness <= 4 ? 3 : i.soreness <= 6 ? 2 : 1;
  s += i.motivation >= 8 ? 4 : i.motivation >= 6 ? 3 : i.motivation >= 4 ? 2 : 1;
  return s;
}
function getTier(score) {
  if (score >= 20) return { tier:"GREEN",  label:"PUSH",         color:"#4A7C60", bg:"#EBF5F0", note:"Train exactly as programmed. Don't waste a green day." };
  if (score >= 15) return { tier:"YELLOW", label:"TRAIN NORMAL", color:"#8B6914", bg:"#FBF4E6", note:"Add 1 RIR to all sets. No intensity techniques. Skip Friday conditioning finisher." };
  if (score >= 10) return { tier:"ORANGE", label:"REDUCE",       color:"#B85C00", bg:"#FDF3EA", note:"Cut one set per exercise. Add 1–2 RIR. Skip conditioning finisher. Three Orange days in 7 = immediate deload." };
  return { tier:"RED", label:"REST", color:"#C0392B", bg:"#FDF2F1", note:"Do not train. Zone 2 only — 20–30 min easy walk or bike." };
}

// ── PROGRESSION ───────────────────────────────────────────────────
function parseRange(r) {
  const m = r.match(/(\d+)[–\-](\d+)/);
  return m ? { min:parseInt(m[1]), max:parseInt(m[2]) } : { min:0, max:0 };
}
function checkProgression(log, repRange) {
  const completed = (log||[]).filter(s => s && s.reps && s.weight);
  if (!completed.length) return false;
  const { max } = parseRange(repRange);
  return completed.every(s => parseInt(s.reps) >= max) && parseInt(completed[completed.length-1].rir||0) >= 1;
}

// ── WARM-UP SET CALCULATOR ────────────────────────────────────────
// Nippard system: Set 1 @ 45%, Set 2 @ 65%, Set 3 @ 85% of working weight
// For 2-set feeder exercises: Set 1 @ 50%, Set 2 @ 70%
function calcWarmupSets(workingWeight, feederCount) {
  const w = parseFloat(workingWeight);
  if (!w || isNaN(w) || w <= 0) return null;
  if (feederCount === 3) {
    return [
      { pct: 45, weight: Math.round(w * 0.45 / 5) * 5, reps: "6–10" },
      { pct: 65, weight: Math.round(w * 0.65 / 5) * 5, reps: "4–6"  },
      { pct: 85, weight: Math.round(w * 0.85 / 5) * 5, reps: "3–4"  },
    ];
  }
  if (feederCount === 2) {
    return [
      { pct: 50, weight: Math.round(w * 0.50 / 5) * 5, reps: "6–10" },
      { pct: 70, weight: Math.round(w * 0.70 / 5) * 5, reps: "4–6"  },
    ];
  }
  if (feederCount === 1) {
    return [
      { pct: 60, weight: Math.round(w * 0.60 / 5) * 5, reps: "6–10" },
    ];
  }
  return null;
}

function feederCount(feeders) {
  if (!feeders) return 0;
  if (feeders.includes("3 Sets") || feeders.includes("3 Warm")) return 3;
  if (feeders.includes("2 Sets") || feeders.includes("2 Warm")) return 2;
  if (feeders.includes("1 Set")  || feeders.includes("1 Warm")) return 1;
  return 0;
}

const DAY_ORDER = ["MON","TUE","WED","THU","FRI","SUN"];

const TIER_COLORS = {
  "PRIMARY COMPOUND":"#8B6914","SECONDARY COMPOUND":"#5A3A8A","MANDATORY":"#C0392B",
  "ISOLATION":"#3A5A8A","POSTERIOR CHAIN":"#4A7C60","CONDITIONAL — MONITOR CLOSELY":"#B85C00",
  "SUPERSET — BICEPS":"#3A7A8A","SUPERSET — CORE":"#3A7A8A","SUPERSET — TRICEPS":"#3A7A8A",
  "ZONE 2 SESSION":"#555","OPTIONAL":"#888",
};

// ── WARM-UP SETS PANEL ────────────────────────────────────────────
function WarmupCalc({ feeders, sessionColor }) {
  const [working, setWorking] = useState("");
  const count = feederCount(feeders);
  if (count === 0) return null;
  const sets = calcWarmupSets(working, count);

  return (
    <div style={{background:"#FAFAF8",border:`1px solid #DDD9D1`,borderLeft:`3px solid ${sessionColor}`,borderRadius:"3px",padding:"12px 14px",marginBottom:"12px"}}>
      <div style={{fontSize:"8px",letterSpacing:"2px",color:sessionColor,textTransform:"uppercase",marginBottom:"8px",fontWeight:"bold"}}>
        Nippard Warm-Up Sets
      </div>
      <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"10px"}}>
        <input
          type="number"
          placeholder="Working weight (lbs)"
          value={working}
          onChange={e => setWorking(e.target.value)}
          style={{flex:1,background:"#fff",border:"1px solid #D0CCC4",borderRadius:"3px",padding:"8px 10px",color:"#1A1A1A",fontSize:"13px",fontFamily:"Georgia,serif",textAlign:"left"}}
        />
      </div>
      {sets ? (
        <div>
          {sets.map((s,i) => (
            <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:i<sets.length-1?`1px solid #ECEAE5`:"none"}}>
              <div style={{fontSize:"11px",color:T.textMuted,letterSpacing:"1px",textTransform:"uppercase"}}>Set {i+1} — {s.pct}%</div>
              <div style={{display:"flex",gap:"16px",alignItems:"center"}}>
                <div style={{fontSize:"16px",fontWeight:"bold",color:"#1A1A1A"}}>{s.weight} <span style={{fontSize:"11px",color:T.textMuted,fontWeight:"normal"}}>lbs</span></div>
                <div style={{fontSize:"12px",color:T.textMuted}}>{s.reps} reps</div>
              </div>
            </div>
          ))}
          <div style={{fontSize:"10px",color:T.textFaint,marginTop:"8px",fontStyle:"italic"}}>Rounded to nearest 5 lbs. Adjust to available plates.</div>
        </div>
      ) : (
        <div style={{fontSize:"12px",color:T.textFaint,fontStyle:"italic"}}>Enter your working weight above to calculate warm-up sets.</div>
      )}
    </div>
  );
}

// ── EXERCISE ROW ──────────────────────────────────────────────────
function ExerciseRow({ ex, session, week, log, onLog }) {
  const [expanded, setExpanded] = useState(false);
  const [logging, setLogging] = useState(false);
  const tierColor = TIER_COLORS[ex.tier] || T.textFaint;
  const numSets = typeof ex.sets === "number" ? ex.sets : 3;
  const completed = (log||[]).filter(s => s && s.weight && s.reps);
  const progression = checkProgression(log, ex.repRange);
  const hasFeeders = feederCount(ex.feeders) > 0;

  return (
    <div style={{borderBottom:`1px solid ${T.border}`}}>
      <div onClick={() => {setExpanded(!expanded);setLogging(false);}} style={{padding:"15px 0",cursor:"pointer",display:"flex",gap:"12px",alignItems:"flex-start"}}>
        <div style={{fontSize:"10px",color:T.textFaint,fontWeight:"bold",minWidth:"22px",paddingTop:"2px"}}>{ex.number}</div>
        <div style={{flex:1}}>
          <div style={{fontSize:"8px",letterSpacing:"2px",color:tierColor,textTransform:"uppercase",marginBottom:"4px",fontWeight:"bold"}}>{ex.tier}</div>
          <div style={{display:"flex",alignItems:"center",gap:"6px",flexWrap:"wrap",marginBottom:"5px"}}>
            <div style={{fontSize:"15px",fontWeight:"bold",color:T.text,lineHeight:1.2}}>{ex.name}</div>
            {ex.preferred && <span style={{fontSize:"7px",letterSpacing:"1px",color:"#fff",background:session.color,padding:"2px 6px",borderRadius:"2px",fontWeight:"bold",textTransform:"uppercase"}}>{ex.preferred ? "PREFERRED" : ""}</span>}
            {progression && <span style={{fontSize:"7px",letterSpacing:"1px",color:"#fff",background:"#4A7C60",padding:"2px 6px",borderRadius:"2px",fontWeight:"bold",textTransform:"uppercase"}}>↑ ADD WEIGHT</span>}
          </div>
          <div style={{fontSize:"12px",color:T.textMuted}}>{ex.sets} sets · {ex.repRange} · Rest: {ex.rest}</div>
          {ex.alt && <div style={{fontSize:"11px",color:T.textFaint,marginTop:"3px",fontStyle:"italic"}}>Alt: {ex.alt}</div>}
          {completed.length > 0 && (
            <div style={{marginTop:"5px",display:"flex",gap:"4px",flexWrap:"wrap"}}>
              {completed.map((s,si) => (
                <span key={si} style={{fontSize:"9px",color:"#4A7C60",background:"#EBF5F0",border:"1px solid #C0DDD0",borderRadius:"2px",padding:"2px 6px"}}>
                  {s.weight}lb×{s.reps}
                </span>
              ))}
            </div>
          )}
        </div>
        <div style={{fontSize:"16px",color:T.textFaint,transition:"transform 0.15s",transform:expanded?"rotate(45deg)":"none",paddingTop:"2px"}}>+</div>
      </div>

      {expanded && (
        <div style={{paddingBottom:"16px",paddingLeft:"34px"}} onClick={e => e.stopPropagation()}>

          {/* Warm-up calc for exercises with feeders */}
          {hasFeeders && <WarmupCalc feeders={ex.feeders} sessionColor={session.color}/>}

          <div style={{fontSize:"13px",color:T.textMid,lineHeight:1.75,marginBottom:"10px"}}>{ex.notes}</div>

          {ex.spineFlag && (
            <div style={{background:T.redBg,border:`1px solid ${T.redBorder}`,borderLeft:"3px solid #C0392B",borderRadius:"3px",padding:"9px 12px",marginBottom:"10px"}}>
              <div style={{fontSize:"8px",letterSpacing:"2px",color:T.red,textTransform:"uppercase",marginBottom:"3px",fontWeight:"bold"}}>Spine Flag</div>
              <div style={{fontSize:"12px",color:"#8A2A2A",lineHeight:1.5}}>{ex.spineFlag}</div>
            </div>
          )}

          {typeof ex.sets === "number" && ex.tier !== "SUPERSET — CORE" && (
            <>
              <button onClick={() => setLogging(!logging)} style={{
                background:logging?session.color:"transparent",
                border:`1px solid ${logging?session.color:T.borderMid}`,
                borderRadius:"3px",padding:"8px 16px",
                color:logging?"#fff":T.textMuted,
                fontSize:"9px",letterSpacing:"2px",textTransform:"uppercase",
                marginBottom:logging?"12px":"0",fontWeight:"bold",
              }}>
                {logging ? "CLOSE LOG" : "LOG SETS"}
              </button>

              {logging && (
                <div style={{marginTop:"12px"}}>
                  <div style={{display:"flex",gap:"6px",marginBottom:"8px"}}>
                    <div style={{fontSize:"9px",color:T.textFaint,width:"44px"}}></div>
                    {["LBS","REPS","RIR"].map(l => (
                      <div key={l} style={{flex:1,fontSize:"9px",color:T.textFaint,textAlign:"center",letterSpacing:"1px",textTransform:"uppercase"}}>{l}</div>
                    ))}
                  </div>
                  {[...Array(numSets)].map((_,si) => {
                    const sd = (log||[])[si] || {};
                    return (
                      <div key={si} style={{display:"flex",gap:"6px",alignItems:"center",marginBottom:"7px"}}>
                        <div style={{fontSize:"10px",color:T.textMuted,width:"44px"}}>Set {si+1}</div>
                        <input type="number" placeholder="0" value={sd.weight||""} onChange={e => onLog(si,"weight",e.target.value)} style={{flex:1}}/>
                        <input type="number" placeholder="0" value={sd.reps||""} onChange={e => onLog(si,"reps",e.target.value)} style={{flex:1}}/>
                        <input type="number" placeholder="0" value={sd.rir||""} onChange={e => onLog(si,"rir",e.target.value)} style={{flex:1,color:sd.rir!==undefined && parseInt(sd.rir)<=1?"#8B6914":"#1A1A1A"}}/>
                      </div>
                    );
                  })}
                  {progression && (
                    <div style={{background:"#EBF5F0",border:"1px solid #C0DDD0",borderLeft:"3px solid #4A7C60",borderRadius:"3px",padding:"9px 12px",marginTop:"8px"}}>
                      <div style={{fontSize:"8px",letterSpacing:"2px",color:"#4A7C60",textTransform:"uppercase",marginBottom:"3px",fontWeight:"bold"}}>Double Progression</div>
                      <div style={{fontSize:"12px",color:"#2A5A40",lineHeight:1.4}}>All sets at top of range with RIR ≥ 1. Add weight next session.</div>
                    </div>
                  )}
                </div>
              )}
            </>
          )}
        </div>
      )}
    </div>
  );
}

// ── EXPAND CARD ───────────────────────────────────────────────────
function ExpandCard({ label, sublabel, influence, color, colorBg, children }) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{marginBottom:"10px"}}>
      <div onClick={() => setOpen(!open)} style={{
        background:open?colorBg:"#fff",
        border:`1px solid ${open?color:T.border}`,
        borderRadius:"3px",padding:"13px 14px",cursor:"pointer",
        display:"flex",justifyContent:"space-between",alignItems:"center",
      }}>
        <div>
          <div style={{fontSize:"8px",letterSpacing:"3px",color:open?color:T.textFaint,textTransform:"uppercase",marginBottom:"3px",fontWeight:"bold"}}>{label}</div>
          <div style={{fontSize:"14px",fontWeight:"bold",color:T.text}}>{sublabel}</div>
          {influence && <div style={{fontSize:"9px",color:T.textFaint,marginTop:"2px",fontStyle:"italic"}}>{influence}</div>}
        </div>
        <div style={{fontSize:"16px",color:open?color:T.textFaint,transition:"transform 0.15s",transform:open?"rotate(45deg)":"none"}}>+</div>
      </div>
      {open && (
        <div style={{background:"#fff",border:`1px solid ${T.border}`,borderTop:"none",borderRadius:"0 0 3px 3px",padding:"14px"}}>
          {children}
        </div>
      )}
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────
function App() {
  const [view, setView]         = useState("session");
  const [activeDay, setActiveDay] = useState("MON");
  const [week, setWeek]         = useState(() => LS.get("block1_week") || 1);
  const [sessionLog, setSessionLog] = useState(() => LS.get("block1_log") || {});
  const [readinessLog, setReadinessLog] = useState(() => LS.get("block1_readiness") || {});
  const [ri, setRi] = useState({bodyBattery:70,sleepScore:75,hrv:"favorable",restingHR:"at",soreness:2,motivation:8});
  const [todayScore, setTodayScore] = useState(null);

  const phase   = getPhase(week);
  const session = SESSIONS[activeDay];
  const today   = new Date().toDateString();

  function handleWeekChange(w) { setWeek(w); LS.set("block1_week", w); }

  function getLog(exId) { return sessionLog[`${exId}_w${week}`] || []; }

  function handleLog(exId, si, field, val) {
    const key  = `${exId}_w${week}`;
    const curr = sessionLog[key] || [];
    const upd  = [...curr];
    if (!upd[si]) upd[si] = {};
    upd[si][field] = val;
    const newLog = {...sessionLog, [key]: upd};
    setSessionLog(newLog);
    LS.set("block1_log", newLog);
  }

  function handleReadiness() {
    const score = scoreReadiness(ri);
    const entry = { score, tier: getTier(score).tier, date: today };
    const newLog = {...readinessLog, [today]: entry};
    setReadinessLog(newLog);
    setTodayScore(score);
    LS.set("block1_readiness", newLog);
  }

  return (
    <div style={{minHeight:"100vh",background:T.bg,color:T.text,fontFamily:"Georgia,'Times New Roman',serif",paddingBottom:"80px"}}>

      {/* ── TOP NAV ── */}
      <div style={{background:T.bgHeader,borderBottom:`1px solid ${T.border}`,padding:"18px 18px 0",position:"sticky",top:0,zIndex:20}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"12px"}}>
          <div>
            <div style={{fontSize:"8px",letterSpacing:"4px",color:T.textFaint,textTransform:"uppercase",marginBottom:"3px"}}>AmFam Swift Creek</div>
            <div style={{fontSize:"15px",fontWeight:"bold",letterSpacing:"1px",color:T.text,textTransform:"uppercase"}}>Block 1 — Hypertrophy</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:"5px"}}>
            <div style={{fontSize:"8px",color:T.textFaint,letterSpacing:"2px",textTransform:"uppercase"}}>WEEK</div>
            <div style={{display:"flex",gap:"3px"}}>
              {[...Array(10)].map((_,i) => (
                <div key={i} onClick={() => handleWeekChange(i+1)} style={{
                  width:"18px",height:"18px",borderRadius:"2px",display:"flex",alignItems:"center",justifyContent:"center",
                  background:week===i+1?phase.color:T.bgCard,
                  border:`1px solid ${week===i+1?phase.color:T.border}`,
                  color:week===i+1?"#fff":T.textFaint,
                  fontSize:"9px",fontWeight:"bold",cursor:"pointer",
                }}>{i+1}</div>
              ))}
            </div>
          </div>
        </div>

        {/* Phase badge */}
        <div style={{background:phase.colorBg,border:`1px solid ${phase.color}55`,borderLeft:`3px solid ${phase.color}`,borderRadius:"3px",padding:"8px 12px",marginBottom:"12px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div>
              <div style={{fontSize:"8px",letterSpacing:"2px",color:phase.color,textTransform:"uppercase",fontWeight:"bold"}}>{phase.name} — WKS {phase.weeks}</div>
              <div style={{fontSize:"12px",color:T.textMid,marginTop:"2px"}}>{phase.rir}</div>
            </div>
            <div style={{fontSize:"10px",color:T.textMuted,maxWidth:"160px",textAlign:"right",lineHeight:1.4}}>{phase.note}</div>
          </div>
        </div>

        {/* View tabs */}
        <div style={{display:"flex",borderBottom:`1px solid ${T.border}`}}>
          {[["session","SESSION"],["readiness","READINESS"],["tracker","TRACKER"]].map(([v,l]) => (
            <button key={v} onClick={() => setView(v)} style={{
              flex:1,padding:"10px 4px",background:"transparent",border:"none",
              borderBottom:`2px solid ${view===v?phase.color:"transparent"}`,
              color:view===v?phase.color:T.textMuted,
              fontSize:"9px",letterSpacing:"2px",textTransform:"uppercase",fontWeight:view===v?"bold":"normal",
            }}>{l}</button>
          ))}
        </div>
      </div>

      {/* ══ SESSION VIEW ══ */}
      {view === "session" && (
        <div>
          {/* Day tabs */}
          <div style={{padding:"12px 18px",borderBottom:`1px solid ${T.border}`,display:"flex",gap:"5px",background:T.bgCard}}>
            {DAY_ORDER.map(d => (
              <button key={d} onClick={() => setActiveDay(d)} style={{
                flex:1,padding:"8px 2px",
                background:activeDay===d?SESSIONS[d].color:"transparent",
                border:`1px solid ${activeDay===d?SESSIONS[d].color:T.border}`,
                borderRadius:"3px",
                color:activeDay===d?"#fff":T.textMuted,
                fontSize:"9px",fontWeight:activeDay===d?"bold":"normal",
                letterSpacing:"1px",textTransform:"uppercase",
              }}>{d}</button>
            ))}
          </div>

          {/* Session header */}
          <div style={{padding:"18px 18px 14px",borderBottom:`1px solid ${T.border}`,background:session.colorBg}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <div style={{fontSize:"22px",fontWeight:"bold",color:session.color,lineHeight:1.1}}>{session.focus}</div>
                <div style={{fontSize:"11px",color:T.textMuted,marginTop:"3px",fontStyle:"italic"}}>{session.subtitle}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:"9px",color:T.textMuted,letterSpacing:"2px",textTransform:"uppercase"}}>{session.recoveryDemand}</div>
                {session.sauna && <div style={{fontSize:"8px",color:"#8B6914",marginTop:"3px",letterSpacing:"1px",textTransform:"uppercase",fontWeight:"bold"}}>SAUNA ✓</div>}
              </div>
            </div>
          </div>

          {/* Warm-up */}
          <div style={{padding:"14px 18px",borderBottom:`1px solid ${T.border}`,background:T.bgCard}}>
            <div style={{fontSize:"8px",letterSpacing:"3px",color:T.textFaint,textTransform:"uppercase",marginBottom:"9px",fontWeight:"bold"}}>Warm-Up</div>
            {session.warmup.map((item,i) => (
              <div key={i} style={{fontSize:"12px",color:T.textMid,padding:"4px 0",borderBottom:i<session.warmup.length-1?`1px solid ${T.bgCardAlt}`:"none",lineHeight:1.4}}>{item}</div>
            ))}
          </div>

          {/* Exercises */}
          <div style={{padding:"0 18px",background:T.bgCard}}>
            {session.exercises.map((ex) => (
              <ExerciseRow key={ex.id} ex={ex} session={session} week={week}
                log={getLog(ex.id)} onLog={(si,field,val) => handleLog(ex.id,si,field,val)}/>
            ))}
          </div>

          {/* Cooldown + cards */}
          <div style={{padding:"14px 18px 0",background:T.bgCard}}>
            <div style={{background:T.bgCardAlt,border:`1px solid ${T.border}`,borderRadius:"3px",padding:"12px 14px",marginBottom:"10px"}}>
              <div style={{fontSize:"8px",letterSpacing:"3px",color:T.textFaint,textTransform:"uppercase",marginBottom:"6px",fontWeight:"bold"}}>Cooldown</div>
              <div style={{fontSize:"12px",color:T.textMid,lineHeight:1.6}}>{session.cooldown}</div>
            </div>

            {session.finisher && (
              <ExpandCard label={`Optional Finisher — ${session.finisher.duration}`} sublabel={session.finisher.name} influence={session.finisher.influence} color={session.color} colorBg={session.colorBg}>
                <div style={{background:session.colorBg,border:`1px solid ${session.color}44`,borderLeft:`3px solid ${session.color}`,borderRadius:"3px",padding:"9px 12px",marginBottom:"11px"}}>
                  <div style={{fontSize:"8px",letterSpacing:"2px",color:session.color,textTransform:"uppercase",marginBottom:"4px",fontWeight:"bold"}}>Protocol</div>
                  <div style={{fontSize:"12px",color:T.textMid,lineHeight:1.5}}>{session.finisher.protocol}</div>
                </div>
                <div style={{fontSize:"12px",color:T.textMid,lineHeight:1.7}}>{session.finisher.notes}</div>
              </ExpandCard>
            )}

            {session.sauna ? (
              <ExpandCard label="Dry Sauna — Post-Session" sublabel="15–20 Min" influence={session.sauna.influence} color="#8B6914" colorBg="#FBF4E6">
                <div style={{background:"#FBF4E6",border:"1px solid #E8D4A0",borderLeft:"3px solid #8B6914",borderRadius:"3px",padding:"9px 12px",marginBottom:"11px"}}>
                  <div style={{fontSize:"8px",letterSpacing:"2px",color:"#8B6914",textTransform:"uppercase",marginBottom:"4px",fontWeight:"bold"}}>Protocol</div>
                  <div style={{fontSize:"12px",color:T.textMid,lineHeight:1.5}}>{session.sauna.protocol}</div>
                </div>
                <div style={{fontSize:"12px",color:T.textMid,lineHeight:1.7}}>{session.sauna.rationale}</div>
              </ExpandCard>
            ) : (
              <div style={{background:T.bgCardAlt,border:`1px solid ${T.border}`,borderLeft:`3px solid ${T.borderMid}`,borderRadius:"3px",padding:"12px 14px",marginBottom:"10px"}}>
                <div style={{fontSize:"8px",letterSpacing:"3px",color:T.textFaint,textTransform:"uppercase",marginBottom:"5px",fontWeight:"bold"}}>Sauna — Not Today</div>
                <div style={{fontSize:"11px",color:T.textMuted,lineHeight:1.6}}>{session.saunaNote}</div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* ══ READINESS VIEW ══ */}
      {view === "readiness" && (
        <div style={{padding:"20px 18px"}}>
          <div style={{fontSize:"9px",letterSpacing:"3px",color:T.textFaint,textTransform:"uppercase",marginBottom:"18px",fontWeight:"bold"}}>Daily Readiness Check</div>

          {todayScore !== null && (() => {
            const t = getTier(todayScore);
            return (
              <div style={{background:t.bg,border:`1px solid ${t.color}55`,borderLeft:`4px solid ${t.color}`,borderRadius:"4px",padding:"16px",marginBottom:"22px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div>
                    <div style={{fontSize:"20px",fontWeight:"bold",color:t.color}}>{t.tier}</div>
                    <div style={{fontSize:"12px",color:T.textMid,marginTop:"2px"}}>{t.label}</div>
                  </div>
                  <div style={{fontSize:"26px",fontWeight:"bold",color:t.color}}>{todayScore}<span style={{fontSize:"12px",color:T.textMuted}}>/24</span></div>
                </div>
                <div style={{fontSize:"12px",color:T.textMid,marginTop:"10px",lineHeight:1.6}}>{t.note}</div>
              </div>
            );
          })()}

          {[
            {key:"bodyBattery",label:"Body Battery",type:"slider",min:0,max:100},
            {key:"sleepScore",label:"Sleep Score",type:"slider",min:0,max:100},
            {key:"hrv",label:"HRV Status",type:"select",options:[["favorable","Favorable"],["balanced","Balanced"],["unbalanced","Unbalanced"],["poor","Poor"]]},
            {key:"restingHR",label:"Resting HR vs 30-Day Avg",type:"select",options:[["at","At or below"],["1-3","1–3 bpm above"],["4-6","4–6 bpm above"],["7+","7+ bpm above"]]},
            {key:"soreness",label:"Soreness / Pain (0–10)",type:"slider",min:0,max:10},
            {key:"motivation",label:"Motivation (0–10)",type:"slider",min:0,max:10},
          ].map(f => (
            <div key={f.key} style={{marginBottom:"18px"}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:"8px"}}>
                <div style={{fontSize:"11px",letterSpacing:"1px",color:T.textMid,textTransform:"uppercase",fontWeight:"bold"}}>{f.label}</div>
                {f.type==="slider" && <div style={{fontSize:"14px",color:phase.color,fontWeight:"bold"}}>{ri[f.key]}</div>}
              </div>
              {f.type==="slider" ? (
                <input type="range" min={f.min} max={f.max} value={ri[f.key]} onChange={e => setRi(p => ({...p,[f.key]:parseInt(e.target.value)}))}/>
              ) : (
                <div style={{display:"flex",gap:"5px",flexWrap:"wrap"}}>
                  {f.options.map(([val,lbl]) => (
                    <button key={val} onClick={() => setRi(p => ({...p,[f.key]:val}))} style={{
                      flex:1,padding:"9px 4px",
                      background:ri[f.key]===val?phase.color:T.bgCard,
                      border:`1px solid ${ri[f.key]===val?phase.color:T.border}`,
                      borderRadius:"3px",
                      color:ri[f.key]===val?"#fff":T.textMuted,
                      fontSize:"10px",fontWeight:ri[f.key]===val?"bold":"normal",
                    }}>{lbl}</button>
                  ))}
                </div>
              )}
            </div>
          ))}

          <button onClick={handleReadiness} style={{
            width:"100%",padding:"14px",background:phase.color,border:"none",borderRadius:"4px",
            color:"#fff",fontSize:"11px",fontWeight:"bold",letterSpacing:"2px",textTransform:"uppercase",
            marginBottom:"24px",
          }}>CALCULATE READINESS</button>

          {Object.keys(readinessLog).length > 0 && (
            <div>
              <div style={{fontSize:"9px",letterSpacing:"3px",color:T.textFaint,textTransform:"uppercase",marginBottom:"12px",fontWeight:"bold"}}>Recent History</div>
              {Object.entries(readinessLog).slice(-5).reverse().map(([date,entry]) => {
                const t = getTier(entry.score);
                return (
                  <div key={date} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:`1px solid ${T.border}`}}>
                    <div style={{fontSize:"11px",color:T.textMuted}}>{date}</div>
                    <div style={{display:"flex",gap:"12px",alignItems:"center"}}>
                      <div style={{fontSize:"9px",color:t.color,letterSpacing:"1px",fontWeight:"bold"}}>{entry.tier}</div>
                      <div style={{fontSize:"14px",color:t.color,fontWeight:"bold"}}>{entry.score}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* ══ TRACKER VIEW ══ */}
      {view === "tracker" && (
        <div style={{padding:"20px 18px"}}>
          <div style={{fontSize:"9px",letterSpacing:"3px",color:T.textFaint,textTransform:"uppercase",marginBottom:"18px",fontWeight:"bold"}}>Progressive Overload — Week {week}</div>
          {DAY_ORDER.filter(d => d !== "SUN").map(d => {
            const s = SESSIONS[d];
            return (
              <div key={d} style={{marginBottom:"22px"}}>
                <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"8px",paddingBottom:"6px",borderBottom:`2px solid ${s.color}44`}}>
                  <div style={{fontSize:"8px",letterSpacing:"3px",color:s.color,textTransform:"uppercase",fontWeight:"bold"}}>{s.fullDay}</div>
                  <div style={{fontSize:"10px",color:T.textFaint}}>{s.focus}</div>
                </div>
                {s.exercises.filter(ex => typeof ex.sets === "number" && ex.tier !== "SUPERSET — CORE").map(ex => {
                  const log = getLog(ex.id);
                  const completed = (log||[]).filter(s => s && s.weight && s.reps);
                  const progression = checkProgression(log, ex.repRange);
                  const { max } = parseRange(ex.repRange);
                  return (
                    <div key={ex.id} style={{marginBottom:"10px",background:T.bgCard,border:`1px solid ${T.border}`,borderRadius:"3px",padding:"11px 13px"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"5px"}}>
                        <div style={{fontSize:"13px",fontWeight:"bold",color:T.text,maxWidth:"210px",lineHeight:1.3}}>{ex.name}</div>
                        {progression && <span style={{fontSize:"7px",letterSpacing:"1px",background:"#4A7C60",color:"#fff",padding:"2px 6px",borderRadius:"2px",fontWeight:"bold",whiteSpace:"nowrap"}}>↑ ADD WEIGHT</span>}
                      </div>
                      <div style={{fontSize:"11px",color:T.textMuted,marginBottom:"7px"}}>{ex.sets} × {ex.repRange}</div>
                      {completed.length > 0 ? (
                        <div style={{display:"flex",gap:"4px",flexWrap:"wrap"}}>
                          {completed.map((set,si) => (
                            <div key={si} style={{
                              background:parseInt(set.reps)>=max?"#EBF5F0":T.bgCardAlt,
                              border:`1px solid ${parseInt(set.reps)>=max?"#C0DDD0":T.border}`,
                              borderRadius:"2px",padding:"3px 8px",
                              fontSize:"11px",color:parseInt(set.reps)>=max?"#4A7C60":T.textMid,
                            }}>
                              {set.weight}lb×{set.reps} <span style={{color:T.textFaint}}>@{set.rir}RIR</span>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <div style={{fontSize:"11px",color:T.textFaint,fontStyle:"italic"}}>Not logged this week</div>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
