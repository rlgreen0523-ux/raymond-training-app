const PHASES = [

  {label:"Phase 4",weeks:"Weeks 7–8",focus:"Deload",     rpe:"5–6",sets:3,reps:"10–12",rir:"3–4 RIR",restNote:"As needed", note:"60% load. Full recovery. Mandatory.",                 type:"deload"},

function getPhaseIdxFromWeek(w){return Math.floor(((w-1)%8)/2);}
function getPhase(w){
  const idx=getPhaseIdxFromWeek(w);const p=PHASES[idx];const cycleNum=Math.ceil(w/8);
  const colors=[[C.gold,C.goldLight,C.goldBorder],["#FF6B6B","rgba(255,107,107,0.12)","rgba(255,107,107,0.35)"],[C.cyan,C.cyanLight,C.cyanBorder],[C.green,C.greenLight,C.greenBorder]];
  return{...p,cycleNum,color:colors[idx][0],colorBg:colors[idx][1],colorBorder:colors[idx][2]};
}

// ── READINESS ────────────────────────────────────────────────────
function scoreReadiness(i){
  const bb=parseFloat((i.bodyBattery/10).toFixed(1));
  const ss=parseFloat((i.sleepScore/10).toFixed(1));
  const tr=parseFloat((i.trainingReadiness/10).toFixed(1));
  const hrv=({balanced:10,favorable:7,unbalanced:4,poor:1})[i.hrv]||5;
  const hr=({at:10,"1-3":7,"4-6":4,"7+":1})[i.restingHR]||5;
  const sor=parseFloat((10-i.soreness).toFixed(1));
  const mot=parseFloat(i.motivation.toFixed(1));
  return parseFloat((bb+ss+tr+hrv+hr+sor+mot).toFixed(1));
}
function getTier(s){
  if(s>=56)return{tier:"GREEN", label:"PUSH",      color:C.green, bg:C.greenLight,note:"Train as programmed. Don't waste a green day."};
  if(s>=42)return{tier:"YELLOW",label:"MODIFIED",  color:C.gold,  bg:C.goldLight, note:"Add 1 RIR all sets. No intensity techniques."};
  if(s>=28)return{tier:"ORANGE",label:"REDUCE",    color:C.orange,bg:"rgba(255,140,66,0.12)",note:"Cut one set. Add 1–2 RIR. Skip conditioning."};
  return      {tier:"RED",   label:"REST ONLY", color:C.red,   bg:C.redLight,  note:"Zone 2 only. Do not train."};
}

// ── PROGRESSION ──────────────────────────────────────────────────
function parseRange(r){const m=r?r.match(/(\d+)[–\-](\d+)/):null;return m?{min:parseInt(m[1]),max:parseInt(m[2])}:{min:0,max:0};}
function checkProgression(log,repRange){
  const done=(log||[]).filter(s=>s&&s.reps&&s.weight);
  if(!done.length)return false;
  const{max}=parseRange(repRange);
  return done.every(s=>parseInt(s.reps)>=max)&&parseInt(done[done.length-1].rir||0)>=1;
}

// ── WARM-UP CALC ─────────────────────────────────────────────────
function feederCount(f){if(!f)return 0;if(f.includes("3"))return 3;if(f.includes("2"))return 2;if(f.includes("1"))return 1;return 0;}
function calcWarmup(w,count){
  const wt=parseFloat(w);if(!wt||isNaN(wt)||wt<=0)return null;
  const s={3:[{pct:45,reps:"6–10"},{pct:65,reps:"4–6"},{pct:85,reps:"3–4"}],2:[{pct:50,reps:"6–10"},{pct:70,reps:"4–6"}],1:[{pct:60,reps:"6–10"}]};
  return(s[count]||[]).map(x=>({...x,weight:Math.round(wt*x.pct/100/5)*5}));
}

function getPhaseRepRange(ex,phase){if(ex&&ex.reps)return ex.reps;return phase?phase.reps:"10–12";}
function getPhaseSets(base,phaseType,ex,phaseSets){
  if(ex&&ex.lockedSets!==undefined&&ex.lockedSets!==null)return ex.lockedSets;
  if(phaseSets!=null)return phaseSets;
  if(phaseType==="deload")return 2;
  if(phaseType==="volume")return 4;
  if(phaseType==="strength")return 5;
  return 4;
}
function parseRestSeconds(rest){
  if(!rest)return 90;
  if(rest.includes("180")||rest.includes("3 min"))return 180;
  if(rest.includes("120–180")||rest.includes("2–3"))return 150;
  if(rest.includes("120"))return 120;
  if(rest.includes("90"))return 90;
  if(rest.includes("75"))return 75;
  if(rest.includes("60–75"))return 67;
  if(rest.includes("60"))return 60;
  if(rest.includes("45"))return 45;
  if(rest.includes("30"))return 30;
  return 90;
}

// ── ESTIMATED 1RM (Epley) ────────────────────────────────────────
function calc1RM(weight,reps){
  if(!weight||!reps||reps<=0)return 0;
  if(reps===1)return weight;
  return Math.round(weight*(1+reps/30));
}

// ── BOMB DROP ────────────────────────────────────────────────────
const activeTimers={};
let globalFlashFn=null;
// ── SHARED AUDIO ─────────────────────────────────────────────────
// One AudioContext for the whole app, unlocked on first user gesture.
// New contexts per-sound fail silently on iOS; reusing one fixes that.
const TMAudio={
  ctx:null,
  init(){
    try{
      if(!this.ctx){
        const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
        this.ctx=new AC();
      }
      if(this.ctx.state==="suspended")this.ctx.resume();
      return this.ctx;
    }catch(e){return null;}
  },
  // Wake on any tap so scheduled sounds later in the rest period still fire.
  unlock(){
    const c=this.init();
    if(c&&c.state==="suspended")c.resume();
  },
};
// Global tap listener to keep audio unlocked
if(typeof document!=="undefined"){
  const _wake=()=>{TMAudio.unlock();};
  document.addEventListener("touchstart",_wake,{passive:true});
  document.addEventListener("click",_wake,{passive:true});
}

function scheduleBombDrop(restSecs){
  try{
    const ctx=TMAudio.init();if(!ctx)return;
    const t=ctx.currentTime;const ws=Math.max(0.1,restSecs-5);const ex=restSecs;
    const w=ctx.createOscillator();const wg=ctx.createGain();
    w.connect(wg);wg.connect(ctx.destination);w.type="sine";
    w.frequency.setValueAtTime(1400,t+ws);w.frequency.exponentialRampToValueAtTime(60,t+ex-0.05);
    wg.gain.setValueAtTime(0,t+ws);wg.gain.linearRampToValueAtTime(0.45,t+ws+2);wg.gain.linearRampToValueAtTime(0,t+ex);
    w.start(t+ws);w.stop(t+ex+0.1);
    const e=ctx.createOscillator();const eg=ctx.createGain();const ef=ctx.createBiquadFilter();
    e.connect(ef);ef.connect(eg);eg.connect(ctx.destination);e.type="sawtooth";ef.type="lowpass";
    ef.frequency.setValueAtTime(500,t+ex);ef.frequency.exponentialRampToValueAtTime(30,t+ex+0.7);
    e.frequency.setValueAtTime(80,t+ex);e.frequency.exponentialRampToValueAtTime(15,t+ex+0.8);
    eg.gain.setValueAtTime(0,t+ex-0.01);eg.gain.linearRampToValueAtTime(1,t+ex+0.04);eg.gain.exponentialRampToValueAtTime(0.001,t+ex+0.9);
    e.start(t+ex-0.01);e.stop(t+ex+1);
    const g=ctx.createOscillator();const gg=ctx.createGain();
    g.connect(gg);gg.connect(ctx.destination);g.type="sine";
    g.frequency.setValueAtTime(280,t+ex+0.7);g.frequency.exponentialRampToValueAtTime(1000,t+ex+1.2);
    gg.gain.setValueAtTime(0,t+ex+0.65);gg.gain.linearRampToValueAtTime(0.6,t+ex+0.75);gg.gain.exponentialRampToValueAtTime(0.001,t+ex+1.4);
    g.start(t+ex+0.65);g.stop(t+ex+1.5);
  }catch(err){}
}

// ── REST TIMER ───────────────────────────────────────────────────
function RestTimer({seconds,onDismiss}){
  const[remaining,setRemaining]=useState(seconds);
  const[done,setDone]=useState(false);
  const[dismissed,setDismissed]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    ref.current=setInterval(()=>{
      setRemaining(r=>{
        if(r<=1){clearInterval(ref.current);setDone(true);
          if(navigator.vibrate)navigator.vibrate([400,200,400,200,600]);
          if(globalFlashFn)globalFlashFn();
          setTimeout(()=>{setDismissed(true);if(onDismiss)onDismiss();},2500);
          return 0;}
        return r-1;});
    },1000);
    return()=>clearInterval(ref.current);
  },[]);
  if(dismissed)return null;
  const pct=((seconds-remaining)/seconds)*100;
  const mins=Math.floor(remaining/60);const secs=remaining%60;
  const countdown=remaining<=5&&remaining>0&&!done;
  return(
    <div style={{background:done?C.greenLight:countdown?C.goldLight:C.cyanLight,border:`1px solid ${done?C.greenBorder:countdown?C.goldBorder:C.cyanBorder}`,borderLeft:`3px solid ${done?C.green:countdown?C.gold:C.cyan}`,borderRadius:"6px",padding:"12px 14px",marginTop:"10px",transition:"opacity 0.3s"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}}>
        <div style={{fontSize:"11px",letterSpacing:"2px",color:done?C.green:countdown?C.gold:C.cyan,textTransform:"uppercase",fontWeight:"bold"}}>{done?"✓ GO — NEXT SET":countdown?"💣 INCOMING...":"REST TIMER"}</div>
        <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
          <div style={{fontSize:countdown?"32px":"22px",fontWeight:"bold",color:done?C.green:countdown?"#FF4444":C.white,fontVariantNumeric:"tabular-nums"}}>{done?"💥":countdown?remaining:`${mins}:${secs.toString().padStart(2,"0")}`}</div>
          {!done&&<button onClick={()=>{clearInterval(ref.current);setDismissed(true);if(onDismiss)onDismiss();}} style={{background:"transparent",border:"none",color:C.textFaint,fontSize:"18px",padding:"2px 6px",lineHeight:1}}>✕</button>}
        </div>
      </div>
      <div style={{background:"rgba(255,255,255,0.06)",borderRadius:"2px",height:"4px",overflow:"hidden"}}>
        <div style={{background:done?C.green:countdown?"#FF4444":C.cyan,height:"100%",width:`${pct}%`,transition:"width 1s linear",borderRadius:"2px"}}/>
      </div>
    </div>
  );
}

// ── WARMUP CALC ──────────────────────────────────────────────────
function WarmupCalc({feeders}){
  const[w,setW]=useState("");
  const count=feederCount(feeders);if(!count)return null;
  const sets=calcWarmup(w,count);
  return(
    <div style={{background:`rgba(0,212,255,0.05)`,border:`1px solid ${C.cyanBorder}`,borderLeft:`3px solid ${C.cyan}`,borderRadius:"6px",padding:"14px",marginBottom:"14px"}}>
      <div style={{fontSize:"11px",letterSpacing:"2px",color:C.cyan,textTransform:"uppercase",fontWeight:"bold",marginBottom:"10px"}}>Nippard Warm-Up Sets</div>
      <input type="number" placeholder="Working weight (lbs)" value={w} onChange={e=>setW(e.target.value)} style={{marginBottom:"10px"}}/>
      {sets?sets.map((s,i)=>(
        <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:i<sets.length-1?`1px solid ${C.border}`:"none"}}>
          <div style={{fontSize:"12px",color:C.textMuted,letterSpacing:"1px",textTransform:"uppercase"}}>Set {i+1} — {s.pct}%</div>
          <div style={{display:"flex",gap:"16px",alignItems:"center"}}>
            <div style={{fontSize:"20px",fontWeight:"bold",color:C.white}}>{s.weight}<span style={{fontSize:"12px",fontWeight:"normal",color:C.textMuted}}> lbs</span></div>
            <div style={{fontSize:"13px",color:C.textMuted}}>{s.reps} reps</div>
          </div>
        </div>
      )):<div style={{fontSize:"13px",color:C.textFaint,fontStyle:"italic"}}>Enter working weight to calculate.</div>}
    </div>
  );
}

// ── SET LOG ROW ──────────────────────────────────────────────────
// Find the most recent prior performance of an exercise across ALL weeks,
// excluding the current week. Used for the "Last:" reference so working
// weights persist even after resetting back to week 1.
// Returns an array of set objects (the logged sets from that session), or [].
function findLastPerformance(sessionLog,exId,currentWeek,logSuffix){
  let best=null,bestWeek=-1;
  for(let w=1;w<=16;w++){
    if(w===currentWeek)continue;
    const key=exId+"_w"+w+"_a"+(logSuffix||"");
    const log=sessionLog[key];
    if(!log)continue;
    const hasData=log.some(s=>s&&s.weight&&s.reps);
    if(hasData&&w>bestWeek){best=log;bestWeek=w;}
  }
  return{sets:best||[],week:bestWeek};
}

function SetLogRow({si,label,repRange,data,lastData,onLog,restSecs,exId,isNextSet,hideTimer,onTimerDone}){
  const[tv,setTv]=useState(activeTimers[exId+"_"+si]||0);
  const{max}=parseRange(repRange);
  const isLogged=!!(data.weight&&data.reps);
  function startTimer(){
    if(hideTimer)return;
    scheduleBombDrop(restSecs);
    const v=(activeTimers[exId+"_"+si]||0)+1;activeTimers[exId+"_"+si]=v;setTv(v);
  }
  function handleDismiss(){setTv(0);if(onTimerDone)onTimerDone();}
  const atMax=data.reps&&parseInt(data.reps)>=max&&max>0;
  const rowBg=isNextSet&&!isLogged?C.cyanLight:"transparent";
  const rowBorder=isNextSet&&!isLogged?`1.5px solid ${C.cyan}`:"1.5px solid transparent";
  return(
    <div style={{marginBottom:"8px",borderRadius:"6px",background:rowBg,border:rowBorder,padding:isNextSet&&!isLogged?"8px 6px":"0 6px",transition:"all 0.3s"}}>
      <div style={{display:"flex",gap:"6px",alignItems:"center"}}>
        <div style={{fontSize:"11px",color:isNextSet&&!isLogged?C.cyan:C.textMid,width:"50px",fontWeight:"bold",flexShrink:0,transition:"color 0.3s"}}>{label}</div>
        <input type="number" placeholder={max>0?String(max):"lbs"} value={data.weight||""} onChange={e=>onLog(si,"weight",e.target.value)} style={{flex:1,minWidth:"60px",borderColor:isNextSet&&!isLogged?C.cyan:undefined}}/>
        <input type="number" placeholder={max>0?repRange:"reps"} value={data.reps||""} onChange={e=>onLog(si,"reps",e.target.value)} style={{flex:1,minWidth:"60px",color:atMax?C.green:C.white,borderColor:isNextSet&&!isLogged?C.cyan:atMax?C.green:undefined}}/>
        <input type="number" placeholder="RIR" value={data.rir||""} onChange={e=>onLog(si,"rir",e.target.value)} style={{flex:"0 0 56px",width:"56px",minWidth:"56px",color:data.rir!==undefined&&parseInt(data.rir)<=1?C.cyan:C.white}}/>
        {isLogged&&!hideTimer&&(
          <button onClick={startTimer} style={{background:tv>0?"transparent":C.cyan,border:`1px solid ${C.cyan}`,borderRadius:"6px",padding:"8px 10px",color:tv>0?C.cyan:C.bg,fontSize:"10px",fontWeight:"bold",letterSpacing:"1px",whiteSpace:"nowrap",flexShrink:0,minWidth:"60px"}}>▶ REST</button>
        )}
        {isLogged&&hideTimer&&<div style={{width:"60px",flexShrink:0}}/>}
      </div>
      {lastData&&lastData.weight&&(
        <div style={{fontSize:"10px",color:C.textFaint,paddingLeft:"56px",marginTop:"2px"}}>Last: {lastData.weight}lb × {lastData.reps||"?"} reps</div>
      )}
      {tv>0&&<RestTimer key={tv} seconds={restSecs} onDismiss={handleDismiss}/>}
    </div>
  );
}

// ── EXERCISE ROW ─────────────────────────────────────────────────
function ExerciseRow({ex:origEx,week,phase,sessionLog,onLog,bandLog,onBandLog,variantSelections,onVariantSelect,onOpenPicker,onOpenReplace,substitution,customName,onEditName,customPrimary,onRevertSub,groupType,isLast}){
  const[nextSetIdx,setNextSetIdx]=useState(null);
  const[showDetail,setShowDetail]=useState(false);

  // If this slot has a substitution, render the replacement movement but keep
  // the original's id for slot identity. Replacement carries its own variants,
  // muscles, spine flag, etc. Logs go to a substitute-tagged key (see logKeyA).
  const isSub=!!substitution;
  const subDef=isSub?ALL_EXERCISES.find(e=>e.id===substitution.subId):null;
  const ex=subDef?{
    ...subDef,
    id:origEx.id,                       // keep slot identity
    isSuperset:origEx.isSuperset,       // preserve grouping role
    subName:origEx.subName,
    lockedSets:origEx.lockedSets!==undefined?origEx.lockedSets:subDef.lockedSets,
    reps:origEx.reps||subDef.reps,      // keep programmed rep target
  }:origEx;

  const variantKey=variantSelections[ex.id]||null;
  const variantDef=variantKey&&ex.variants?ex.variants[variantKey]:null;
  const programmedName=variantDef?variantDef.name:ex.name;
  const displayName=customName||programmedName;
  const subLabel=ex.isSuperset?(ex.subName||ex.name):null;
  const repRange=ex.reps||phase.reps||"10–12";
  const numSets=getPhaseSets(null,phase.type,ex,phase.sets);
  const restSecs=parseRestSeconds(ex.rest||phase.restNote||"90");
  const isAMRAP=ex.lockedSets===0;
  // Substitution logs to a distinct key so original data never collides
  const logSuffix=isSub?("_sub_"+substitution.subId):"";
  const logKeyA=ex.id+"_w"+week+"_a"+logSuffix;
  const logA=sessionLog[logKeyA]||[];
  // "Last:" reference = most recent prior performance across ALL weeks (not just week-1).
  // This keeps working weights visible even after resetting progress to week 1.
  const lastPerf=findLastPerformance(sessionLog,ex.id,week,logSuffix);
  const logAPrev=lastPerf.sets;
  function logSet(si,field,val){onLog(logKeyA,si,field,val);}
  // ADD WEIGHT is earned by LAST session's performance, evaluated at the start of
  // this one — not by the sets you're currently logging. Reads prior performance.
  const prog=checkProgression(logAPrev,repRange);

  useEffect(()=>{
    if(isAMRAP){setNextSetIdx(null);return;}
    const firstEmpty=logA.findIndex((s,i)=>i<numSets&&!(s&&s.weight&&s.reps));
    if(firstEmpty>=0&&firstEmpty<numSets)setNextSetIdx(firstEmpty);
    else if(logA.length<numSets)setNextSetIdx(logA.length);
    else setNextSetIdx(null);
  },[logA,numSets]);

  const showBandTracker=groupType==="standalone"&&(ex.name.toLowerCase().includes("band")||ex.name.toLowerCase().includes("face pull"));
  const mb=isLast?0:12;

  return(
    <div style={{marginBottom:mb,padding:"14px 0",borderBottom:isLast?"none":`1px solid ${C.border}`}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"8px",flexWrap:"wrap",gap:"6px"}}>
        <div style={{flex:1,minWidth:"180px"}}>
          <div style={{fontSize:"16px",fontWeight:"bold",color:C.white,lineHeight:1.2,display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap"}}>
            <span>{displayName}{subLabel&&<span style={{fontSize:"12px",color:C.textFaint,fontWeight:"normal"}}> / {subLabel}</span>}</span>
            {onEditName&&(
              <button onClick={()=>onEditName(ex.id)} title="Edit name"
                style={{background:"transparent",border:"none",padding:"2px 4px",cursor:"pointer",fontSize:"14px",lineHeight:1,opacity:0.7}}>🖊️</button>
            )}
          </div>
          {customName&&<div style={{fontSize:"11px",color:C.textFaint,marginTop:"2px"}}>originally: {programmedName}</div>}
          {variantDef&&!customName&&<div style={{fontSize:"11px",color:C.textMuted,marginTop:"2px"}}>Variant of: {ex.name}</div>}
          <div style={{fontSize:"12px",color:C.textMuted,marginTop:"4px",fontWeight:"500"}}>
            {isAMRAP?"AMRAP":numSets===7?"7 sets — FST-7":`${numSets} × ${repRange}`}
          </div>
        </div>
        <div style={{display:"flex",gap:"6px",flexShrink:0,flexWrap:"wrap",alignItems:"center"}}>
          {prog&&<span style={{fontSize:"9px",letterSpacing:"1px",background:C.green,color:C.bg,padding:"3px 8px",borderRadius:"3px",fontWeight:"bold",whiteSpace:"nowrap"}}>↑ ADD WEIGHT</span>}
          <button onClick={()=>setShowDetail(!showDetail)}
            style={{background:"transparent",border:`1.5px solid ${C.borderMid}`,borderRadius:"6px",padding:"6px 10px",color:showDetail?C.cyan:C.textMuted,fontSize:"11px",fontWeight:"bold",letterSpacing:"1px",borderColor:showDetail?C.cyan:C.borderMid}}>
            {showDetail?"▲ INFO":"▼ INFO"}
          </button>
          {ex.variants&&Object.keys(ex.variants).some(k=>ex.variants[k]!==null)&&(
            <button onClick={()=>onOpenPicker(ex,null)}
              style={{background:"transparent",border:`1.5px solid ${C.borderMid}`,borderRadius:"6px",padding:"6px 10px",color:C.textMuted,fontSize:"11px",fontWeight:"bold",letterSpacing:"1px",whiteSpace:"nowrap"}}>
              {variantKey?"⇄ "+(VARIANT_LABELS[variantKey]||{}).label||variantKey:"⇄ Swap"}
            </button>
          )}
          <button onClick={()=>onOpenReplace(origEx)}
            style={{background:"transparent",border:`1.5px solid ${isSub?C.gold:C.borderMid}`,borderRadius:"6px",padding:"6px 10px",color:isSub?C.gold:C.textMuted,fontSize:"11px",fontWeight:"bold",letterSpacing:"1px",whiteSpace:"nowrap"}}>
            ⤢ Replace
          </button>
        </div>
      </div>

      {isSub&&(
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:C.goldLight,border:`1px solid ${C.goldBorder}`,borderLeft:`3px solid ${C.gold}`,borderRadius:"4px",padding:"6px 10px",marginBottom:"10px"}}>
          <div style={{fontSize:"11px",color:C.gold,lineHeight:1.4}}>↺ Replaced from <strong>{origEx.name}</strong></div>
          <button onClick={()=>onRevertSub(origEx.id)} style={{background:"transparent",border:`1px solid ${C.goldBorder}`,borderRadius:"4px",padding:"4px 10px",color:C.gold,fontSize:"10px",fontWeight:"bold",letterSpacing:"1px",textTransform:"uppercase"}}>Revert</button>
        </div>
      )}

      {showDetail&&(
        <div style={{marginBottom:"12px"}}>
          {ex.spineFlag&&(
            <div style={{background:C.redLight,border:"1px solid rgba(255,68,68,0.3)",borderLeft:"3px solid #FF6B6B",borderRadius:"4px",padding:"8px 10px",marginBottom:"10px",fontSize:"11px",color:"#FF8C8C",lineHeight:1.5}}>
              ⚠ {ex.spineFlag}
            </div>
          )}
          {ex.formTip&&(
            <div style={{background:C.cyanLight,border:`1px solid ${C.cyanBorder}`,borderLeft:`3px solid ${C.cyan}`,borderRadius:"4px",padding:"8px 10px",marginBottom:"10px",fontSize:"12px",color:C.textMid,lineHeight:1.5}}>
              💡 {ex.formTip}
            </div>
          )}
          {ex.note&&<div style={{fontSize:"12px",color:C.textMuted,lineHeight:1.6,marginBottom:"8px"}}>{ex.note}</div>}
          {ex.steps&&(
            <div style={{marginBottom:"8px"}}>
              <div style={{fontSize:"10px",letterSpacing:"2px",color:C.textFaint,textTransform:"uppercase",fontWeight:"bold",marginBottom:"6px"}}>How To</div>
              {ex.steps.map((step,i)=>(
                <div key={i} style={{display:"flex",gap:"8px",marginBottom:"5px"}}>
                  <div style={{fontSize:"11px",color:C.cyan,fontWeight:"bold",flexShrink:0,minWidth:"16px"}}>{i+1}.</div>
                  <div style={{fontSize:"12px",color:C.textMuted,lineHeight:1.5}}>{step}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {ex.spineFlag&&!showDetail&&(
        <div style={{background:C.redLight,border:"1px solid rgba(255,68,68,0.25)",borderLeft:"3px solid #FF6B6B",borderRadius:"4px",padding:"6px 10px",marginBottom:"8px",fontSize:"11px",color:"#FF8C8C",lineHeight:1.5}}>
          ⚠ {ex.spineFlag}
        </div>
      )}

      {numSets===7&&!isAMRAP&&(
        <div style={{fontSize:"11px",color:C.gold,fontWeight:"bold",marginBottom:"10px",letterSpacing:"1px"}}>FST-7 — 45s rest between sets. Same weight all 7.</div>
      )}

      {!isAMRAP&&[...Array(numSets)].map((_,si)=>{
        const data=logA[si]||{};const lastData=logAPrev[si]||null;const isNext=nextSetIdx===si;
        return(
          <SetLogRow key={si} si={si} label={`SET ${si+1}`} repRange={repRange} data={data} lastData={lastData}
            onLog={(i,f,v)=>logSet(i,f,v)} restSecs={numSets===7?45:restSecs}
            exId={ex.id} isNextSet={isNext} hideTimer={false}
            onTimerDone={()=>setNextSetIdx(si+1<numSets?si+1:null)}/>
        );
      })}

      {isAMRAP&&(
        <div style={{marginTop:"8px"}}>
          <div style={{fontSize:"12px",color:C.textMuted,letterSpacing:"1px",textTransform:"uppercase",fontWeight:"bold",marginBottom:"6px"}}>Rounds / Notes</div>
          <textarea rows={2} placeholder="e.g. 4 rounds, RPE 7, 10 min total..."
            value={logA[0]?.notes||""}
            onChange={e=>logSet(0,"notes",e.target.value)}/>
        </div>
      )}
      {showBandTracker&&<BandTracker sessionKey={ex.id+"_w"+week} bandLog={bandLog} onBandLog={onBandLog}/>}
      {ex.feeders&&<WarmupCalc feeders={ex.feeders}/>}
    </div>
  );
}

// Flat list of every exercise: program movements + standalone catalog (deduped by id)
const ALL_EXERCISES=(()=>{
  const out=[];
  PROGRAM.forEach(day=>{(day.groups||[]).forEach(g=>{(g.exercises||[]).forEach(ex=>{
    if(!out.find(e=>e.id===ex.id))out.push({...ex,dayLabel:day.label,dayTag:day.day});
  });});});
  // Add catalog entries that aren't already represented
  EXERCISE_DB.forEach(ex=>{
    if(!out.find(e=>e.id===ex.id))out.push({...ex,dayLabel:"Library",dayTag:"DB"});
  });
  return out;
})();

// ── REPLACE EXERCISE PICKER ──────────────────────────────────────
// Opens filtered to the original exercise's primary muscle. User picks a
// full replacement movement. Filter is changeable. Excludes the original.
function ReplacePicker({original,onSelect,onClose}){
  const firstMuscle=(original.primaryMuscles&&original.primaryMuscles[0])||"";
  const[filterMuscle,setFilterMuscle]=useState(firstMuscle);
  const[search,setSearch]=useState("");

  const filtered=ALL_EXERCISES.filter(ex=>{
    if(ex.id===original.id)return false;
    const matchSearch=!search||ex.name.toLowerCase().includes(search.toLowerCase());
    const matchMuscle=!filterMuscle||(ex.primaryMuscles||[]).includes(filterMuscle)||(ex.secondaryMuscles||[]).includes(filterMuscle);
    return matchSearch&&matchMuscle;
  });

  const muscleChips=["chest","biceps","triceps","quads","hamstrings","glutes","lats","traps","rearDelt","frontDelt","abs","calves","forearms"];

  return(
    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:C.bg,zIndex:200,overflowY:"auto",display:"flex",flexDirection:"column"}}>
      <div style={{background:C.surfaceMid,borderBottom:`2px solid ${C.gold}`,padding:"20px 18px",position:"sticky",top:0,zIndex:10,flexShrink:0}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div style={{flex:1}}>
            <div style={{fontSize:"10px",letterSpacing:"3px",color:C.gold,textTransform:"uppercase",fontWeight:"bold",marginBottom:"4px"}}>Replace Exercise</div>
            <div style={{fontSize:"18px",fontWeight:"bold",color:C.white,lineHeight:1.2}}>{original.name}</div>
            <div style={{fontSize:"11px",color:C.textMuted,marginTop:"3px"}}>Pick a different movement for this session</div>
          </div>
          <button onClick={onClose} style={{background:"transparent",border:`1.5px solid ${C.borderMid}`,borderRadius:"8px",padding:"10px 16px",color:C.textMid,fontSize:"13px",fontWeight:"bold",flexShrink:0,marginLeft:"12px"}}>✕ Close</button>

// Resolve the effective exercise + log key for a slot, honoring a substitution.
// Returns {ex, logKey} where ex is the movement actually being performed.
function resolveSlot(origEx,week,substitutions,customPrimary){
  // Per-week substitution takes priority; custom-primary is the standing default.
  let sub=substitutions?substitutions[origEx.id+"_w"+week]:null;
  let isPermanent=false;
  if(!sub&&customPrimary&&customPrimary[origEx.id]){
    sub=customPrimary[origEx.id];isPermanent=true;
  }
  if(sub){
    const subDef=ALL_EXERCISES.find(e=>e.id===sub.subId);
    if(subDef){
      const eff={...subDef,id:origEx.id,isSuperset:origEx.isSuperset,subName:origEx.subName,
        lockedSets:origEx.lockedSets!==undefined?origEx.lockedSets:subDef.lockedSets,reps:origEx.reps||subDef.reps};
      return{ex:eff,logKey:origEx.id+"_w"+week+"_a_sub_"+sub.subId,isSub:true,isPermanent,origName:origEx.name};
    }
  }
  return{ex:origEx,logKey:origEx.id+"_w"+week+"_a",isSub:false,isPermanent:false,origName:origEx.name};
}

// Turn a day's groups into a flat list of "units" — each unit is one tappable
// card on the workout overview and one focus page. Types: single | superset | conditioning.
function buildUnits(session){
  const units=[];
  (session.groups||[]).forEach((group,gi)=>{
    if(group.condType){
      units.push({kind:"conditioning",group,unitId:group.exercises.map(e=>e.id).join("+"),label:group.label,gi});
    }else if(group.type!=="standalone"){
      units.push({kind:"superset",group,unitId:group.exercises.map(e=>e.id).join("+"),label:group.label,gi});
    }else{
      group.exercises.forEach(ex=>{
        if(ex.condType){
          units.push({kind:"conditioning",group:{...group,condType:ex.condType,condScheme:ex.condScheme},single:ex,unitId:ex.id,label:group.label,gi});
        }else{
          units.push({kind:"single",ex,group,unitId:ex.id,label:group.label,gi});
        }
      });
    }
  });
  return units;
}
// A unit's completion key for tm_ex_done
function unitDoneKey(unitId,week){return unitId+"_w"+week;}

const MUSCLE_RECOVERY_MAP={
  chest:["wed_03a","wed_05","mon_04b","wed_01","tue_04c"],
  biceps:["fri_01a","fri_02a","fri_03","fri_05"],
  triceps:["fri_01b","fri_02b","fri_04"],
  quads:["mon_02","mon_03","thu_01","tue_04b"],
  hamstrings:["mon_01","mon_02","mon_05","tue_04a"],
  glutes:["mon_02","mon_03","thu_01","thu_04b","tue_02","tue_04a"],
  lats:["wed_02","mon_04a"],
  traps:["mon_06","thu_06b","thu_06c","wed_04b","thu_06"],
  rearDelt:["mon_06","thu_06a","thu_06b","thu_06c","wed_04b"],
  frontDelt:["wed_01","mon_04b","wed_03a"],
  abs:["tue_03","thu_07a","thu_07b"],
  obliques:["thu_07a","thu_07b"],
  calves:["mon_05","thu_02a"],
  forearms:["thu_03a","thu_03b","thu_06"],
  lowerBack:["thu_08","mon_01","mon_02"],
};
const RECOVERY_DECAY_PER_DAY=0.25; // legacy constant, retained for reference

// Time-aware muscle recovery.
// For each exercise that trains the muscle, find the most recent COMPLETED
// session it appears in (by timestamp), estimate that session's fatigue from
// volume, then recover linearly over a window that scales with how hard it was.
// Overall muscle recovery = the least-recovered of its exercises.
function calcMuscleRecovery(muscleKey,sessionLog,completedLog){
  const exIds=MUSCLE_RECOVERY_MAP[muscleKey]||[];
  const now=Date.now();
  const DAY_MS=86400000;
  let minRecovered=100; // worst case across the muscle's exercises
  let foundAny=false;

  exIds.forEach(exId=>{
    const day=exId.split("_")[0].toUpperCase(); // MON/TUE/...
    // Find the most recent week where this exercise was logged AND that day was completed
    let bestTs=-1,bestVol=0;
    for(let w=1;w<=16;w++){
      const log=sessionLog[exId+"_w"+w+"_a"]||[];
      const sets=log.filter(s=>s&&s.weight&&s.reps);
      if(!sets.length)continue;
      const comp=completedLog[day+"_w"+w];
      const ts=comp&&comp.ts?comp.ts:null;
      if(ts===null)continue; // only count completed sessions (we know when they happened)
      if(ts>bestTs){
        bestTs=ts;
        bestVol=sets.reduce((a,s)=>(a+(parseFloat(s.weight)||0)*(parseInt(s.reps)||0)),0);
      }
    }
    if(bestTs<0)return; // never trained-and-completed
    foundAny=true;

    // Fatigue 0–100 from session volume. ~3000 lb of volume = a hard session.
    const fatigue=Math.min(100,(bestVol/3000)*100);
    // Recovery window: 36h base + up to 36h more for a hard session (so 1.5–3 days)
    const windowMs=(1.5+1.5*(fatigue/100))*DAY_MS;
    const elapsed=now-bestTs;
    const progress=Math.max(0,Math.min(1,elapsed/windowMs)); // 0 = just trained, 1 = fully recovered
    // Recovered% climbs from (100 - fatigue) up to 100 across the window
    const startRecovered=100-fatigue;
    const recovered=startRecovered+(100-startRecovered)*progress;
    if(recovered<minRecovered)minRecovered=recovered;
  });

  if(!foundAny)return 100; // nothing logged/completed = fully fresh
  return Math.round(Math.max(0,Math.min(100,minRecovered)));
}

function RecoveryView({sessionLog,completedLog}){
  const[manualOverrides,setManualOverrides]=useState(()=>LS.get("tm_recovery_manual")||{});
  const[selected,setSelected]=useState(null);

  const muscles=Object.keys(MUSCLE_RECOVERY_MAP);

  function getRecovery(m){
    if(manualOverrides[m]!==undefined)return manualOverrides[m];
    return calcMuscleRecovery(m,sessionLog,completedLog);
  }

  function setManual(m,val){
    const n={...manualOverrides,[m]:val};
    setManualOverrides(n);LS.set("tm_recovery_manual",n);
  }
  function clearManual(m){
    const n={...manualOverrides};delete n[m];
    setManualOverrides(n);LS.set("tm_recovery_manual",n);
  }

  const recoveryColor=(pct)=>{
    if(pct>=80)return C.green;
    if(pct>=50)return C.gold;
    if(pct>=25)return C.orange;
    return C.red;
  };

  if(selected){
    const pct=getRecovery(selected);
    const rc=recoveryColor(pct);
    const exIds=MUSCLE_RECOVERY_MAP[selected]||[];
    // Gather recent sets for this muscle
    const recentSets=[];
    exIds.forEach(exId=>{
      const ex=PROGRAM.flatMap(d=>d.groups||[]).flatMap(g=>g.exercises||[]).find(e=>e.id===exId);
      for(let w=16;w>=1;w--){
        const log=sessionLog[exId+"_w"+w+"_a"]||[];
        const sets=log.filter(s=>s&&s.weight&&s.reps);
        if(sets.length&&recentSets.length<8){
          recentSets.push({exName:ex?ex.name:exId,week:w,sets});
        }
      }
    });
    return(
      <div style={{padding:"0 18px 40px"}}>
        <button onClick={()=>setSelected(null)} style={{background:"transparent",border:`1px solid ${C.borderMid}`,borderRadius:"6px",padding:"8px 14px",color:C.textMuted,fontSize:"12px",fontWeight:"bold",marginBottom:"16px",letterSpacing:"1px"}}>← BACK</button>
        <div style={{fontSize:"22px",fontWeight:"bold",color:C.white,marginBottom:"6px",textTransform:"capitalize"}}>{selected.replace(/([A-Z])/g,' $1').trim()}</div>
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:"10px",padding:"16px",marginBottom:"14px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}}>
            <div>
              <div style={{fontSize:"36px",fontWeight:"bold",color:rc}}>{pct}%</div>
              <div style={{fontSize:"12px",color:C.textMuted}}>recovered</div>
            </div>

// ── POST-WORKOUT SUMMARY ─────────────────────────────────────────
function PostWorkoutSummary({session,week,sessionLog,phase,substitutions,customPrimary,condV2,condV2Done,onDismiss,totalSessionsCompleted}){
  const allGroups=session.groups||[];
  let totalSets=0,totalVolume=0,condDone=0,condTotal=0;
  const musclesHit=new Set();
  allGroups.forEach(group=>{
    if(group.condType){
      // AMRAP circuit — one conditioning unit
      condTotal+=1;
      const ck=group.exercises.map(e=>e.id).join("+")+"_w"+week;
      if(condV2Done&&condV2Done[ck])condDone+=1;
      group.exercises.forEach(ex=>(ex.primaryMuscles||[]).forEach(m=>musclesHit.add(m)));
      return;
    }
    group.exercises.forEach(origEx=>{
      if(origEx.condType){
        condTotal+=1;
        const ck=origEx.id+"_w"+week;
        if(condV2Done&&condV2Done[ck])condDone+=1;
        (origEx.primaryMuscles||[]).forEach(m=>musclesHit.add(m));
        return;
      }
      const{ex,logKey}=resolveSlot(origEx,week,substitutions,customPrimary);
      const log=sessionLog[logKey]||[];
      const sets=log.filter(s=>s&&s.weight&&s.reps);
      totalSets+=sets.length;
      totalVolume+=sets.reduce((a,s)=>(a+(parseFloat(s.weight)||0)*(parseInt(s.reps)||0)),0);
      (ex.primaryMuscles||[]).forEach(m=>musclesHit.add(m));
    });
  });
  const isConditioningDay=condTotal>0&&totalSets===0;

  const isMilestone=totalSessionsCompleted>0&&[1,5,10,25,50,100,150,200].includes(totalSessionsCompleted);

  return(
    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.85)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}}>
      <div className="slideUp" style={{background:C.surface,border:`2px solid ${C.cyan}`,borderRadius:"16px",padding:"28px 24px",width:"100%",maxWidth:"400px",maxHeight:"80vh",overflowY:"auto"}}>
        {isMilestone&&(
          <div style={{textAlign:"center",marginBottom:"16px"}}>
            <div style={{fontSize:"36px",marginBottom:"4px"}}>🏆</div>
            <div style={{fontSize:"14px",fontWeight:"bold",color:C.gold,letterSpacing:"2px"}}>SESSION {totalSessionsCompleted} COMPLETE</div>
          </div>
        )}
        <div style={{fontSize:"10px",letterSpacing:"3px",color:C.cyan,textTransform:"uppercase",fontWeight:"bold",marginBottom:"6px",textAlign:"center"}}>Session Complete</div>
        <div style={{fontSize:"22px",fontWeight:"bold",color:C.white,marginBottom:"20px",textAlign:"center"}}>{session.label}</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px",marginBottom:"20px"}}>
          {(isConditioningDay
            ?[["Circuits Done",condDone+"/"+condTotal],["Type","Conditioning"],["Muscles",musclesHit.size]]
            :[["Total Sets",totalSets],["Volume",totalVolume>0?Math.round(totalVolume)+" lbs":"—"],["Muscles",musclesHit.size]]
          ).map(([l,v])=>(
            <div key={l} style={{background:C.card,border:`1px solid ${C.cyanBorder}`,borderRadius:"8px",padding:"12px 8px",textAlign:"center"}}>
              <div style={{fontSize:"20px",fontWeight:"bold",color:C.cyan}}>{v}</div>
              <div style={{fontSize:"10px",color:C.textFaint,letterSpacing:"1px",textTransform:"uppercase",marginTop:"3px"}}>{l}</div>
            </div>
          ))}
        </div>
        {musclesHit.size>0&&(
          <div style={{marginBottom:"20px"}}>
            <div style={{fontSize:"10px",letterSpacing:"2px",color:C.textFaint,textTransform:"uppercase",fontWeight:"bold",marginBottom:"8px"}}>Muscles Worked</div>
            <div style={{display:"flex",gap:"6px",flexWrap:"wrap"}}>
              {[...musclesHit].map(m=>(
                <span key={m} style={{fontSize:"11px",background:C.cyanLight,border:`1px solid ${C.cyanBorder}`,color:C.cyan,padding:"3px 10px",borderRadius:"20px",fontWeight:"bold",textTransform:"capitalize"}}>{m.replace(/([A-Z])/g,' $1').trim()}</span>
              ))}
            </div>
          </div>
        )}
        <div style={{fontSize:"11px",color:C.textFaint,textAlign:"center",marginBottom:"16px"}}>Total sessions: {totalSessionsCompleted}</div>
        <button onClick={onDismiss} style={{width:"100%",padding:"14px",background:C.cyan,border:"none",borderRadius:"8px",color:C.bg,fontSize:"13px",fontWeight:"bold",letterSpacing:"2px",textTransform:"uppercase"}}>CLOSE</button>
      </div>
    </div>
  );
}

// ── HIIT TIMER ───────────────────────────────────────────────────
// Phase machine: warmup → (work → rest) × rounds → cooldown.
// Auto-advances with bomb-drop audio on each transition. Fields editable
// before start; programmed scheme pre-fills them.
function HIITTimer({scheme,onComplete}){
  const[cfg,setCfg]=useState({
    warmup:scheme?.warmup??0,
    work:scheme?.work??30,
    rest:scheme?.rest??30,
    rounds:scheme?.rounds??8,
    cooldown:scheme?.cooldown??0,
  });
  const[running,setRunning]=useState(false);
  const[paused,setPaused]=useState(false);
  const[phase,setPhase]=useState("idle"); // idle|warmup|work|rest|cooldown|done
  const[remaining,setRemaining]=useState(0);
  const[round,setRound]=useState(0);
  const tickRef=useRef(null);
  const phaseRef=useRef("idle");
  const roundRef=useRef(0);
  const wakeRef=useRef(null);

  async function requestWake(){
    try{if("wakeLock" in navigator){wakeRef.current=await navigator.wakeLock.request("screen");}}catch(e){}
  }
  function releaseWake(){try{if(wakeRef.current){wakeRef.current.release();wakeRef.current=null;}}catch(e){}}

  // Build the ordered phase queue from config
  function buildQueue(){
    const q=[];
    if(cfg.warmup>0)q.push({type:"warmup",dur:cfg.warmup});
    for(let r=1;r<=cfg.rounds;r++){
      q.push({type:"work",dur:cfg.work,round:r});
      if(r<cfg.rounds||cfg.cooldown>0||true)q.push({type:"rest",dur:cfg.rest,round:r});
    }
    if(cfg.cooldown>0)q.push({type:"cooldown",dur:cfg.cooldown});
    return q;
  }
  const queueRef=useRef([]);
  const qIdxRef=useRef(0);

  function beep(kind){
    try{
      const ctx=TMAudio.init();if(!ctx)return;
      const t=ctx.currentTime;
      const o=ctx.createOscillator();const g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);o.type="sine";
      const freq=kind==="work"?880:kind==="rest"?440:kind==="done"?1200:660;
      o.frequency.setValueAtTime(freq,t);
      if(kind==="done"){o.frequency.exponentialRampToValueAtTime(300,t+0.6);}
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.5,t+0.05);
      g.gain.exponentialRampToValueAtTime(0.0001,t+(kind==="done"?0.7:0.35));
      o.start(t);o.stop(t+(kind==="done"?0.8:0.4));
      if(navigator.vibrate)navigator.vibrate(kind==="done"?[300,150,300]:200);
    }catch(e){}
  }

  function advance(){
    qIdxRef.current+=1;
    const q=queueRef.current;
    if(qIdxRef.current>=q.length){
      // done
      phaseRef.current="done";setPhase("done");setRunning(false);
      clearInterval(tickRef.current);beep("done");releaseWake();
      if(globalFlashFn)globalFlashFn();
      return;
    }
    const next=q[qIdxRef.current];
    phaseRef.current=next.type;setPhase(next.type);
    if(next.round){roundRef.current=next.round;setRound(next.round);}
    setRemaining(next.dur);
    beep(next.type);
  }

  function start(){
    const q=buildQueue();
    if(q.length===0)return;
    queueRef.current=q;qIdxRef.current=0;
    const first=q[0];
    phaseRef.current=first.type;setPhase(first.type);
    roundRef.current=first.round||0;setRound(first.round||0);
    setRemaining(first.dur);setRunning(true);setPaused(false);
    beep(first.type);requestWake();
    tickRef.current=setInterval(()=>{
      setRemaining(prev=>{
        if(prev<=1){advance();return phaseRef.current==="done"?0:queueRef.current[qIdxRef.current].dur;}
        return prev-1;
      });
    },1000);
  }
  function pause(){
    if(paused){
      setPaused(false);
      tickRef.current=setInterval(()=>{
        setRemaining(prev=>{if(prev<=1){advance();return phaseRef.current==="done"?0:queueRef.current[qIdxRef.current].dur;}return prev-1;});
      },1000);
    }else{
      setPaused(true);clearInterval(tickRef.current);
    }
  }
  function reset(){
    clearInterval(tickRef.current);releaseWake();
    setRunning(false);setPaused(false);setPhase("idle");setRemaining(0);setRound(0);
    qIdxRef.current=0;phaseRef.current="idle";
  }
  useEffect(()=>()=>{clearInterval(tickRef.current);releaseWake();},[]);

  const phaseColor={warmup:C.cyan,work:C.green,rest:C.gold,cooldown:C.cyan,done:C.green,idle:C.textMuted}[phase];
  const phaseLabel={warmup:"WARM-UP",work:"WORK",rest:"REST",cooldown:"COOL-DOWN",done:"COMPLETE",idle:"READY"}[phase];
  const mins=Math.floor(remaining/60);const secs=remaining%60;
  const totalRounds=cfg.rounds;

  // config editor (shown when idle)
  const fields=[
    ["warmup","Warm-Up (s)"],["work","Work (s)"],["rest","Rest (s)"],["rounds","Rounds"],["cooldown","Cool-Down (s)"],
  ];

  return(
    <div style={{background:C.card,border:`1px solid ${phase==="idle"?C.border:phaseColor+"55"}`,borderRadius:"10px",padding:"16px",marginBottom:"14px"}}>
      {phase==="idle"&&(
        <div>
          <div style={{fontSize:"11px",letterSpacing:"2px",color:C.cyan,textTransform:"uppercase",fontWeight:"bold",marginBottom:"12px"}}>HIIT Timer — Set Your Scheme</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"14px"}}>
            {fields.map(([k,lbl])=>(
              <div key={k}>
                <div style={{fontSize:"10px",color:C.textMuted,letterSpacing:"1px",textTransform:"uppercase",marginBottom:"4px",fontWeight:"bold"}}>{lbl}</div>
                <input type="number" value={cfg[k]} onChange={e=>setCfg({...cfg,[k]:parseInt(e.target.value)||0})} style={{width:"100%"}}/>
              </div>
            ))}
          </div>
          <div style={{fontSize:"11px",color:C.textFaint,marginBottom:"12px",lineHeight:1.5}}>
            {cfg.rounds} rounds · {cfg.work}s work / {cfg.rest}s rest{cfg.warmup>0?` · ${cfg.warmup}s warm-up`:""}{cfg.cooldown>0?` · ${cfg.cooldown}s cool-down`:""}
          </div>
          <button onClick={start} style={{width:"100%",padding:"15px",background:C.green,border:"none",borderRadius:"8px",color:C.bg,fontSize:"14px",fontWeight:"bold",letterSpacing:"2px",textTransform:"uppercase"}}>▶ START TIMER</button>
        </div>
      )}

      {phase!=="idle"&&(
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:"13px",letterSpacing:"3px",color:phaseColor,textTransform:"uppercase",fontWeight:"bold",marginBottom:"4px"}}>{phaseLabel}</div>
          {(phase==="work"||phase==="rest")&&<div style={{fontSize:"12px",color:C.textMuted,marginBottom:"8px"}}>Round {round} of {totalRounds}</div>}
          {phase==="done"&&<div style={{fontSize:"36px",marginBottom:"8px"}}>✓</div>}
          {phase!=="done"&&(
            <div style={{fontSize:"64px",fontWeight:"bold",color:phaseColor,fontVariantNumeric:"tabular-nums",lineHeight:1,marginBottom:"12px"}}>
              {mins}:{secs.toString().padStart(2,"0")}
            </div>
          )}
          {phase==="done"&&<div style={{fontSize:"18px",fontWeight:"bold",color:C.green,marginBottom:"16px"}}>All rounds complete</div>}
          <div style={{display:"flex",gap:"8px"}}>
            {phase!=="done"&&(
              <button onClick={pause} style={{flex:1,padding:"12px",background:paused?C.green:"transparent",border:`1.5px solid ${paused?C.green:C.borderMid}`,borderRadius:"8px",color:paused?C.bg:C.textMid,fontSize:"12px",fontWeight:"bold",letterSpacing:"1px",textTransform:"uppercase"}}>{paused?"▶ Resume":"❚❚ Pause"}</button>
            )}
            <button onClick={reset} style={{flex:1,padding:"12px",background:"transparent",border:`1.5px solid ${C.borderMid}`,borderRadius:"8px",color:C.textMuted,fontSize:"12px",fontWeight:"bold",letterSpacing:"1px",textTransform:"uppercase"}}>↺ Reset</button>
          </div>
        </div>
      )}
    </div>
  );
}

// Plain-language prescription line for a conditioning unit.
function prescriptionText(condType,scheme,exReps){
  const s=scheme||{};
  if(condType==="interval"){
    const parts=[];
    if(s.warmup)parts.push(`${s.warmup}s warm-up`);
    parts.push(`${s.work||0}s work / ${s.rest||0}s rest`);
    parts.push(`× ${s.rounds||0} rounds`);
    if(s.cooldown)parts.push(`${s.cooldown}s cool-down`);
    return parts.join(" · ");
  }
  if(condType==="carry")return `${s.distance||40} yds × ${s.rounds||0} rounds`;
  if(condType==="reps")return `${s.reps||exReps||0} reps × ${s.rounds||0} rounds`;
  if(condType==="amrap")return `${s.cap||0} min AMRAP — complete as many rounds as possible`;
  return "";
}
function PrescriptionBanner({condType,scheme,exReps,accent}){
  const txt=prescriptionText(condType,scheme,exReps);
  if(!txt)return null;
  const c=accent||C.cyan;
  return(
    <div style={{background:c+"14",border:`1px solid ${c}55`,borderLeft:`3px solid ${c}`,borderRadius:"6px",padding:"10px 12px",marginBottom:"12px"}}>
      <div style={{fontSize:"9px",letterSpacing:"2px",color:c,textTransform:"uppercase",fontWeight:"bold",marginBottom:"3px"}}>Prescribed</div>
      <div style={{fontSize:"14px",color:C.white,fontWeight:"bold",lineHeight:1.4}}>{txt}</div>
    </div>
  );
}

function BodyCompEntry({entry,origIdx,onSave,onDelete}){
  const[editing,setEditing]=useState(false);

  function save(){onSave(origIdx,{...entry,weight:parseFloat(wt)||entry.weight,bf:bf?parseFloat(bf):null});setEditing(false);}
  function cancel(){setWt(String(entry.weight||""));setBf(String(entry.bf||""));setEditing(false);}
  if(editing)return(
    <div style={{padding:"12px 0",borderBottom:`1px solid ${C.border}`}}>
      <div style={{fontSize:"11px",color:C.cyan,letterSpacing:"1px",textTransform:"uppercase",fontWeight:"bold",marginBottom:"10px"}}>{entry.date} — Editing</div>
      <div style={{display:"flex",gap:"8px",marginBottom:"10px"}}>
        <div style={{flex:1}}><div style={{fontSize:"10px",color:C.textMuted,letterSpacing:"1px",textTransform:"uppercase",marginBottom:"4px",fontWeight:"bold"}}>Weight (lbs)</div><input type="number" value={wt} onChange={e=>setWt(e.target.value)} style={{width:"100%"}}/></div>

        <button onClick={cancel} style={{flex:1,padding:"10px",background:"transparent",border:`1.5px solid ${C.borderMid}`,borderRadius:"6px",color:C.textMuted,fontSize:"12px",fontWeight:"bold",letterSpacing:"1px",textTransform:"uppercase"}}>CANCEL</button>
        <button onClick={()=>onDelete(origIdx)} style={{padding:"10px 14px",background:C.redLight,border:`1.5px solid ${C.redBorder}`,borderRadius:"6px",color:C.red,fontSize:"12px",fontWeight:"bold"}}>✕</button>
      </div>

  );
  return(
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:`1px solid ${C.border}`}}>
      <div style={{fontSize:"13px",color:C.textMid,fontWeight:"500"}}>{entry.date}</div>
      <div style={{display:"flex",gap:"14px",alignItems:"center"}}>
        <div style={{fontSize:"15px",fontWeight:"bold",color:C.white}}>{entry.weight}<span style={{fontSize:"11px",color:C.textFaint}}> lbs</span></div>
        {entry.bf&&<div style={{fontSize:"15px",fontWeight:"bold",color:C.cyan}}>{entry.bf}<span style={{fontSize:"11px",color:C.textFaint}}>%</span></div>}
        <button onClick={()=>setEditing(true)} style={{background:"transparent",border:`1.5px solid ${C.borderMid}`,borderRadius:"6px",padding:"5px 10px",color:C.textMuted,fontSize:"11px",fontWeight:"bold",letterSpacing:"1px"}}>EDIT</button>
      </div>
    </div>
  );
}

// ── BODY COMP VIEW ───────────────────────────────────────────────
function BodyCompView({phase}){
  const[log,setLog]=useState(()=>LS.get("tm_bodycomp")||[]);
  const[wt,setWt]=useState("");const[bf,setBf]=useState("");const[note,setNote]=useState("");
  const[neck,setNeck]=useState("");const[waist,setWaist]=useState("");const[height,setHeight]=useState("");const[navyBF,setNavyBF]=useState("");

  function calcNavyBF(){
    const n=parseFloat(neck),w=parseFloat(waist),h=parseFloat(height);
    if(!n||!w||!h||w<=n)return;
    const result=(86.010*Math.log10(w-n)-70.041*Math.log10(h)+36.76).toFixed(1);
    setNavyBF(result);setBf(result);
  }
  function addEntry(){
    if(!wt)return;
    const entry={date:new Date().toLocaleDateString(),weight:parseFloat(wt),bf:bf?parseFloat(bf):null,note};
    const newLog=[...log,entry];setLog(newLog);LS.set("tm_bodycomp",newLog);
    setWt("");setBf("");setNote("");
  }
  function saveEntry(idx,updated){const nl=[...log];nl[nl.length-1-idx]=updated;setLog(nl);LS.set("tm_bodycomp",nl);}
  function deleteEntry(idx){const nl=[...log];nl.splice(nl.length-1-idx,1);setLog(nl);LS.set("tm_bodycomp",nl);}

  const recent=[...log].slice(-10);
  const minW=recent.length?Math.min(...recent.map(e=>e.weight))-5:180;
  const maxW=recent.length?Math.max(...recent.map(e=>e.weight))+5:230;

  return(
    <div style={{padding:"0 18px 40px"}}>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"18px",marginBottom:"14px"}}>
        <div style={{fontSize:"10px",letterSpacing:"2px",color:C.cyan,textTransform:"uppercase",fontWeight:"bold",marginBottom:"4px"}}>Navy BF% Calculator</div>
        <div style={{fontSize:"11px",color:C.textFaint,marginBottom:"14px"}}>Neck · Waist · Height in inches</div>
        <div style={{display:"flex",gap:"8px",marginBottom:"12px"}}>
          {[["Neck (in)",neck,setNeck,"15.5"],["Waist (in)",waist,setWaist,"34.0"],["Height (in)",height,setHeight,"71"]].map(([lbl,val,set,ph])=>(
            <div key={lbl} style={{flex:1}}>
              <div style={{fontSize:"10px",color:C.textFaint,letterSpacing:"1px",textTransform:"uppercase",marginBottom:"5px"}}>{lbl}</div>
              <input type="number" placeholder={ph} value={val} onChange={e=>set(e.target.value)} style={{width:"100%"}}/>
            </div>
          ))}
        </div>
        <button onClick={calcNavyBF} style={{width:"100%",padding:"12px",background:C.cyan,border:"none",borderRadius:"6px",color:C.bg,fontSize:"11px",fontWeight:"bold",letterSpacing:"2px",textTransform:"uppercase",marginBottom:navyBF?"12px":"0"}}>CALCULATE</button>
        {navyBF&&<div style={{background:C.blueLight,border:`1px solid ${C.blueBorder}`,borderLeft:`3px solid ${C.cyan}`,borderRadius:"6px",padding:"12px 14px"}}>
          <div style={{fontSize:"10px",letterSpacing:"2px",color:C.cyan,textTransform:"uppercase",marginBottom:"3px",fontWeight:"bold"}}>Navy Method Result</div>
          <div style={{fontSize:"26px",fontWeight:"bold",color:C.white}}>{navyBF}% <span style={{fontSize:"13px",color:C.textMuted,fontWeight:"normal"}}>body fat</span></div>
        </div>}
      </div>

      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"18px",marginBottom:"24px"}}>
        <div style={{fontSize:"10px",letterSpacing:"2px",color:C.cyan,textTransform:"uppercase",fontWeight:"bold",marginBottom:"14px"}}>Log Today</div>
        <div style={{display:"flex",gap:"8px",marginBottom:"12px"}}>
          <div style={{flex:1}}><div style={{fontSize:"10px",color:C.textFaint,letterSpacing:"1px",textTransform:"uppercase",marginBottom:"5px"}}>Weight (lbs)</div><input type="number" placeholder="217" value={wt} onChange={e=>setWt(e.target.value)} style={{width:"100%"}}/></div>
          <div style={{flex:1}}><div style={{fontSize:"10px",color:C.textFaint,letterSpacing:"1px",textTransform:"uppercase",marginBottom:"5px"}}>Body Fat %</div><input type="number" placeholder="23.5" value={bf} onChange={e=>setBf(e.target.value)} style={{width:"100%"}}/></div>
        </div>
        <button onClick={addEntry} style={{width:"100%",padding:"14px",background:C.cyan,border:"none",borderRadius:"6px",color:C.bg,fontSize:"11px",fontWeight:"bold",letterSpacing:"2px",textTransform:"uppercase"}}>LOG ENTRY</button>
      </div>

      {recent.length>=2&&(()=>{
        const W=320;const H=120;const PAD=20;const chartW=W-PAD*2;const chartH=H-PAD*2;
        return(<div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"18px",marginBottom:"20px",overflowX:"auto"}}>
          <div style={{fontSize:"10px",letterSpacing:"2px",color:C.textFaint,textTransform:"uppercase",fontWeight:"bold",marginBottom:"14px"}}>Weight Trend</div>
          <svg width={W} height={H}>
            {recent.map((e,i)=>{const x=PAD+(i/(recent.length-1))*chartW;const y=PAD+chartH-((e.weight-minW)/(maxW-minW))*chartH;return<circle key={i} cx={x} cy={y} r={4} fill={C.cyan}/>;  })}
            {recent.slice(1).map((e,i)=>{const x1=PAD+(i/(recent.length-1))*chartW;const y1=PAD+chartH-((recent[i].weight-minW)/(maxW-minW))*chartH;const x2=PAD+((i+1)/(recent.length-1))*chartW;const y2=PAD+chartH-((e.weight-minW)/(maxW-minW))*chartH;return<line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={C.cyan} strokeWidth={2} opacity={0.6}/>;  })}
          </svg>
        </div>);
      })()}

      {log.length>0&&(
        <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:"8px",padding:"18px"}}>
          <div style={{fontSize:"10px",letterSpacing:"2px",color:C.textFaint,textTransform:"uppercase",fontWeight:"bold",marginBottom:"14px"}}>Log History</div>
          {[...log].reverse().slice(0,10).map((e,i)=>(
            <BodyCompEntry key={i} entry={e} origIdx={i} onSave={saveEntry} onDelete={deleteEntry}/>
          ))}
        </div>
      )}
    </div>
  );
}

// ── CSV EXPORT ───────────────────────────────────────────────────
function exportCSV(sessionLog,readinessLog,bodyCompLog,week,substitutions,customPrimary,condV2,condV2Done){
  const rows=[["RAYMOND — TACTICAL MONSTER PROTOCOL"],["Exported:",new Date().toLocaleDateString()],["Week:",week],[]];
  rows.push(["SESSION LOG"]);
  rows.push(["Exercise","Week","Set","Weight (lbs)","Reps","RIR","Note"]);
  DAY_ORDER.forEach(day=>{
    const s=PROGRAM.find(p=>p.day===day);if(!s)return;
    (s.groups||[]).flatMap(g=>g.exercises||[]).forEach(origEx=>{
      if(origEx.lockedSets===0||origEx.condType)return;
      const slot=resolveSlot(origEx,week,substitutions,customPrimary);
      const log=sessionLog[slot.logKey]||[];
      const note=slot.isSub?("Replaced from "+slot.origName):"";
      log.forEach((st,i)=>{if(st&&st.weight)rows.push([slot.ex.name,week,"Set "+(i+1),st.weight,st.reps||"",st.rir||"",note]);});
    });
  });
  rows.push([]);
  rows.push(["CONDITIONING LOG"]);
  rows.push(["Exercise","Week","Type","Field 1","Field 2","Field 3","Done","Note"]);
  DAY_ORDER.forEach(day=>{
    const s=PROGRAM.find(p=>p.day===day);if(!s)return;
    (s.groups||[]).forEach(group=>{
      if(group.condType){
        const ck=group.exercises.map(e=>e.id).join("+")+"_w"+week;
        const d=(condV2||{})[ck];const done=(condV2Done||{})[ck]?"✓":"";
        if(d||done)rows.push([group.label+" Circuit",week,"amrap",`cap ${d?.cap||""}`,`rounds ${d?.rounds||""}`,`final ${d?.finalReps||""}`,done,d?.note||""]);
      }
      (group.exercises||[]).forEach(ex=>{
        if(!ex.condType)return;
        const ck=ex.id+"_w"+week;const d=(condV2||{})[ck];const done=(condV2Done||{})[ck]?"✓":"";
        if(!d&&!done)return;
        let f1="",f2="",f3="";
        if(ex.condType==="interval"){f1=`rounds ${d?.rounds||""}`;f2=`${ex.condMetric||"perf"} ${d?.metric||""}`;}
        else if(ex.condType==="carry"){f1=`${d?.weight||""} lbs`;f2=`${d?.distance||""} yds`;f3=`rounds ${d?.rounds||""}`;}
        else if(ex.condType==="reps"){f1=`reps ${d?.reps||""}`;f2=`rounds ${d?.rounds||""}`;f3=`load ${d?.load||""}`;}
        rows.push([ex.name,week,ex.condType,f1,f2,f3,done,d?.note||""]);
      });
    });
  });
  rows.push([]);
  rows.push(["READINESS LOG"]);rows.push(["Date","Score","Tier"]);
  Object.entries(readinessLog).forEach(([date,entry])=>{rows.push([date,entry.score,entry.tier]);});
  rows.push([]);
  rows.push(["BODY COMPOSITION LOG"]);rows.push(["Date","Weight (lbs)","Body Fat %"]);
  (bodyCompLog||[]).forEach(entry=>{rows.push([entry.date,entry.weight,entry.bf||""]);});
  const csv=rows.map(r=>r.map(cell=>`"${String(cell||"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=`raymond_tm_week${week}_${new Date().toISOString().split("T")[0]}.csv`;a.click();
  URL.revokeObjectURL(url);
}

// ── MAIN APP ─────────────────────────────────────────────────────
function App(){
  const[view,setView]=useState("session");
  const[activeDay,setActiveDay]=useState("MON");
  // Session drill-down: "week" (week list) → "day" (Mon–Fri) → "workout" (exercise list)
  const[sessionLevel,setSessionLevel]=useState("week");
  const[focusUnitId,setFocusUnitId]=useState(null); // which exercise/superset page is open
  const[exDone,setExDone]=useState(()=>LS.get("tm_ex_done")||{});
  const[customNames,setCustomNames]=useState(()=>LS.get("tm_custom_names")||{});
  const[customPrimary,setCustomPrimary]=useState(()=>LS.get("tm_custom_primary")||{});
  const[week,setWeek]=useState(()=>LS.get("tm_week")||1);
  const[sessionLog,setSessionLog]=useState(()=>LS.get("tm_log")||{});
  const[completed,setCompleted]=useState(()=>LS.get("tm_completed")||{});
  const[readinessLog,setReadinessLog]=useState(()=>LS.get("tm_readiness")||{});
  const[condLog,setCondLog]=useState(()=>LS.get("tm_cond")||{});
  const[condV2State,setCondV2State]=useState(()=>{
    const raw=LS.get("tm_cond_v2")||{};
    return{data:raw.data||{},done:raw.done||{}};
  });
  const condV2=condV2State.data;
  const condV2Done=condV2State.done;
  const[bandLog,setBandLog]=useState(()=>LS.get("tm_bands")||{});
  const[cardioLog,setCardioLog]=useState(()=>LS.get("tm_cardio")||[]);
  const[variantSelections,setVariantSelections]=useState(()=>LS.get("tm_variants")||{});
  const[substitutions,setSubstitutions]=useState(()=>LS.get("tm_substitutions")||{});
  const[replaceEx,setReplaceEx]=useState(null);
  const[pickerEx,setPickerEx]=useState(null);
  const[pickerSide,setPickerSide]=useState(null);
  const[screenFlash,setScreenFlash]=useState(false);
  const[ri,setRi]=useState({bodyBattery:70,sleepScore:75,trainingReadiness:65,hrv:"balanced",restingHR:"at",soreness:2,motivation:8});
  const[todayScore,setTodayScore]=useState(null);
  const[showSummary,setShowSummary]=useState(false);
  const[showResetConfirm,setShowResetConfirm]=useState(false);
  const[editNameFor,setEditNameFor]=useState(null);
  const[editNameVal,setEditNameVal]=useState("");
  const[milestones,setMilestones]=useState(()=>LS.get("tm_milestones")||{totalSessions:0,lastMilestone:0});

  const phase=getPhase(week);
  const session=PROGRAM.find(d=>d.day===activeDay)||PROGRAM[0];
  const today=new Date().toDateString();
  const isComplete=!!completed[activeDay+"_w"+week];
  globalFlashFn=()=>{setScreenFlash(true);setTimeout(()=>setScreenFlash(false),3500);};

  function setWeekSave(w){setWeek(w);LS.set("tm_week",w);}
  function handleLog(key,si,field,val){
    const curr=sessionLog[key]||[];
    const upd=[...curr];if(!upd[si])upd[si]={};upd[si][field]=val;
    const nl={...sessionLog,[key]:upd};setSessionLog(nl);LS.set("tm_log",nl);
  }
  function markComplete(){
    if(isComplete)return;
    const k=activeDay+"_w"+week;
    const nc={...completed,[k]:{date:today,ts:Date.now()}};setCompleted(nc);LS.set("tm_completed",nc);
    const newTotal=(milestones.totalSessions||0)+1;
    const nm={...milestones,totalSessions:newTotal};setMilestones(nm);LS.set("tm_milestones",nm);
    setShowSummary(true);
    setSessionLevel("day");setFocusUnitId(null);
  }
  function resetProgress(){
    // WIPE: completion checkmarks, session counter, conditioning completion flags.
    // Reset to week 1. PRESERVE: all set logs, body comp, cardio, readiness,
    // variant selections, substitutions, and conditioning data entries.
    setCompleted({});LS.set("tm_completed",{});
    const nm={totalSessions:0,lastMilestone:0};setMilestones(nm);LS.set("tm_milestones",nm);
    const clearedCondDone={...condV2State,done:{}};setCondV2State(clearedCondDone);LS.set("tm_cond_v2",clearedCondDone);
    setExDone({});LS.set("tm_ex_done",{});
    setWeekSave(1);
    setActiveDay("MON");
    setSessionLevel("week");
    setFocusUnitId(null);
    setShowResetConfirm(false);
    setView("session");
  }
  function handleReadiness(){
    const score=scoreReadiness(ri);
    const entry={score,tier:getTier(score).tier,date:today};
    const nl={...readinessLog,[today]:entry};setReadinessLog(nl);setTodayScore(score);LS.set("tm_readiness",nl);
  }
  function handleCondLog(key,val){const nl={...condLog,[key]:val};setCondLog(nl);LS.set("tm_cond",nl);}
  function handleCondV2(exKey,data){
    const ns={...condV2State,data:{...condV2State.data,[exKey]:data}};
    setCondV2State(ns);LS.set("tm_cond_v2",ns);
  }
  function handleCondToggle(exKey){
    const cur=!!condV2State.done[exKey];
    const ns={...condV2State,done:{...condV2State.done,[exKey]:!cur}};
    setCondV2State(ns);LS.set("tm_cond_v2",ns);
  }
  function toggleExDone(unitId){
    const k=unitId+"_w"+week;
    const nd={...exDone,[k]:!exDone[k]};
    if(!nd[k])delete nd[k];
    setExDone(nd);LS.set("tm_ex_done",nd);
  }
  function isUnitDone(unit){
    if(unit.kind==="conditioning"){
      const ck=(unit.single?unit.single.id:unit.unitId)+"_w"+week;
      const ck2=unit.unitId+"_w"+week;
      return !!condV2Done[ck]||!!condV2Done[ck2];
    }
    return !!exDone[unit.unitId+"_w"+week];
  }
  function handleBandLog(key,val){const nl={...bandLog,[key]:val};setBandLog(nl);LS.set("tm_bands",nl);}
  function handleCardioLog(log){setCardioLog(log);LS.set("tm_cardio",log);}
  function handleVariantSelect(exId,variantKey){
    const nl=variantKey?{...variantSelections,[exId]:variantKey}:Object.fromEntries(Object.entries({...variantSelections}).filter(([k])=>k!==exId));
    setVariantSelections(nl);LS.set("tm_variants",nl);
  }
  const handleAltSelect=handleVariantSelect;

  // Per-week substitution. Key = originalExId_w{week}. Stores {subId}.
  function subKey(exId){return exId+"_w"+week;}
  function handleReplaceSelect(originalExId,replacementEx){
    const nl={...substitutions,[subKey(originalExId)]:{subId:replacementEx.id,origId:originalExId}};
    setSubstitutions(nl);LS.set("tm_substitutions",nl);
    // Clear any variant selection carried from the original slot
    handleVariantSelect(originalExId,null);
    setReplaceEx(null);
  }
  function handleRevertSub(originalExId){
    const nl=Object.fromEntries(Object.entries({...substitutions}).filter(([k])=>k!==subKey(originalExId)));
    setSubstitutions(nl);LS.set("tm_substitutions",nl);
    handleVariantSelect(originalExId,null);
  }

  // Persistent custom name per exercise id (e.g. label a machine to match your gym).
  function setCustomName(exId,name){
    const trimmed=(name||"").trim();
    const nl={...customNames};
    if(trimmed)nl[exId]=trimmed; else delete nl[exId];
    setCustomNames(nl);LS.set("tm_custom_names",nl);
  }
  // Make a replacement the PERMANENT default for a program slot, all weeks forward.
  // Stores {subId} keyed by the original slot id. Clears the per-week substitution.
  function saveAsNewPrimary(originalExId,replacementId){
    const nl={...customPrimary,[originalExId]:{subId:replacementId}};
    setCustomPrimary(nl);LS.set("tm_custom_primary",nl);
    // Clear the temporary per-week sub since it's now the standing default
    const subs=Object.fromEntries(Object.entries({...substitutions}).filter(([k])=>k!==subKey(originalExId)));
    setSubstitutions(subs);LS.set("tm_substitutions",subs);
  }
  function revertPrimary(originalExId){
    const nl=Object.fromEntries(Object.entries({...customPrimary}).filter(([k])=>k!==originalExId));
    setCustomPrimary(nl);LS.set("tm_custom_primary",nl);
  }

  const sectionLabel={fontSize:"12px",letterSpacing:"2px",color:C.cyan,textTransform:"uppercase",fontWeight:"bold",marginBottom:"10px",display:"block"};

  // Bottom nav tabs
  const TABS=[
    {id:"session",label:"SESSION",icon:"💪"},
    {id:"cardio",label:"CARDIO",icon:"🏃"},
    {id:"readiness",label:"READY",icon:"⚡"},
    {id:"tracker",label:"TRACK",icon:"📊"},
    {id:"bodycomp",label:"BODY",icon:"⚖️"},
    {id:"library",label:"LIBRARY",icon:"📚"},
  ];

  return(
    <>
    <div style={{minHeight:"100vh",background:screenFlash?"#002A35":C.bg,color:C.white,paddingBottom:"96px",transition:screenFlash?"background 0.05s":"background 0.4s"}}>

      {/* ── TOP HEADER ── */}
      <div style={{background:C.surfaceMid,borderBottom:`2px solid ${C.cyan}`,padding:"14px 18px 0",position:"sticky",top:0,zIndex:20}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"10px"}}>
          <div>
            <div style={{fontSize:"10px",letterSpacing:"4px",color:C.textFaint,textTransform:"uppercase",marginBottom:"2px",fontWeight:"bold"}}>AmFam Swift Creek</div>
            <div style={{fontSize:"18px",fontWeight:"bold",letterSpacing:"1px",color:C.white}}>TACTICAL MONSTER</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:"4px"}}>
            {view!=="session"&&<>
            <div style={{fontSize:"10px",color:C.textFaint,letterSpacing:"2px",textTransform:"uppercase",fontWeight:"bold"}}>WEEK</div>
            <div style={{display:"flex",gap:"3px",flexWrap:"wrap",justifyContent:"flex-end"}}>
              {[...Array(16)].map((_,i)=>{
                const wk=i+1;const isA=week===wk;
                const wc=[C.gold,"#FF6B6B",C.cyan,C.green][getPhaseIdxFromWeek(wk)];
                return(<div key={i} onClick={()=>setWeekSave(wk)} style={{width:"22px",height:"22px",borderRadius:"4px",display:"flex",alignItems:"center",justifyContent:"center",background:isA?wc:"transparent",border:`1.5px solid ${isA?wc:C.borderMid}`,color:isA?C.bg:C.textMuted,fontSize:"10px",fontWeight:"bold",cursor:"pointer"}}>{wk}</div>);
              })}
            </div>
            </>}
          </div>
        </div>

        {/* Phase banner — hidden on the week-selection screen */}
        {!(view==="session"&&sessionLevel==="week")&&(
        <div style={{background:C.goldLight,border:`1.5px solid ${C.goldBorder}`,borderLeft:`4px solid ${C.gold}`,borderRadius:"6px",padding:"8px 12px",marginBottom:"10px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <div style={{fontSize:"10px",letterSpacing:"2px",color:C.gold,textTransform:"uppercase",fontWeight:"bold"}}>CYCLE {phase.cycleNum} — {phase.focus}</div>
              <div style={{fontSize:"13px",color:C.white,marginTop:"1px",fontWeight:"bold"}}>RPE {phase.rpe} · {phase.sets} sets · {phase.reps}</div>
            </div>
            <div style={{fontSize:"11px",color:C.textMid,maxWidth:"120px",textAlign:"right",lineHeight:1.4}}>{phase.note}</div>
          </div>
        </div>
        )}
      </div>

      {/* ══ SESSION VIEW — DRILL DOWN: week → day → workout → focus ══ */}
      {view==="session"&&(()=>{
        const units=buildUnits(session);

              </div>
              <div style={{padding:"18px 18px 40px"}}>

                  <div>

                      <ConditioningCard exId={u.single.id+"_w"+week} name={u.single.name}

                              <button onClick={()=>saveAsNewPrimary(exId,substitutions[exId+"_w"+week].subId)}

                              </button>
                            )}
                            {isPerm&&(
                              <button onClick={()=>revertPrimary(exId)}
                                style={{flex:1,minWidth:"130px",padding:"10px",background:"transparent",border:`1.5px solid ${C.goldBorder}`,borderRadius:"8px",color:C.gold,fontSize:"11px",fontWeight:"bold",letterSpacing:"1px",textTransform:"uppercase"}}>
                                ↺ Restore Original
                              </button>
                            )}
                          </div>
                          {isPerm&&(
                            <div style={{fontSize:"11px",color:C.gold,marginTop:"6px",lineHeight:1.4}}>★ This is now your permanent exercise for this slot (all weeks). Replaced the programmed {slot.origName}.</div>
                          )}
                        </div>
                      );
                    })()}
                  <ExerciseRow ex={u.ex} week={week} phase={phase}
                    sessionLog={sessionLog} onLog={handleLog}

                    variantSelections={variantSelections} onVariantSelect={handleVariantSelect}

                    onOpenReplace={(origEx)=>setReplaceEx(origEx)}
                    substitution={substitutions[u.ex.id+"_w"+week]||null}
                    customName={customNames[u.ex.id]||null}
                    onEditName={(exId)=>{setEditNameVal(customNames[exId]||"");setEditNameFor(exId);}}
                    customPrimary={customPrimary}
                    onRevertSub={handleRevertSub}
                    groupType="standalone" isLast={true}/>
                  </div>
                )}

                {/* DONE button (conditioning has its own complete toggle inside the card) */}
                {u.kind!=="conditioning"&&(
                  <button onClick={()=>{toggleExDone(u.unitId);setFocusUnitId(null);}}
                    style={{width:"100%",marginTop:"8px",padding:"16px",background:isUnitDone(u)?C.greenLight:C.cyan,border:`1.5px solid ${isUnitDone(u)?C.green:C.cyan}`,borderRadius:"8px",color:isUnitDone(u)?C.green:C.bg,fontSize:"14px",fontWeight:"bold",letterSpacing:"2px",textTransform:"uppercase"}}>
                    {isUnitDone(u)?"✓ Done — Tap to Undo":"Mark Exercise Done"}
                  </button>
                )}
                {u.kind==="conditioning"&&(
                  <button onClick={()=>setFocusUnitId(null)} style={{width:"100%",marginTop:"8px",padding:"14px",background:"transparent",border:`1.5px solid ${C.borderMid}`,borderRadius:"8px",color:C.textMid,fontSize:"13px",fontWeight:"bold",letterSpacing:"2px",textTransform:"uppercase"}}>← Back to Workout</button>
                )}
              </div>
            </div>
          );
        }

        // ═══ LEVEL 3: WORKOUT OVERVIEW (exercise list for the day) ═══
        if(sessionLevel==="workout"){
          const allDone=units.length>0&&units.every(u=>isUnitDone(u));
          return(
            <div>
              <div style={{padding:"14px 18px",background:C.surfaceMid,borderBottom:`1px solid ${C.border}`,position:"sticky",top:0,zIndex:15}}>
                <button onClick={()=>{setSessionLevel("day");}} style={{background:"transparent",border:"none",color:C.cyan,fontSize:"15px",fontWeight:"bold",padding:0,display:"flex",alignItems:"center",gap:"6px"}}>‹ Week {week}</button>

                  </div>
                  {isComplete&&<div style={{fontSize:"11px",color:C.green,fontWeight:"bold",letterSpacing:"1px"}}>✓ COMPLETE</div>}

                        <span style={{fontSize:"14px",fontWeight:"bold",color:C.white}}>{item.item}</span>

                </button>
              </div>
            </div>

        // ═══ LEVEL 2: DAY OVERVIEW (Mon–Fri for the selected week) ═══

              </div>
              <div style={{padding:"20px 18px 14px"}}>

              <div style={{padding:"0 18px 40px"}}>
                {DAY_ORDER.map(d=>{

                  const done=!!completed[d+"_w"+week];
                  const allUnitsDone=dayUnitsDone(dObj);
                  return(
                    <div key={d} onClick={()=>{setActiveDay(d);setSessionLevel("workout");setFocusUnitId(null);}}

                      <div style={{width:"30px",height:"30px",borderRadius:"50%",border:`2px solid ${done?C.green:C.borderMid}`,background:done?C.green:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>

            {[...Array(16)].map((_,i)=>{

                ))}

            </div>

          {[{label:"Soreness / Pain (0–10)",key:"soreness",hint:"0 = none · 10 = severe"},{label:"Motivation (0–10)",key:"motivation",hint:"0 = none · 10 = fired up"}].map(f=>(
            <div key={f.key} style={{background:C.surface,border:`1.5px solid ${C.borderMid}`,borderRadius:"8px",padding:"14px 16px",marginBottom:"10px"}}>
              <div style={{fontSize:"12px",color:C.textMid,letterSpacing:"1px",textTransform:"uppercase",marginBottom:"3px",fontWeight:"bold"}}>{f.label}</div>
              <div style={{fontSize:"11px",color:C.textFaint,marginBottom:"10px",fontWeight:"500"}}>{f.hint}</div>
              <input type="number" placeholder="0–10" min={0} max={10} value={ri[f.key]||""} onChange={e=>setRi({...ri,[f.key]:parseFloat(e.target.value)||0})} style={{textAlign:"left"}}/>
            </div>
          ))}
          <button onClick={handleReadiness} style={{width:"100%",padding:"16px",background:C.cyan,border:"none",borderRadius:"8px",color:C.bg,fontSize:"13px",fontWeight:"bold",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"24px"}}>CALCULATE READINESS</button>
          {todayScore!==null&&(()=>{
            const inputs=[["Body Battery",parseFloat((ri.bodyBattery/10).toFixed(1))],["Sleep Score",parseFloat((ri.sleepScore/10).toFixed(1))],["Training Readiness",parseFloat((ri.trainingReadiness/10).toFixed(1))],["HRV Status",({balanced:10,favorable:7,unbalanced:4,poor:1})[ri.hrv]||5],["Resting HR",({at:10,"1-3":7,"4-6":4,"7+":1})[ri.restingHR]||5],["Soreness",parseFloat((10-ri.soreness).toFixed(1))],["Motivation",parseFloat(ri.motivation.toFixed(1))]];

                <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"10px",paddingBottom:"8px",borderBottom:`2px solid ${C.cyanBorder}`}}>

                  const slot=resolveSlot(origEx,week,substitutions,customPrimary);

                  const variantKey=variantSelections[ex.id]||null;
                  const logA=sessionLog[slot.logKey]||[];
                  const done=(logA||[]).filter(s=>s&&s.weight&&s.reps);
                  const lastPerfT=findLastPerformance(sessionLog,ex.id,week,slot.isSub?("_sub_"+(substitutions[ex.id+"_w"+week]||{}).subId):"");

                      {done.length>0?(
                        <div style={{display:"flex",gap:"5px",flexWrap:"wrap"}}>

                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
